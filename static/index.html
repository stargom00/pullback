<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>눌림목 스캐너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C111B; --surface:#141C2B; --surface2:#1A2436; --line:#233047;
  --text:#E6ECF5; --muted:#8A97AC; --dim:#5A6578;
  --up:#FF5A6E; --down:#4D8DFF; --amber:#F2B33D; --green:#3DD68C;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',sans-serif;min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 24px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
h1 .dot{color:var(--amber)}
h1 .ver{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;vertical-align:2px}
.sub{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:3px}
.tab{border:none;background:none;color:var(--muted);font:inherit;font-size:13px;
  padding:6px 14px;border-radius:6px;cursor:pointer}
.tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

.refresh{border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
.refresh:hover{border-color:var(--amber)}

.statusbar{padding:12px 24px;font-size:12px;color:var(--muted);
  display:flex;gap:16px;flex-wrap:wrap}
.statusbar b{color:var(--text)}
.journal-btn{width:100%;margin-top:10px;padding:7px;background:transparent;
  border:1px dashed var(--line);color:var(--muted);border-radius:8px;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .12s}
.journal-btn:hover{border-color:var(--amber);color:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:24px;width:min(440px,92vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal .auto{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:16px;
  font-size:12px;color:var(--muted);line-height:1.7}
.modal .auto b{color:var(--text)}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:9px 11px;border-radius:8px;font-size:14px;font-family:inherit;
  box-sizing:border-box}
.modal textarea{resize:vertical;min-height:48px}
.modal .row{display:flex;gap:10px}
.modal .row>div{flex:1}
.modal .actions{display:flex;gap:10px;margin-top:18px}
.modal .actions button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit}
.modal .save{background:var(--amber);color:#000}
.modal .cancel{background:var(--surface2);color:var(--text)}
.jrnl-wrap{padding:0 24px 40px}
.jrnl-tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.jrnl-tools button{padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:inherit}
.jrnl-tools .exp{background:var(--amber);color:#000;border:none;font-weight:600}
.jrnl-tools .stat{color:var(--muted);font-size:13px;margin-left:auto}
.jtable{width:100%;border-collapse:collapse;font-size:12.5px}
.jtable th,.jtable td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);
  white-space:nowrap}
.jtable th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase}
.jtable td.mono{font-family:var(--mono)}
.jtable .del{color:#FF6B6B;cursor:pointer}
.jtable tr.open-pos{background:rgba(242,179,61,.04)}
.jtable input.result{width:70px;background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:4px 6px;border-radius:6px;font-size:12px;font-family:var(--mono)}
.jrnl-empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.7}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 24px 10px;font-size:12px}
.legend .lg{color:var(--muted);cursor:help;display:inline-flex;align-items:center;gap:5px}
.legend .lg-h{color:var(--text);opacity:.7}
.legend .lg:hover{color:var(--text)}
@media (max-width:600px){.legend{padding:0 16px 10px;gap:12px}}
.sectorbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 12px}
.sectorbar:empty{padding:0}
.alert-tag{font-size:11px;color:#FF6B6B;background:rgba(255,107,107,.12);
  padding:2px 7px;border-radius:6px;font-weight:600;vertical-align:middle}
.alert-mgr{margin-left:12px;font-size:12px;color:var(--muted);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.alert-mgr:hover{color:var(--amber)}
.alert-panel{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);
  display:none;gap:8px;align-items:center;flex-wrap:wrap}
.alert-panel.open{display:flex}
.alert-panel input,.alert-panel select{background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.alert-panel button{background:var(--amber);color:#000;border:none;padding:6px 14px;
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.alert-list{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px}
.alert-list .chip{font-size:11px;background:rgba(255,107,107,.12);color:#FF6B6B;
  padding:3px 8px;border-radius:6px;cursor:pointer}
.alert-list .chip:hover{text-decoration:line-through}
@media (max-width:600px){.alert-panel{padding:12px 16px}}
.schip{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .12s}
.schip:hover{border-color:var(--amber);color:var(--text)}
.schip.on{background:var(--surface2);color:var(--text);border-color:var(--amber)}
.schip b{color:var(--amber);margin-left:5px}
.schip .clear{color:var(--muted)}
@media (max-width:600px){.sectorbar{padding:0 16px 12px}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:14px;padding:0 24px 40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:#33455F}
.card.fired{border-color:rgba(242,179,61,.55)}
.card-top{display:flex;align-items:flex-start;gap:12px}
.name{font-size:15px;font-weight:700;line-height:1.2}
.tick{font-size:11px;color:var(--muted);margin-top:2px}
.mkt{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}

.score-ring{position:relative;width:46px;height:46px;flex:none}
.score-ring svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:600}

.price-row{display:flex;align-items:baseline;gap:8px}
.price{font-size:17px;font-weight:600}
.chg{font-size:13px;font-weight:500}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}

.spark{width:100%;height:64px;display:block}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  border-top:1px solid var(--line);padding-top:12px}
.metric .k{font-size:10px;color:var(--muted);margin-bottom:3px}
.metric .v{font-size:13px;font-weight:500}

.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 8px;border-radius:99px;
  background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.on{color:var(--green);border-color:rgba(61,214,140,.35)}

.empty{padding:80px 24px;text-align:center;color:var(--muted);font-size:14px}
.loading{padding:80px 24px;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--amber);
  border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:600px){header{padding:16px}.grid{padding:0 16px 32px;grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div>
    <h1>눌림목 스캐너 <span class="ver">v4.0</span> <span class="dot">●</span></h1>
    <div class="sub" id="subDesc">우상향 추세(200일선) · 이평선 지지 · 거래량 수축 · RS 50+</div>
  </div>
  <div class="tabs" role="tablist" id="modeTabs">
    <button class="tab active" data-mode="pullback">눌림목</button>
    <button class="tab" data-mode="turnaround">추세전환</button>
    <button class="tab" data-mode="leader">대장후보</button>
    <button class="tab" data-mode="super">⭐슈퍼대장</button>
    <button class="tab" data-mode="journal">📒 내 일지</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab active" data-market="all">전체</button>
    <button class="tab" data-market="kr">한국</button>
    <button class="tab" data-market="us">미국</button>
  </div>
  <button class="refresh" id="refresh">다시 스캔</button>
</header>

<div class="statusbar" id="status"></div>
<div class="legend" id="legend">
  <span class="lg" title="RS 90 이상 주도주. 시장 상위 10% 안에 드는 강자.">👑 주도주<span class="lg-h">RS 90+</span></span>
  <span class="lg" title="당일 +4% 이상 + (추세선 돌파 또는 피벗 2% 이내). 지금 진입 구간에서 출발 중이라는 신호.">🔥 트리거<span class="lg-h">오늘 출발</span></span>
  <span class="lg" title="시장경보(투경/투주/정지) 종목. 경보종목 관리에서 직접 등록한 것.">⚠️ 경보/리스크<span class="lg-h">주의</span></span>
  <span class="lg" title="점수 링 아래 '전일 NN' = 🔥 발동 전날의 셋업 점수. 높을수록 좋은 자리에서 출발한 것.">⭕ 점수<span class="lg-h">셋업 완성도</span></span>
</div>
<div class="sectorbar" id="sectorbar"></div>
<div class="alert-panel" id="alertPanel">
  <input id="alertTicker" placeholder="티커 (예: 347850.KQ)" style="width:180px">
  <select id="alertKind">
    <option>투경</option><option>투주</option><option>정지</option><option>단기과열</option>
  </select>
  <button id="alertAdd">추가</button>
  <div class="alert-list" id="alertList"></div>
</div>
<div id="content"><div class="loading"><div class="spinner"></div>스캔 중…</div></div>

<script>
const fmtPrice = (p, mkt) => mkt === 'KR'
  ? Math.round(p).toLocaleString('ko-KR') + '원'
  : '$' + p.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

function sparkSVG(closes, ma20) {
  const W = 300, H = 64, PAD = 4;
  const vals = closes.concat(ma20.filter(v => v != null));
  const min = Math.min(...vals), max = Math.max(...vals);
  const x = i => PAD + i * (W - 2 * PAD) / (closes.length - 1);
  const y = v => H - PAD - (v - min) / (max - min || 1) * (H - 2 * PAD);
  const path = arr => arr.map((v, i) => v == null ? '' :
    `${arr.slice(0, i).every(p => p == null) ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');

  // 눌림 구간 음영: 60봉 내 최고점 이후 구간
  const hiIdx = closes.indexOf(Math.max(...closes));
  const zone = hiIdx < closes.length - 1
    ? `<rect x="${x(hiIdx)}" y="0" width="${x(closes.length - 1) - x(hiIdx)}" height="${H}"
        fill="rgba(242,179,61,.07)"/>` : '';
  const last = closes.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    ${zone}
    <path d="${path(ma20)}" fill="none" stroke="#4D8DFF" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
    <path d="${path(closes)}" fill="none" stroke="#E6ECF5" stroke-width="1.5"/>
    <circle cx="${x(last)}" cy="${y(closes[last])}" r="3" fill="#F2B33D"/>
  </svg>`;
}

function scoreRing(score) {
  const r = 19, c = 2 * Math.PI * r, off = c * (1 - score / 100);
  const color = score >= 75 ? 'var(--green)' : score >= 55 ? 'var(--amber)' : 'var(--muted)';
  return `<div class="score-ring" title="눌림목 점수 ${score}">
    <svg width="46" height="46"><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg>
    <div class="score-num mono">${Math.round(score)}</div></div>`;
}

function card(s) {
  const chgCls = s.change_pct >= 0 ? 'up' : 'down';
  const chgSign = s.change_pct >= 0 ? '+' : '';
  return `<div class="card${s.triggered ? ' fired' : ''}">
    <div class="card-top">
      <div>
        <div class="name">${s.triggered ? '🔥 ' : ''}${s.leader ? '👑 ' : ''}${s.name}${s.alert ? ` <span class="alert-tag" title="시장경보">⚠️ ${s.alert}</span>` : ''}<span class="mkt">${s.market}</span></div>
        <div class="tick mono">${s.ticker}${s.sector && s.sector !== '기타' ? ` · ${s.sector}` : ''}</div>
      </div>
      <div style="margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:2px">
        ${scoreRing(s.score)}
        ${s.setup_score != null ? `<div class="mono" style="font-size:10px;color:var(--amber)">전일 ${Math.round(s.setup_score)}</div>` : ''}
      </div>
    </div>
    <div class="price-row mono">
      <span class="price">${fmtPrice(s.close, s.market)}</span>
      <span class="chg ${chgCls}">${chgSign}${s.change_pct}%</span>
    </div>
    ${sparkSVG(s.spark, s.spark_ma20)}
    ${s.mode === 'super' ? `
    <div class="metrics mono">
      <div class="metric"><div class="k">상태</div><div class="v" style="font-size:12px">${s.status}</div></div>
      <div class="metric"><div class="k">고점까지</div><div class="v">${s.dist_from_high_pct}%</div></div>
      <div class="metric"><div class="k">담을곳</div><div class="v">${fmtPrice(s.buy_zone, s.market)}</div></div>
      <div class="metric"><div class="k">RSI</div><div class="v">${s.rsi}</div></div>
    </div>` : s.mode === 'leader' ? `
    <div class="metrics mono">
      <div class="metric"><div class="k">고점까지</div><div class="v">${s.dist_from_high_pct}%</div></div>
      <div class="metric"><div class="k">20일선 위</div><div class="v">+${s.ma20_dist_pct}%</div></div>
      <div class="metric"><div class="k">거래량비</div><div class="v">${s.vol_ratio}×</div></div>
      <div class="metric"><div class="k">RSI</div><div class="v">${s.rsi}</div></div>
    </div>` : s.mode === 'turnaround' ? `
    <div class="metrics mono">
      <div class="metric"><div class="k">정배열</div><div class="v">D+${s.align_days}</div></div>
      <div class="metric"><div class="k">200일선 위</div><div class="v">+${s.ma200_dist_pct}%</div></div>
      <div class="metric"><div class="k">거래량비</div><div class="v">${s.vol_ratio}× <span style="color:${s.ud >= 1 ? 'var(--green)' : 'var(--up)'};font-size:11px">U/D ${s.ud}</span></div></div>
      <div class="metric"><div class="k">RSI</div><div class="v">${s.rsi}</div></div>
    </div>` : `
    <div class="metrics mono">
      <div class="metric"><div class="k">눌림 깊이</div><div class="v">-${s.pullback_pct}%</div></div>
      <div class="metric"><div class="k">지지선</div><div class="v">${s.support_ma} <span style="color:var(--muted);font-size:11px">${s.ma_dist_pct}%</span></div></div>
      <div class="metric"><div class="k">거래량비</div><div class="v">${s.vol_ratio}×</div></div>
      <div class="metric"><div class="k">RSI</div><div class="v">${s.rsi}</div></div>
    </div>`}
    ${s.mode === 'super' ? `
    <div class="badges">
      <span class="badge on">RS ${s.rs}</span>
      ${(() => {
        if (s.status === '신고가') return '<span class="badge">추격 주의</span>';
        if (s.status && s.status.includes('지지✓')) return '<span class="badge on">매수 확인✓</span>';
        if (s.status && s.status.includes('지지')) return '<span class="badge on">매수 확인✓</span>';
        if (s.status && s.status.includes('테스트')) return '<span class="badge on">지지 테스트중</span>';
        if (s.near_buy_zone) return '<span class="badge on">담을곳 근접</span>';
        if (s.status === '조정 깊음') return '<span class="badge">추세 점검</span>';
        return `<span class="badge">담을곳 -${s.buy_zone_dist_pct}%</span>`;
      })()}
      ${s.rs_mom >= 10 ? '<span class="badge on">RS 개선↗</span>' : ''}
    </div>` : s.mode === 'leader' ? `
    <div class="badges">
      <span class="badge on">RS ${s.rs}</span>
      ${s.at_new_high ? '<span class="badge on">신고가</span>' : '<span class="badge">고점 근접</span>'}
      <span class="badge">눌림 대기</span>
    </div>` : `
    <div class="metrics mono" style="border-top:none;padding-top:0">
      <div class="metric"><div class="k">RS</div><div class="v" style="color:${s.rs >= 80 ? 'var(--green)' : s.rs >= 65 ? 'var(--amber)' : 'var(--text)'}">${s.rs ?? '-'}${s.rs_mom >= 10 ? ' <span style="color:var(--green)" title="상대강도 개선 중">↗</span>' : ''}</div></div>
      <div class="metric"><div class="k">피벗 (${s.pivot_type ?? '돌파가'})</div><div class="v">${fmtPrice(s.pivot, s.market)} <span style="color:${s.pivot_dist_pct >= 15 ? 'var(--up)' : 'var(--muted)'};font-size:11px">+${s.pivot_dist_pct}%${s.pivot_dist_pct >= 15 ? ' 관찰' : ''}</span></div></div>
      <div class="metric"><div class="k">손절 기준</div><div class="v">${fmtPrice(s.stop, s.market)}</div></div>
      <div class="metric"><div class="k">리스크</div><div class="v" style="${s.risk_warn ? 'color:var(--up)' : ''}">${s.risk_pct}%${s.risk_warn ? ' ⚠️' : ''}</div></div>
    </div>`}
    ${(s.mode === 'leader' || s.mode === 'super') ? '' : s.mode === 'turnaround' ? `
    <div class="badges">
      <span class="badge on">정배열 전환</span>
      <span class="badge ${s.rs_mom >= 10 ? 'on' : ''}">RS 개선</span>
      <span class="badge ${s.vol_ratio >= 1.2 && s.ud >= 1 ? 'on' : ''}">거래량 확장</span>${s.tl_break ? '<span class="badge on">추세선 돌파</span>' : ''}
    </div>` : `
    <div class="badges">
      <span class="badge ${s.vol_dry ? 'on' : ''}">거래량 수축</span>
      <span class="badge ${s.tightening ? 'on' : ''}">변동폭 축소</span>
      <span class="badge ${s.recent_high_ok ? 'on' : ''}">고점 유지</span>${s.tl_break ? '<span class="badge on">추세선 돌파</span>' : ''}
    </div>`}
    ${(s.mode === 'pullback' || s.mode === 'turnaround') ? `
    <button class="journal-btn" onclick='openJournal(this)' data-stock='${JSON.stringify(s).replace(/'/g, "&#39;")}'>+ 일지에 추가</button>` : ''}
  </div>`;
}

let market = 'all';
let mode = 'pullback';
let sectorFilter = null;
let lastHits = [];
const DESC = {
  pullback: '우상향 추세(200일선) · 이평선 지지 · 거래량 수축 · RS 50+',
  turnaround: '역배열→정배열 첫 전환(1개월 내) · RS 개선 중 · 200일선 +25% 이내',
  leader: 'RS 88+ · 신고가 8% 이내 · 아직 눌림 전 — 지금은 못 사도 눌림 오면 1순위',
  super: 'RS 95+ — 지금 시장에서 가장 강한 종목들 (위치 불문). 상태 라벨로 담을곳/대기 판단'
};

async function load(refresh = false) {
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  content.innerHTML = '<div class="loading"><div class="spinner"></div>스캔 중… (첫 스캔은 1~2분 걸릴 수 있어요)</div>';
  status.innerHTML = '';
  try {
    const res = await fetch(`/api/scan?market=${market}&mode=${mode}${refresh ? '&refresh=true' : ''}`);
    const data = await res.json();
    status.innerHTML = `<span><b>${data.fetched ?? data.scanned}</b>/${data.scanned}개 종목 스캔</span>
      <span>${mode === 'turnaround' ? '추세전환' : '눌림목'} 후보 <b>${data.hits.length}</b>개</span>
      <span>기준 ${data.generated_at}${data.cached ? ' (캐시)' : ''}</span>
      ${data.warn_count ? `<span style="color:#FF6B6B">⚠️ 경보/과대리스크 ${data.warn_count}</span>` : ''}
      <span class="alert-mgr" id="alertToggle">경보종목 관리</span>`;
    const tg = document.getElementById('alertToggle');
    if (tg) tg.addEventListener('click', () => {
      document.getElementById('alertPanel').classList.toggle('open');
      loadAlertList();
    });
    lastHits = data.hits;
    sectorFilter = null;
    renderSectors(data.sector_summary || []);
    renderCards();
  } catch (e) {
    content.innerHTML = '<div class="empty">스캔에 실패했습니다. 서버 로그를 확인한 뒤 다시 시도해 주세요.</div>';
  }
}

async function loadAlertList() {
  try {
    const r = await fetch('/api/alerts'); const data = await r.json();
    const list = document.getElementById('alertList');
    const keys = Object.keys(data);
    list.innerHTML = keys.length
      ? keys.map(t => `<span class="chip" data-t="${t}" title="클릭하면 삭제">${t} ${data[t]} ✕</span>`).join('')
      : '<span style="color:var(--muted);font-size:12px">등록된 경보 종목 없음</span>';
    list.querySelectorAll('.chip').forEach(c => c.addEventListener('click', async () => {
      await fetch('/api/alerts', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ticker: c.dataset.t, remove: true})});
      loadAlertList(); load(true);
    }));
  } catch(e) {}
}

document.getElementById('alertAdd').addEventListener('click', async () => {
  const t = document.getElementById('alertTicker').value.trim();
  const k = document.getElementById('alertKind').value;
  if (!t) return;
  await fetch('/api/alerts', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ticker: t, kind: k})});
  document.getElementById('alertTicker').value = '';
  loadAlertList(); load(true);
});

function renderSectors(summary) {
  const bar = document.getElementById('sectorbar');
  if (!summary.length) { bar.innerHTML = ''; return; }
  const chips = summary.map(s =>
    `<span class="schip" data-sec="${s.sector}">${s.sector}<b>${s.count}</b></span>`
  ).join('');
  bar.innerHTML = chips;
  bar.querySelectorAll('.schip').forEach(ch => ch.addEventListener('click', () => {
    const sec = ch.dataset.sec;
    sectorFilter = (sectorFilter === sec) ? null : sec;
    bar.querySelectorAll('.schip').forEach(x => x.classList.toggle('on', x.dataset.sec === sectorFilter));
    renderCards();
  }));
}

function renderCards() {
  const content = document.getElementById('content');
  const list = sectorFilter ? lastHits.filter(h => h.sector === sectorFilter) : lastHits;
  content.innerHTML = list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<div class="empty">${sectorFilter ? `'${sectorFilter}' 섹터에 해당 종목이 없습니다.` : `현재 조건을 충족하는 ${mode === 'turnaround' ? '추세전환' : '눌림목'} 종목이 없습니다.<br>장 상황에 따라 비어있는 게 자연스러운 결과예요.`}</div>`;
}

  const content = document.getElementById('content');
  const list = sectorFilter ? lastHits.filter(h => h.sector === sectorFilter) : lastHits;
  content.innerHTML = list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<div class="empty">${sectorFilter ? `'${sectorFilter}' 섹터에 해당 종목이 없습니다.` : `현재 조건을 충족하는 ${mode === 'turnaround' ? '추세전환' : '눌림목'} 종목이 없습니다.<br>장 상황에 따라 비어있는 게 자연스러운 결과예요.`}</div>`;
}

document.querySelectorAll('[data-market]').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  market = t.dataset.market;
  load();
}));
document.querySelectorAll('[data-mode]').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  mode = t.dataset.mode;
  const isJournal = mode === 'journal';
  document.getElementById('content').style.display = isJournal ? 'none' : '';
  document.getElementById('journalView').style.display = isJournal ? 'block' : 'none';
  document.getElementById('subDesc').textContent = isJournal
    ? '🔥/추세전환 신호를 기록하고 결과(R)를 추적 — 주말에 CSV로 내보내 구글시트에 백업'
    : DESC[mode];
  if (isJournal) { renderJournal(); } else { load(); }
}));

// ════════════════ 매매 일지 (localStorage 기반) ════════════════
const JKEY = 'pullback_journal_v1';

function getJournal() {
  try { return JSON.parse(localStorage.getItem(JKEY) || '[]'); }
  catch(e) { return []; }
}
function setJournal(arr) { localStorage.setItem(JKEY, JSON.stringify(arr)); }

let pendingStock = null;
function openJournal(btn) {
  const s = JSON.parse(btn.dataset.stock.replace(/&#39;/g, "'"));
  pendingStock = s;
  document.getElementById('jmSub').textContent = `${s.name} (${s.ticker}) · ${s.market}`;
  const tab = s.mode === 'turnaround' ? '추세전환' : '눌림목';
  const sig = (s.triggered ? '🔥 트리거 ' : '') + (s.leader ? '👑 ' : '');
  document.getElementById('jmAuto').innerHTML =
    `<b>${tab}</b> 탭 · 섹터 <b>${s.sector || '-'}</b> · RS <b>${s.rs}</b>` +
    `${s.setup_score != null ? ` · 전일점수 <b>${Math.round(s.setup_score)}</b>` : ''}<br>` +
    `${sig ? `신호 <b>${sig}</b> · ` : ''}피벗종류 <b>${s.pivot_type || '-'}</b> · ` +
    `현재가 <b>${fmtPrice(s.close, s.market)}</b> · 리스크 <b>${s.risk_pct != null ? s.risk_pct + '%' : '-'}</b>` +
    `${s.alert ? ` · ⚠️ <b>${s.alert}</b>` : ''}`;
  // 손절 기본값 = 스캐너 손절가
  document.getElementById('jmEntry').value = s.pivot != null ? Math.round(s.close) : '';
  document.getElementById('jmStop').value = s.stop != null ? Math.round(s.stop) : '';
  document.getElementById('jmNote').value = '';
  document.getElementById('journalModal').classList.add('open');
}
function closeJournal() {
  document.getElementById('journalModal').classList.remove('open');
  pendingStock = null;
}
function saveJournal() {
  const s = pendingStock; if (!s) return;
  const entry = parseFloat(document.getElementById('jmEntry').value) || null;
  const stop = parseFloat(document.getElementById('jmStop').value) || null;
  const note = document.getElementById('jmNote').value.trim();
  const riskAmt = (entry && stop && entry > stop) ? ((entry - stop) / entry * 100) : (s.risk_pct ?? null);
  const rec = {
    id: Date.now(),
    date: new Date().toISOString().slice(0, 10),
    ticker: s.ticker, name: s.name, market: s.market, sector: s.sector || '',
    tab: s.mode === 'turnaround' ? '추세전환' : '눌림목',
    signal: (s.triggered ? '🔥' : '') + (s.leader ? '👑' : ''),
    pivot_type: s.pivot_type || '', setup_score: s.setup_score != null ? Math.round(s.setup_score) : '',
    rs: s.rs, entry, stop,
    risk_pct: riskAmt != null ? Math.round(riskAmt * 10) / 10 : '',
    alert: s.alert || '', note,
    exit: '', result_r: '', held_days: '', review: ''
  };
  const j = getJournal(); j.unshift(rec); setJournal(j);
  closeJournal();
}

function renderJournal() {
  const wrap = document.getElementById('journalView');
  const j = getJournal();
  if (!j.length) {
    wrap.innerHTML = `<div class="jrnl-empty">아직 기록이 없어요.<br>
      눌림목·추세전환 탭의 카드에서 <b>"+ 일지에 추가"</b>를 눌러 신호를 기록하세요.<br>
      진입가·손절·근거만 적으면 나머지는 자동으로 채워집니다.</div>`;
    return;
  }
  const openCount = j.filter(r => r.result_r === '').length;
  const closed = j.filter(r => r.result_r !== '' && !isNaN(parseFloat(r.result_r)));
  const avgR = closed.length ? (closed.reduce((a, r) => a + parseFloat(r.result_r), 0) / closed.length).toFixed(2) : '–';
  const winRate = closed.length ? Math.round(closed.filter(r => parseFloat(r.result_r) > 0).length / closed.length * 100) : '–';
  wrap.innerHTML = `
    <div class="jrnl-tools">
      <button class="exp" onclick="exportCSV()">⬇ CSV 내보내기</button>
      <button onclick="if(confirm('일지를 모두 지울까요? 되돌릴 수 없어요.')){setJournal([]);renderJournal();}">전체 삭제</button>
      <span class="stat">총 ${j.length}건 · 진행 ${openCount} · 종료 ${closed.length} · 승률 ${winRate}${winRate!=='–'?'%':''} · 평균 ${avgR}R</span>
    </div>
    <div style="overflow-x:auto">
    <table class="jtable">
      <thead><tr>
        <th>날짜</th><th>종목</th><th>탭</th><th>신호</th><th>섹터</th><th>피벗</th>
        <th>전일점수</th><th>RS</th><th>진입가</th><th>손절</th><th>리스크%</th>
        <th>결과R</th><th>근거/복기</th><th></th>
      </tr></thead>
      <tbody>
        ${j.map(r => `<tr class="${r.result_r===''?'open-pos':''}">
          <td class="mono">${r.date}</td>
          <td>${r.name}<div class="mono" style="font-size:10px;color:var(--muted)">${r.ticker}</div></td>
          <td>${r.tab}</td>
          <td>${r.signal || '-'}</td>
          <td style="font-size:11px;color:var(--muted)">${r.sector || '-'}</td>
          <td style="font-size:11px">${r.pivot_type || '-'}</td>
          <td class="mono">${r.setup_score || '-'}</td>
          <td class="mono">${r.rs ?? '-'}</td>
          <td class="mono">${r.entry ?? '-'}</td>
          <td class="mono">${r.stop ?? '-'}</td>
          <td class="mono">${r.risk_pct || '-'}</td>
          <td><input class="result" value="${r.result_r}" placeholder="R"
              onchange="updateResult(${r.id}, this.value)"></td>
          <td style="white-space:normal;max-width:200px;font-size:11px;color:var(--muted)">${r.note || ''}</td>
          <td><span class="del" onclick="delJournal(${r.id})">✕</span></td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
}

function updateResult(id, val) {
  const j = getJournal();
  const r = j.find(x => x.id === id);
  if (r) { r.result_r = val.trim(); setJournal(j); renderJournal(); }
}
function delJournal(id) {
  setJournal(getJournal().filter(x => x.id !== id));
  renderJournal();
}
function exportCSV() {
  const j = getJournal();
  if (!j.length) return;
  const cols = ['date','ticker','name','market','sector','tab','signal','pivot_type',
    'setup_score','rs','entry','stop','risk_pct','alert','note','exit','result_r','held_days','review'];
  const head = ['날짜','티커','종목','시장','섹터','탭','신호','피벗종류','전일점수','RS',
    '진입가','손절','리스크%','경보','진입근거','청산가','결과R','보유일','복기'];
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [head.join(','), ...j.map(r => cols.map(c => esc(r[c])).join(','))].join('\\r\\n');
  const blob = new Blob(['\\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `눌림목일지_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
document.getElementById('refresh').addEventListener('click', () => load(true));
load();
</script>
