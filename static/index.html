<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>눌림목 스캐너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C111B; --surface:#141C2B; --surface2:#1A2436; --line:#233047;
  --text:#E6ECF5; --muted:#8A97AC; --dim:#5A6578;
  --up:#FF5A6E; --down:#4D8DFF; --amber:#F2B33D; --green:#3DD68C;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',sans-serif;min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 24px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
h1 .dot{color:var(--amber)}
h1 .ver{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;vertical-align:2px}
.sub{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:3px}
.tab{border:none;background:none;color:var(--muted);font:inherit;font-size:13px;
  padding:6px 14px;border-radius:6px;cursor:pointer}
.tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

.refresh{border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
.refresh:hover{border-color:var(--amber)}

.statusbar{padding:12px 24px;font-size:12px;color:var(--muted);
  display:flex;gap:16px;flex-wrap:wrap}
.statusbar b{color:var(--text)}
.idxbar{display:flex;gap:10px;flex-wrap:wrap;padding:10px 24px;
  border-bottom:1px solid var(--line);background:var(--surface);align-items:center}
.mkt-banner{padding:6px 14px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--line)}
.mkt-banner.mkt-good{background:rgba(40,180,120,.1);border-color:rgba(40,180,120,.45);color:#28b478}
.mkt-banner.mkt-neutral{background:rgba(230,170,40,.1);border-color:rgba(230,170,40,.45);color:#e6aa28}
.mkt-banner.mkt-bad{background:rgba(255,90,110,.1);border-color:rgba(255,90,110,.45);color:#FF5A6E}
.idx{display:flex;align-items:baseline;gap:8px;padding:6px 14px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:13px}
.idx .nm{color:var(--muted);font-weight:500}
.idx .vl{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.idx .ch{font-size:12px;font-variant-numeric:tabular-nums}
.idx .ch.up{color:var(--up)} .idx .ch.down{color:var(--down)} .idx .ch.flat{color:var(--muted)}
.entry-sig{margin-top:10px;padding:9px 11px;border-radius:9px;border:1px solid var(--line)}
.entry-sig.sig-ok{background:rgba(40,180,120,.08);border-color:rgba(40,180,120,.4)}
.entry-sig.sig-warn{background:rgba(230,170,40,.08);border-color:rgba(230,170,40,.4)}
.entry-sig.sig-danger{background:rgba(255,90,110,.08);border-color:rgba(255,90,110,.4)}
.entry-sig .sig-head{font-size:13px;font-weight:700;margin-bottom:6px}
.entry-sig.sig-ok .sig-head{color:#28b478}
.entry-sig.sig-warn .sig-head{color:#e6aa28}
.entry-sig.sig-danger .sig-head{color:var(--up)}
.entry-sig .sig-list{display:flex;flex-direction:column;gap:3px}
.entry-sig .chk{font-size:11.5px;color:var(--muted)}
.entry-sig .chk-ok{color:var(--muted)}
.entry-sig .chk-warn{color:#e6aa28}
.entry-sig .chk-danger{color:var(--up)}
.fund-btn{width:100%;margin-top:10px;padding:7px;background:transparent;
  border:1px solid var(--line);color:var(--muted);border-radius:8px;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .12s}
.fund-btn:hover{border-color:var(--accent,#4D8DFF);color:var(--text)}
.fund-btn:disabled{opacity:.6;cursor:default}
.fund-box{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.7}
.fund-box .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fund-box .fchip{padding:3px 9px;border-radius:7px;background:var(--bg);
  border:1px solid var(--line);font-variant-numeric:tabular-nums}
.fund-box .fchip b{color:var(--text);font-weight:600}
.fund-box .vd{font-weight:700;padding:3px 10px;border-radius:7px}
.fund-box .vd.cheap{color:var(--up);border:1px solid var(--up)}
.fund-box .vd.fair{color:var(--muted);border:1px solid var(--line)}
.fund-box .vd.exp{color:var(--down);border:1px solid var(--down)}
.fund-box .note{display:block;margin-top:4px;font-size:11px;opacity:.75}
.journal-btn{width:100%;margin-top:10px;padding:7px;background:transparent;
  border:1px dashed var(--line);color:var(--muted);border-radius:8px;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .12s}
.journal-btn:hover{border-color:var(--amber);color:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.drag-handle{cursor:grab;user-select:none}
.drag-handle:active{cursor:grabbing}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:24px;width:min(440px,92vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal .auto{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:16px;
  font-size:12px;color:var(--muted);line-height:1.7}
.modal .auto b{color:var(--text)}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:9px 11px;border-radius:8px;font-size:14px;font-family:inherit;
  box-sizing:border-box}
.modal textarea{resize:vertical;min-height:48px}
.modal .row{display:flex;gap:10px}
.modal .row>div{flex:1}
.modal .actions{display:flex;gap:10px;margin-top:18px}
.modal .actions button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit}
.modal .save{background:var(--amber);color:#000}
.modal .cancel{background:var(--surface2);color:var(--text)}
.jrnl-wrap{padding:0 24px 40px}
.jrnl-tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.jrnl-tools button{padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:inherit}
.jrnl-tools .exp{background:var(--amber);color:#000;border:none;font-weight:600}
.jrnl-tools .stat{color:var(--muted);font-size:13px;margin-left:auto}
.jtable{width:100%;border-collapse:collapse;font-size:12.5px}
.jtable th,.jtable td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);
  white-space:nowrap}
.jtable th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase}
.jtable td.mono{font-family:var(--mono)}
.jtable .del{color:#FF6B6B;cursor:pointer}
.jtable tr.open-pos{background:rgba(242,179,61,.04)}
.jtable input.result{width:70px;background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:4px 6px;border-radius:6px;font-size:12px;font-family:var(--mono)}
.jrnl-empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.7}
.jrnl-stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sigval{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.sigval-head{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px}
.sigval-tables{display:flex;gap:16px;flex-wrap:wrap}
.sigval-t{flex:1;min-width:260px;border-collapse:collapse;font-size:12px}
.sigval-t th{text-align:left;padding:5px 8px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.sigval-t td{padding:5px 8px;border-bottom:1px solid var(--line);color:var(--text);font-variant-numeric:tabular-nums}
.sigval-note{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5}
.sigval-hint{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.statcard{flex:1;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.statcard-t{font-size:13px;font-weight:700;margin-bottom:4px}
.statcard-v{font-size:12px;color:var(--muted)}
.jrnl-filter{display:flex;gap:8px;margin-bottom:14px}
.fbtn{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.fbtn.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:600}
.ein{background:#0d1420;border:1px solid var(--line);border-radius:6px;color:var(--text);
  padding:5px 7px;font-size:12px;font-family:inherit;width:64px}
textarea.ein{line-height:1.5;resize:vertical}
.edit-btn,.save-btn{cursor:pointer;font-size:13px;margin-right:6px}
tr.editing{background:rgba(242,179,61,.06)}
.tab-exp{position:relative}
.exp-tag{font-size:8px;background:rgba(168,85,247,.25);color:#c084fc;
  padding:1px 4px;border-radius:4px;margin-left:4px;vertical-align:middle;font-weight:700}
.surge-warn{background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);
  border-radius:8px;padding:8px 11px;font-size:11px;color:#c084fc;margin-top:8px;line-height:1.5}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 24px 10px;font-size:12px}
.legend .lg{color:var(--muted);cursor:help;display:inline-flex;align-items:center;gap:5px}
.legend .lg-h{color:var(--text);opacity:.7}
.legend .lg:hover{color:var(--text)}
@media (max-width:600px){.legend{padding:0 16px 10px;gap:12px}}
.sectorbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 12px}
.sectorbar:empty{padding:0}
.alert-tag{font-size:11px;color:#FF6B6B;background:rgba(255,107,107,.12);
  padding:2px 7px;border-radius:6px;font-weight:600;vertical-align:middle}
.climax-tag{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;
  vertical-align:middle;margin-left:4px}
.climax-tag.danger{color:#FF6B6B;background:rgba(255,107,107,.15)}
.climax-tag.caution{color:#f5c451;background:rgba(245,196,81,.12)}
.alert-mgr{margin-left:12px;font-size:12px;color:var(--muted);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.alert-mgr:hover{color:var(--amber)}
.alert-panel{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);
  display:none;gap:8px;align-items:center;flex-wrap:wrap}
.alert-panel.open{display:flex}
.alert-panel input,.alert-panel select{background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.alert-panel button{background:var(--amber);color:#000;border:none;padding:6px 14px;
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.alert-list{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px}
.alert-list .chip{font-size:11px;background:rgba(255,107,107,.12);color:#FF6B6B;
  padding:3px 8px;border-radius:6px;cursor:pointer}
.alert-list .chip:hover{text-decoration:line-through}
@media (max-width:600px){.alert-panel{padding:12px 16px}}
.schip{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .12s}
.schip:hover{border-color:var(--amber);color:var(--text)}
.schip.on{background:var(--surface2);color:var(--text);border-color:var(--amber)}
.schip b{color:var(--amber);margin-left:5px}
.schip .clear{color:var(--muted)}
@media (max-width:600px){.sectorbar{padding:0 16px 12px}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:14px;padding:0 24px 40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:#33455F}
.card.fired{border-color:rgba(242,179,61,.55)}
.card.fav{border-color:rgba(245,196,81,.5);box-shadow:0 0 0 1px rgba(245,196,81,.25)}
.fav-btn{background:none;border:none;cursor:pointer;font-size:20px;line-height:1;
  color:var(--muted);padding:0;margin-top:1px;transition:color .15s;flex-shrink:0}
.fav-btn:hover{color:#f5c451}
.fav-btn.on{color:#f5c451}
.card-top{display:flex;align-items:flex-start;gap:12px}
.name{font-size:15px;font-weight:700;line-height:1.2}
.tick{font-size:11px;color:var(--muted);margin-top:2px}
.mkt{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}

.score-ring{position:relative;width:46px;height:46px;flex:none}
.score-ring svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:600}

.price-row{display:flex;align-items:baseline;gap:8px}
.price{font-size:17px;font-weight:600}
.chg{font-size:13px;font-weight:500}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}

.spark{width:100%;height:64px;display:block}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  border-top:1px solid var(--line);padding-top:12px}
.metric .k{font-size:10px;color:var(--muted);margin-bottom:3px}
.metric .v{font-size:13px;font-weight:500}

.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 8px;border-radius:99px;
  background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.on{color:var(--green);border-color:rgba(61,214,140,.35)}
.badge.warn{color:#f5c451;border-color:rgba(245,196,81,.45);background:rgba(245,196,81,.08)}

.empty{padding:80px 24px;text-align:center;color:var(--muted);font-size:14px}
.loading{padding:80px 24px;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--amber);
  border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:600px){header{padding:16px}.grid{padding:0 16px 32px;grid-template-columns:1fr}}
@media (max-width:600px){#searchBar{padding:0 16px}}
</style>
</head>
<body>

<header>
  <div>
    <h1>눌림목 스캐너 <span class="ver">v4.30.0</span> <span class="dot">●</span></h1>
    <div class="sub" id="subDesc">우상향 추세(200일선) · 이평선 지지 · 거래량 수축 · RS 50+</div>
  </div>
  <div class="tabs" role="tablist" id="modeTabs">
    <button class="tab active" data-mode="imminent">🎯 돌파임박</button>
    <button class="tab" data-mode="pullback">눌림목</button>
    <button class="tab" data-mode="breakout">🚀 돌파</button>
    <button class="tab" data-mode="boxbreak">📦 박스돌파</button>
    <button class="tab" data-mode="turnaround">추세전환</button>
    <button class="tab" data-mode="leader">대장후보</button>
    <button class="tab" data-mode="super">⭐슈퍼대장</button>
    <button class="tab tab-exp" data-mode="surge">⚡급등<span class="exp-tag">실험</span></button>
    <button class="tab" data-mode="journal">📒 내 일지</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab active" data-market="all">전체</button>
    <button class="tab" data-market="kr">한국</button>
    <button class="tab" data-market="us">미국</button>
    <button class="tab" id="strictToggle" title="RS 90+ · 거래량 동반 · 손익비 2R+ · 리스크 8%↓ 만 표시 (주도주 엄선)">🎯 주도주만</button>
  </div>
  <button class="refresh" id="refresh">다시 스캔</button>
</header>

<div class="idxbar" id="idxbar"></div>

<div class="statusbar" id="status"></div>
<div class="legend" id="legend">
  <span class="lg" title="RS 90 이상 주도주. 시장 상위 10% 안에 드는 강자.">👑 주도주<span class="lg-h">RS 90+</span></span>
  <span class="lg" title="당일 +4% 이상 + (추세선 돌파 또는 피벗 2% 이내). 지금 진입 구간에서 출발 중이라는 신호.">🔥 트리거<span class="lg-h">오늘 출발</span></span>
  <span class="lg" title="시장경보(투경/투주/정지) 종목. 경보종목 관리에서 직접 등록한 것.">⚠️ 경보/리스크<span class="lg-h">주의</span></span>
  <span class="lg" title="점수 링 아래 '전일 NN' = 🔥 발동 전날의 셋업 점수. 높을수록 좋은 자리에서 출발한 것.">⭕ 점수<span class="lg-h">셋업 완성도</span></span>
</div>
<div class="sectorbar" id="sectorbar"></div>
<div class="alert-panel" id="alertPanel">
  <input id="alertTicker" placeholder="티커 (예: 347850.KQ)" style="width:180px">
  <select id="alertKind">
    <option>투경</option><option>투주</option><option>정지</option><option>단기과열</option>
  </select>
  <button id="alertAdd">추가</button>
  <div class="alert-list" id="alertList"></div>
</div>
<div id="searchBar" style="display:none;padding:0 24px;margin:0 0 14px">
  <input id="cardSearch" type="text" placeholder="🔍 종목명 또는 코드로 찾기 (예: 삼성, 005930)"
    style="width:100%;box-sizing:border-box;padding:10px 14px;border-radius:10px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:14px;outline:none">
</div>
<div id="content"><div class="loading"><div class="spinner"></div>스캔 중…</div></div>
<div class="jrnl-wrap" id="journalView" style="display:none"></div>

<div class="modal-bg" id="journalModal">
  <div class="modal">
    <h3 id="jmTitle" class="drag-handle">일지에 추가 <span style="font-size:11px;color:var(--muted);font-weight:400">⠿ 드래그</span></h3>
    <div class="sub" id="jmSub"></div>
    <div class="auto" id="jmAuto"></div>
    <div class="row">
      <div><label>진입 가정가</label><input id="jmEntry" inputmode="decimal" placeholder="예: 167000"></div>
      <div><label>손절가</label><input id="jmStop" inputmode="decimal"></div>
    </div>
    <label>진입 근거 (한 줄)</label>
    <textarea id="jmNote" placeholder="예: 추세선 돌파 + 섹터 동조, 피벗 코앞"></textarea>
    <div class="actions">
      <button class="cancel" onclick="closeJournal()">취소</button>
      <button class="save" onclick="saveJournal()">저장</button>
    </div>
  </div>
</div>

<script>
const fmtPrice = (p, mkt) => mkt === 'KR'
  ? Math.round(p).toLocaleString('ko-KR') + '원'
  : '$' + p.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

// 손익비 R 표시: 2R 이상이면 좋음(초록), 1.5 미만이면 나쁨(빨강)
const fmtRR = (rr) => {
  if (rr == null) return '<span class="v">-</span>';
  const color = rr >= 2 ? 'var(--green)' : (rr < 1.5 ? 'var(--up)' : '');
  const warn = rr < 1.5 ? ' ⚠️' : '';
  return `<span class="v" style="${color ? 'color:'+color : ''}">${rr}R${warn}</span>`;
};

// 거래량: 한국은 만/억 주, 미국은 K/M
const fmtVolume = (vol, mkt) => {
  if (!vol) return '-';
  if (mkt === 'KR') {
    if (vol >= 1e8) return (vol/1e8).toFixed(1) + '억주';
    if (vol >= 1e4) return (vol/1e4).toFixed(0) + '만주';
    return Math.round(vol).toLocaleString('ko-KR') + '주';
  }
  if (vol >= 1e6) return (vol/1e6).toFixed(1) + 'M';
  if (vol >= 1e3) return (vol/1e3).toFixed(0) + 'K';
  return Math.round(vol).toString();
};

// 거래대금: 한국은 억/조 원, 미국은 $M/$B
const fmtTurnover = (t, mkt) => {
  if (!t) return '-';
  if (mkt === 'KR') {
    if (t >= 1e12) return (t/1e12).toFixed(2) + '조원';
    if (t >= 1e8) return (t/1e8).toFixed(0) + '억원';
    return Math.round(t/1e4).toLocaleString('ko-KR') + '만원';
  }
  if (t >= 1e9) return '$' + (t/1e9).toFixed(2) + 'B';
  if (t >= 1e6) return '$' + (t/1e6).toFixed(1) + 'M';
  return '$' + Math.round(t).toLocaleString('en-US');
};

function sparkSVG(closes, ma20) {
  const W = 300, H = 64, PAD = 4;
  const vals = closes.concat(ma20.filter(v => v != null));
  const min = Math.min(...vals), max = Math.max(...vals);
  const x = i => PAD + i * (W - 2 * PAD) / (closes.length - 1);
  const y = v => H - PAD - (v - min) / (max - min || 1) * (H - 2 * PAD);
  const path = arr => arr.map((v, i) => v == null ? '' :
    `${arr.slice(0, i).every(p => p == null) ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');

  // 눌림 구간 음영: 60봉 내 최고점 이후 구간
  const hiIdx = closes.indexOf(Math.max(...closes));
  const zone = hiIdx < closes.length - 1
    ? `<rect x="${x(hiIdx)}" y="0" width="${x(closes.length - 1) - x(hiIdx)}" height="${H}"
        fill="rgba(242,179,61,.07)"/>` : '';
  const last = closes.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    ${zone}
    <path d="${path(ma20)}" fill="none" stroke="#4D8DFF" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
    <path d="${path(closes)}" fill="none" stroke="#E6ECF5" stroke-width="1.5"/>
    <circle cx="${x(last)}" cy="${y(closes[last])}" r="3" fill="#F2B33D"/>
  </svg>`;
}

function scoreRing(score) {
  const r = 19, c = 2 * Math.PI * r, off = c * (1 - score / 100);
  const color = score >= 75 ? 'var(--green)' : score >= 55 ? 'var(--amber)' : 'var(--muted)';
  return `<div class="score-ring" title="눌림목 점수 ${score}">
    <svg width="46" height="46"><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg>
    <div class="score-num mono">${Math.round(score)}</div></div>`;
}

// 진입 신호등: 거래량·RS·손익비·리스크 종합 → 진입 양호/주의/자제 + 체크리스트
function entrySignal(s) {
  // 돌파류는 vol_mult, 눌림/임박은 vol_ratio 사용
  const volBreakout = s.vol_mult != null ? s.vol_mult : null;
  const volPullback = s.vol_ratio != null ? s.vol_ratio : null;
  const checks = [];
  let warn = 0, danger = 0;

  // 1) 거래량 동반 (한올 교훈: 거래량 없는 돌파임박은 가짜 위험)
  if (volBreakout != null) {
    if (volBreakout >= 1.5) checks.push(['ok', `거래량 ${volBreakout}× 동반`]);
    else { checks.push(['warn', `거래량 ${volBreakout}× — 동력 부족`]); warn++; }
  } else if (volPullback != null) {
    if (volPullback <= 0.8) checks.push(['ok', `거래량 ${volPullback}× 수축(눌림 양호)`]);
    else if (volPullback < 1.5) checks.push(['warn', `거래량 ${volPullback}× — 애매`]);
    else { checks.push(['ok', `거래량 ${volPullback}× 증가`]); }
  }
  // 2) RS (주도주 여부)
  if (s.rs != null) {
    if (s.rs >= 90) checks.push(['ok', `RS ${s.rs} 주도주급`]);
    else if (s.rs >= 70) checks.push(['warn', `RS ${s.rs} — 주도주는 아님`]);
    else { checks.push(['danger', `RS ${s.rs} 약함`]); danger++; }
  }
  // 3) 손익비
  if (s.rr != null) {
    if (s.rr >= 2) checks.push(['ok', `손익비 ${s.rr}R`]);
    else { checks.push(['danger', `손익비 ${s.rr}R — 가성비 낮음`]); danger++; }
  }
  // 4) 리스크(손절폭)
  if (s.risk_pct != null) {
    if (s.risk_pct <= 8) checks.push(['ok', `리스크 ${s.risk_pct}%`]);
    else { checks.push(['warn', `리스크 ${s.risk_pct}% — 손절폭 넓음`]); warn++; }
  }
  // 5) Anchored VWAP (거래량 최대 봉 이후 평균 매입가 대비 위치)
  if (s.avwap && s.avwap.zone) {
    const z = s.avwap.zone, d = s.avwap.dist_pct;
    if (z === 'healthy') checks.push(['ok', `AVWAP 위 +${d}% — 건강한 우위`]);
    else if (z === 'extended') { checks.push(['warn', `AVWAP +${d}% — 연장(추격주의)`]); warn++; }
    else if (z === 'overheated') { checks.push(['warn', `AVWAP +${d}% — 과열(평균가서 멀어짐)`]); warn++; }
    else if (z === 'near') { checks.push(['warn', `AVWAP ${d}% — 살짝 아래(애매)`]); warn++; }
    else if (z === 'below') { checks.push(['danger', `AVWAP ${d}% — 매물 부담 큼`]); danger++; }
  }

  let level, label;
  if (danger > 0) { level = 'danger'; label = '🔴 진입 자제'; }
  else if (warn >= 2) { level = 'danger'; label = '🔴 진입 자제'; }
  else if (warn === 1) { level = 'warn'; label = '🟡 주의'; }
  else { level = 'ok'; label = '🟢 진입 양호'; }
  return { level, label, checks };
}

        return `<span class="badge">담을곳 -${s.buy_zone_dist_pct}%</span>`;
      })()}
      ${s.rs_mom >= 10 ? '<span class="badge on">RS 개선↗</span>' : ''}
    </div>` : s.mode === 'leader' ? `
    <div class="badges">
      <span class="badge on">RS ${s.rs}</span>
      ${s.at_new_high ? '<span class="badge on">신고가</span>' : '<span class="badge">고점 근접</span>'}
      <span class="badge">눌림 대기</span>
    </div>` : `
    <div class="metrics mono" style="border-top:none;padding-top:0">
      <div class="metric"><div class="k">RS</div><div class="v" style="color:${s.rs >= 80 ? 'var(--green)' : s.rs >= 65 ? 'var(--amber)' : 'var(--text)'}">${s.rs ?? '-'}${s.rs_mom >= 10 ? ' <span style="color:var(--green)" title="상대강도 개선 중">↗</span>' : ''}</div></div>
      <div class="metric"><div class="k">피벗 (${s.pivot_type ?? '돌파가'})</div><div class="v">${fmtPrice(s.pivot, s.market)} <span style="color:${s.pivot_dist_pct >= 15 ? 'var(--up)' : 'var(--muted)'};font-size:11px">+${s.pivot_dist_pct}%${s.pivot_dist_pct >= 15 ? ' 관찰' : ''}</span></div></div>
      <div class="metric"><div class="k">손절 기준</div><div class="v">${fmtPrice(s.stop, s.market)}</div></div>
      <div class="metric"><div class="k">리스크 <span style="font-size:9px;opacity:.6">(${s.entry_basis ?? '피벗'}진입)</span></div><div class="v">${s.risk_pct}%</div></div>
      <div class="metric"><div class="k">손익비 <span style="font-size:9px;opacity:.6">(목표 ${s.target_basis ?? '-'})</span></div>${fmtRR(s.rr)}</div>
    </div>`}
    ${(s.mode === 'leader' || s.mode === 'super' || s.mode === 'breakout' || s.mode === 'surge' || s.mode === 'imminent' || s.mode === 'boxbreak') ? '' : s.mode === 'turnaround' ? `
    <div class="badges">
      <span class="badge on">정배열 전환</span>
      <span class="badge ${s.rs_mom >= 10 ? 'on' : ''}">RS 개선</span>
      <span class="badge ${s.vol_ratio >= 1.2 && s.ud >= 1 ? 'on' : ''}">거래량 확장</span>${s.tl_break ? '<span class="badge on">추세선 돌파</span>' : (s.tl_break_intraday ? '<span class="badge warn" title="장중에 추세선을 넘었지만 아직 종가 확정 전. 마감까지 위를 지키는지 + 거래량을 확인하세요.">장중 돌파 ⚠️ 미확정</span>' : '')}
    </div>` : `
    <div class="badges">
      <span class="badge ${s.vol_dry ? 'on' : ''}">거래량 수축</span>
      <span class="badge ${s.tightening ? 'on' : ''}">변동폭 축소</span>
      <span class="badge ${s.recent_high_ok ? 'on' : ''}">고점 유지</span>${s.tl_break ? '<span class="badge on">추세선 돌파</span>' : (s.tl_break_intraday ? '<span class="badge warn" title="장중에 추세선을 넘었지만 아직 종가 확정 전. 마감까지 위를 지키는지 + 거래량을 확인하세요.">장중 돌파 ⚠️ 미확정</span>' : '')}
    </div>`}
    ${(s.mode === 'pullback' || s.mode === 'turnaround' || s.mode === 'breakout' || s.mode === 'imminent' || s.mode === 'boxbreak') ? (() => {
      const sig = entrySignal(s);
      const items = sig.checks.map(([lv, txt]) => `<span class="chk chk-${lv}">${lv==='ok'?'✓':lv==='warn'?'△':'✕'} ${txt}</span>`).join('');
      return `<div class="entry-sig sig-${sig.level}">
        <div class="sig-head">${sig.label}</div>
        <div class="sig-list">${items}</div>
      </div>`;
    })() : ''}
    ${(s.mode === 'pullback' || s.mode === 'turnaround' || s.mode === 'breakout' || s.mode === 'surge' || s.mode === 'imminent' || s.mode === 'boxbreak') ? `
    <button class="fund-btn" data-ticker="${s.ticker}" data-mkt="${s.market}">📊 밸류 보기</button>
    <div class="fund-box" id="fund-${s.ticker}"></div>
    <button class="journal-btn" onclick="openJournal('${s.ticker}')">+ 일지에 추가</button>` : ''}
  </div>`;
}

let favorites = [];
const DESC = {

};

async function load(refresh = false) {
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  content.innerHTML = '<div class="loading"><div class="spinner"></div>스캔 중… (첫 스캔은 1~2분 걸릴 수 있어요)</div>';
  status.innerHTML = '';
  try {
    const res = await fetch(`/api/scan?market=${market}&mode=${mode}${refresh ? '&refresh=true' : ''}`);
    const data = await res.json();
    status.innerHTML = `<span><b>${data.fetched ?? data.scanned}</b>/${data.scanned}개 종목 스캔</span>
      <span>${mode === 'turnaround' ? '추세전환' : '눌림목'} 후보 <b>${data.hits.length}</b>개</span>
      <span>기준 ${data.generated_at}${data.cached ? ' (캐시)' : ''}</span>
      ${data.warn_count ? `<span style="color:#FF6B6B">⚠️ 경보/과대리스크 ${data.warn_count}</span>` : ''}
      <span class="alert-mgr" id="alertToggle">경보종목 관리</span>`;
    const tg = document.getElementById('alertToggle');
    if (tg) tg.addEventListener('click', () => {
      document.getElementById('alertPanel').classList.toggle('open');
      loadAlertList();
    });
    lastHits = data.hits;
    favorites = data.favorites || [];
    sectorFilter = null;
    searchQuery = '';
    const sb = document.getElementById('cardSearch'); if (sb) sb.value = '';
    document.getElementById('searchBar').style.display = '';
    renderSectors(data.sector_summary || []);
    renderCards();
  } catch (e) {
    content.innerHTML = '<div class="empty">스캔에 실패했습니다. 서버 로그를 확인한 뒤 다시 시도해 주세요.</div>';
  }
}

async function loadAlertList() {
  try {
    const r = await fetch('/api/alerts'); const data = await r.json();
    const list = document.getElementById('alertList');
    const keys = Object.keys(data);
    list.innerHTML = keys.length
      ? keys.map(t => `<span class="chip" data-t="${t}" title="클릭하면 삭제">${t} ${data[t]} ✕</span>`).join('')
      : '<span style="color:var(--muted);font-size:12px">등록된 경보 종목 없음</span>';
    list.querySelectorAll('.chip').forEach(c => c.addEventListener('click', async () => {
      await fetch('/api/alerts', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ticker: c.dataset.t, remove: true})});
      loadAlertList(); load(true);
    }));
  } catch(e) {}
}

document.getElementById('cardSearch').addEventListener('input', (e) => {

});

document.getElementById('alertAdd').addEventListener('click', async () => {
  const t = document.getElementById('alertTicker').value.trim();

function renderSectors(summary) {
  const bar = document.getElementById('sectorbar');
  if (!summary.length) { bar.innerHTML = ''; return; }
  const chips = summary.map(s =>
    `<span class="schip" data-sec="${s.sector}">${s.sector}<b>${s.count}</b></span>`
  ).join('');
  bar.innerHTML = chips;
  bar.querySelectorAll('.schip').forEach(ch => ch.addEventListener('click', () => {
    const sec = ch.dataset.sec;
    sectorFilter = (sectorFilter === sec) ? null : sec;
    bar.querySelectorAll('.schip').forEach(x => x.classList.toggle('on', x.dataset.sec === sectorFilter));
    renderCards();
  }));
}

function renderCards() {
  const content = document.getElementById('content');
  let list = sectorFilter ? lastHits.filter(h => h.sector === sectorFilter) : lastHits.slice();
  // 종목명/코드 검색 필터
  if (searchQuery) {
    const q = searchQuery.toLowerCase().replace(/\s/g, '');
    list = list.filter(h =>
      (h.name || '').toLowerCase().replace(/\s/g, '').includes(q) ||
      (h.ticker || '').toLowerCase().includes(q)
    );
  }
  // 주도주 엄격모드 필터: RS90+ · 거래량 동반 · 손익비 2R+ · 리스크 8%↓
  if (strictMode) {
    list = list.filter(h => {
      const rsOk = (h.rs ?? 0) >= 90;
      const volOk = (h.vol_mult ?? 0) >= 1.5 || (h.vol_ratio ?? 0) >= 1.0;
      const rrOk = (h.rr ?? 0) >= 2;
      const riskOk = (h.risk_pct ?? 99) <= 8;
      return rsOk && volOk && rrOk && riskOk;
    });
  }
  // 즐겨찾기를 최상단으로 (원래 순서는 유지하면서 favorite만 위로)
  const isFav = h => favorites.includes((h.ticker || '').toUpperCase());
  list.sort((a, b) => (isFav(b) ? 1 : 0) - (isFav(a) ? 1 : 0));
  content.innerHTML = list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<div class="empty">${strictMode ? `🎯 주도주 조건(RS 90+ · 거래량 동반 · 손익비 2R+ · 리스크 8%↓)을 모두 충족하는 종목이 없습니다.<br>엄선 필터라 비어있는 게 정상이에요. 해제하려면 '🎯 주도주만'을 다시 누르세요.` : searchQuery ? `'${searchQuery}'(으)로 검색된 종목이 없습니다.<br>이 탭의 스캔 결과 중에서만 검색돼요.` : sectorFilter ? `'${sectorFilter}' 섹터에 해당 종목이 없습니다.` : `현재 조건을 충족하는 ${mode === 'turnaround' ? '추세전환' : '눌림목'} 종목이 없습니다.<br>장 상황에 따라 비어있는 게 자연스러운 결과예요.`}</div>`;
  // 별 버튼 이벤트 바인딩
  content.querySelectorAll('.fav-btn').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    const t = b.dataset.ticker;
    await fetch('/api/favorites', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ticker: t})});
    // 로컬 즉시 반영 후 재정렬
    const up = t.toUpperCase();
    if (favorites.includes(up)) favorites = favorites.filter(f => f !== up);
    else favorites.push(up);
    renderCards();
  }));
  // 밸류 보기 버튼 바인딩
  content.querySelectorAll('.fund-btn').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    const t = b.dataset.ticker;
    const box = document.getElementById('fund-' + t);
    if (!box) return;
    // 이미 로드된 종목이면 토글
    if (fundCache[t]) {
      if (box.dataset.shown === '1') { box.innerHTML=''; box.dataset.shown='0'; b.textContent='📊 밸류 보기'; }
      else { box.innerHTML = renderFund(fundCache[t]); box.dataset.shown='1'; b.textContent='📊 밸류 접기'; }
      return;
    }
    b.disabled = true; b.textContent = '불러오는 중…';
    try {
      const res = await fetch('/api/fundamentals/' + encodeURIComponent(t));
      const data = await res.json();
      fundCache[t] = data;
      box.innerHTML = renderFund(data);
      box.dataset.shown = '1';
      b.textContent = '📊 밸류 접기';
    } catch (err) {
      box.innerHTML = '<span class="note">밸류 데이터를 불러오지 못했어요.</span>';
    } finally {
      b.disabled = false;
    }
  }));
}

const fundCache = {};
function renderFund(d) {
  if (!d || d.error) return '<span class="note">밸류 데이터 없음 (해당 종목 미지원).</span>';
  const chips = [];
  if (d.roe != null) chips.push(`<span class="fchip">ROE <b>${d.roe}</b></span>`);
  if (d.per_flag) chips.push(`<span class="fchip" title="순이익 적자이거나 이익이 매우 작아 PER이 무의미한 상태">PER <b>${d.per_flag}</b></span>`);
  if (d.trail_pe != null) chips.push(`<span class="fchip">PER <b>${d.trail_pe}</b></span>`);
  if (d.fwd_pe != null) chips.push(`<span class="fchip">Fwd PER <b>${d.fwd_pe}</b></span>`);
  if (d.pbr != null) chips.push(`<span class="fchip">PBR <b>${d.pbr}</b></span>`);
  if (d.growing === true) chips.push(`<span class="fchip" title="선행 PER<후행 PER → 이익 성장 예상">이익성장 ↑</span>`);
  if (d.per_cheap === true) chips.push(`<span class="fchip" title="선행(추정) PER 8배 미만 = 이익 대비 저평가. 메모리·시클리컬에 특히 유효">PER 8배↓ 싸다</span>`);
  let vd = '';
  if (d.verdict) {
    const cls = d.verdict === '싸다' ? 'cheap' : (d.verdict === '비싸다' ? 'exp' : 'fair');
    const pos = d.pct_in_band != null ? ` (밴드 ${d.pct_in_band}%)` : '';
    vd = `<span class="vd ${cls}">${d.verdict}${pos}</span>`;
  }
  // 안전마진 진입가 (목표주가 × 0.7~0.8)
  let smRow = '';
  if (d.tp != null && d.sm_high != null) {
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const enterCls = d.sm_enter ? 'cheap' : 'exp';
    const enterTxt = d.sm_enter ? '진입 가능구간 ✓' : '아직 비쌈';
    const upTxt = d.sm_upside != null ? ` · 목표가까지 ${d.sm_upside > 0 ? '+' : ''}${d.sm_upside}%` : '';
    smRow = `<span class="note" style="margin-top:6px">안전마진가 (목표 ${fmt(d.tp)} × 0.7~0.8): `
      + `<b style="color:var(--text)">${fmt(d.sm_low)} ~ ${fmt(d.sm_high)}</b> `
      + `<span class="vd ${enterCls}" style="font-size:11px;padding:1px 7px">${enterTxt}</span>${upTxt}</span>`;
  }
  const bandNote = (d.band_low != null && d.band_high != null)
    ? `<span class="note">PER밴드 25~75%: ${d.band_low} ~ ${d.band_high}</span>` : '';
  const krNote = (d.market === 'KR')
    ? '<span class="note">한국주는 네이버 기준 ROE 미제공 · PER밴드는 최근 1년 근사예요.</span>' : '';
  const disclaim = '<span class="note">⚠️ 참고용. 진입 판단은 가격·거래량·추세 기준이에요.</span>';
  return `<div class="row">${chips.join('')}${vd}</div>${smRow}${bandNote}${krNote}${disclaim}`;
}

// ════════════════ 매매 일지 (서버 저장, 기기 간 동기화) ════════════════
const JKEY = 'pullback_journal_v1';   // 구 localStorage 키 (마이그레이션용)
let journalCache = [];                 // 메모리 캐시 (서버와 동기화)

function _normalize(arr) {
  // 구버전 기록 보정: 새 필드가 없으면 기본값 채움
  return (arr || []).map(r => ({
    category: (r.tab === '급등') ? '단타' : '추세추종',
    held_days: '', review: '', exit: '', result_r: '',
    note: '', signal: '', sector: '', pivot_type: '',
    ...r
  }));
}

function getJournal() { return journalCache; }

function setJournal(arr) {
  journalCache = arr;
  // 서버에 통째로 저장 (실패해도 화면은 유지)
  fetch('/api/journal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(arr)
  }).catch(e => console.error('일지 저장 실패:', e));
}

// 앱 시작 시 서버에서 일지 로드 + 구 localStorage 데이터 마이그레이션
async function loadJournalFromServer() {
  let serverData = [];
  try {
    const res = await fetch('/api/journal');
    serverData = await res.json();
  } catch(e) { serverData = []; }

  // 마이그레이션: 서버가 비었고 localStorage에 옛 일지가 있으면 한 번 올림
  let localData = [];
  try { localData = JSON.parse(localStorage.getItem(JKEY) || '[]'); } catch(e) {}
  if ((!serverData || serverData.length === 0) && localData.length > 0) {
    journalCache = _normalize(localData);
    await fetch('/api/journal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(journalCache)
    }).catch(()=>{});
    console.log('localStorage 일지 ' + localData.length + '건을 서버로 이전했어요.');
  } else {
    journalCache = _normalize(serverData);
  }
  // 일지 탭이 열려있으면 갱신
  if (typeof renderJournal === 'function' && document.getElementById('journalView').style.display !== 'none') {
    renderJournal();
  }
}

let pendingStock = null;
function openJournal(ticker) {
  const s = lastHits.find(h => h.ticker === ticker);
  if (!s) return;
  pendingStock = s;
  document.getElementById('jmSub').textContent = `${s.name} (${s.ticker}) · ${s.market}`;
  const tab = s.mode === 'surge' ? '급등' : s.mode === 'boxbreak' ? '박스돌파' : s.mode === 'breakout' ? '돌파' : s.mode === 'turnaround' ? '추세전환' : '눌림목';
  const sig = (s.triggered ? '🔥 트리거 ' : '') + (s.leader ? '👑 ' : '');
  document.getElementById('jmAuto').innerHTML =
    `<b>${tab}</b> 탭 · 섹터 <b>${s.sector || '-'}</b> · RS <b>${s.rs}</b>` +
    `${s.setup_score != null ? ` · 전일점수 <b>${Math.round(s.setup_score)}</b>` : ''}<br>` +
    `${sig ? `신호 <b>${sig}</b> · ` : ''}피벗종류 <b>${s.pivot_type || '-'}</b> · ` +
    `현재가 <b>${fmtPrice(s.close, s.market)}</b> · 리스크 <b>${s.risk_pct != null ? s.risk_pct + '%' : '-'}</b>` +
    `${s.alert ? ` · ⚠️ <b>${s.alert}</b>` : ''}`;
  // 손절 기본값 = 스캐너 손절가
  document.getElementById('jmEntry').value = s.pivot != null ? Math.round(s.close) : '';
  document.getElementById('jmStop').value = s.stop != null ? Math.round(s.stop) : '';
  document.getElementById('jmNote').value = '';
  if (window._resetModalPos) window._resetModalPos();
  document.getElementById('journalModal').classList.add('open');
}
function closeJournal() {
  document.getElementById('journalModal').classList.remove('open');
  pendingStock = null;
}

// ── 모달 드래그 (헤더 잡고 이동) ──
(function setupModalDrag() {
  let dragging = false, startX = 0, startY = 0, curX = 0, curY = 0;
  function onDown(e) {
    const handle = document.querySelector('#journalModal .drag-handle');
    if (!handle || !handle.contains(e.target)) return;
    dragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX - curX;
    startY = pt.clientY - curY;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    curX = pt.clientX - startX;
    curY = pt.clientY - startY;
    const m = document.querySelector('#journalModal .modal');
    if (m) m.style.transform = `translate(${curX}px, ${curY}px)`;
  }
  function onUp() { dragging = false; }
  document.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchstart', onDown, {passive: false});
  document.addEventListener('touchmove', onMove, {passive: false});
  document.addEventListener('touchend', onUp);
  // 열 때마다 위치 초기화
  window._resetModalPos = () => { curX = 0; curY = 0;
    const m = document.querySelector('#journalModal .modal');
    if (m) m.style.transform = ''; };
})();
function saveJournal() {
  const s = pendingStock; if (!s) return;
  const entry = parseFloat(document.getElementById('jmEntry').value) || null;
  const stop = parseFloat(document.getElementById('jmStop').value) || null;
  const note = document.getElementById('jmNote').value.trim();
  const riskAmt = (entry && stop && entry > stop) ? ((entry - stop) / entry * 100) : (s.risk_pct ?? null);
  // 진입 시점 신호 스냅샷 (나중에 신호별 승률 검증용)
  const sig = (typeof entrySignal === 'function') ? entrySignal(s) : null;
  const rec = {
    id: Date.now(),
    date: new Date().toISOString().slice(0, 10),
    ticker: s.ticker, name: s.name, market: s.market, sector: s.sector || '',
    tab: s.mode === 'surge' ? '급등' : s.mode === 'boxbreak' ? '박스돌파' : s.mode === 'breakout' ? '돌파' : s.mode === 'turnaround' ? '추세전환' : '눌림목',
    category: s.mode === 'surge' ? '단타' : '추세추종',
    signal: (s.triggered ? '🔥' : '') + (s.leader ? '👑' : ''),
    pivot_type: s.pivot_type || '', setup_score: s.setup_score != null ? Math.round(s.setup_score) : '',
    rs: s.rs, entry, stop,
    risk_pct: riskAmt != null ? Math.round(riskAmt * 10) / 10 : '',
    // ── 진입 시점 신호 스냅샷 (검증용) ──
    sig_level: sig ? sig.level : '',          // ok | warn | danger
    avwap_zone: s.avwap ? (s.avwap.zone || '') : '',
    rr_at_entry: s.rr ?? '',
    alert: s.alert || '', note,
    exit: '', result_r: '', held_days: '', review: ''
  };
  const j = getJournal(); j.unshift(rec); setJournal(j);
  closeJournal();
}

function journalStats(list) {
  const openCount = list.filter(r => r.result_r === '').length;
  const closed = list.filter(r => r.result_r !== '' && !isNaN(parseFloat(r.result_r)));
  const avgR = closed.length ? (closed.reduce((a, r) => a + parseFloat(r.result_r), 0) / closed.length).toFixed(2) : '–';
  const winRate = closed.length ? Math.round(closed.filter(r => parseFloat(r.result_r) > 0).length / closed.length * 100) : '–';
  return { openCount, closedCount: closed.length, avgR, winRate, total: list.length };
}

// 신호별 성과 검증: 진입 시점 신호등/AVWAP존별 승률·평균R 집계
function signalValidation(list) {
  const closed = list.filter(r => r.result_r !== '' && !isNaN(parseFloat(r.result_r)));
  if (closed.length < 3) return null;   // 표본 3건 미만이면 의미 없음
  const group = (keyFn, labels) => {
    const out = {};
    for (const key of Object.keys(labels)) {
      const rows = closed.filter(r => keyFn(r) === key);
      if (rows.length === 0) continue;
      const wins = rows.filter(r => parseFloat(r.result_r) > 0).length;
      const avgR = (rows.reduce((a, r) => a + parseFloat(r.result_r), 0) / rows.length);
      out[key] = { label: labels[key], n: rows.length, win: Math.round(wins/rows.length*100), avgR: avgR.toFixed(2) };
    }
    return out;
  };
  return {
    byLevel: group(r => r.sig_level, {ok:'🟢 진입양호', warn:'🟡 주의', danger:'🔴 자제'}),
    byZone: group(r => r.avwap_zone, {healthy:'AVWAP 건강', extended:'AVWAP 연장', overheated:'AVWAP 과열', near:'AVWAP 근처', below:'AVWAP 아래'}),
    total: closed.length
  };
}

let journalFilter = 'all';  // all | 추세추종 | 단타
let editingId = null;

function renderSignalValidation(all) {
  const v = signalValidation(all);
  if (!v) return `<div class="sigval-hint">📊 신호 검증: 종료된 매매가 3건 이상 쌓이면 신호별 승률이 여기 표시돼요. (진입 시 신호등·AVWAP 상태가 자동 기록됩니다)</div>`;
  const rowsOf = (obj) => Object.values(obj).map(g =>
    `<tr><td>${g.label}</td><td>${g.n}건</td><td>${g.win}%</td><td style="color:${parseFloat(g.avgR)>=0?'var(--green)':'var(--up)'}">${g.avgR}R</td></tr>`
  ).join('');
  const lvlRows = rowsOf(v.byLevel);
  const zoneRows = rowsOf(v.byZone);
  return `
    <div class="sigval">
      <div class="sigval-head">🔬 신호 검증 <span style="opacity:.6;font-size:11px">— 종료 ${v.total}건 기준. 신호가 실제로 맞는지 데이터로 확인</span></div>
      <div class="sigval-tables">
        <table class="sigval-t"><thead><tr><th>진입 신호등</th><th>건수</th><th>승률</th><th>평균</th></tr></thead><tbody>${lvlRows || '<tr><td colspan=4>데이터 없음</td></tr>'}</tbody></table>
        <table class="sigval-t"><thead><tr><th>AVWAP 존</th><th>건수</th><th>승률</th><th>평균</th></tr></thead><tbody>${zoneRows || '<tr><td colspan=4>데이터 없음</td></tr>'}</tbody></table>
      </div>
      <div class="sigval-note">💡 🟢 진입의 승률·평균R이 🔴보다 확실히 높으면 신호등이 잘 작동하는 거예요. 비슷하거나 역전되면 기준을 재검토하세요.</div>
    </div>`;
}

function renderJournal() {
  const wrap = document.getElementById('journalView');
  const all = getJournal();
  if (!all.length) {
    wrap.innerHTML = `<div class="jrnl-empty">아직 기록이 없어요.<br>
      카드에서 <b>"+ 일지에 추가"</b>를 눌러 신호를 기록하세요.<br>
      진입가·손절·근거만 적으면 나머지는 자동으로 채워집니다.</div>`;
    return;
  }
  // 카테고리 필터
  const j = journalFilter === 'all' ? all : all.filter(r => (r.category || '추세추종') === journalFilter);
  // 카테고리별 통계 (추세추종 / 단타 분리)
  const trend = journalStats(all.filter(r => (r.category || '추세추종') === '추세추종'));
  const scalp = journalStats(all.filter(r => (r.category || '추세추종') === '단타'));

  const fbtn = (key, label) => `<button class="fbtn ${journalFilter===key?'on':''}" onclick="journalFilter='${key}';renderJournal()">${label}</button>`;

  wrap.innerHTML = `
    <div class="jrnl-tools">
      <button class="exp" onclick="exportCSV()">⬇ CSV 내보내기</button>
      <button onclick="if(confirm('일지를 모두 지울까요? 되돌릴 수 없어요.')){setJournal([]);renderJournal();}">전체 삭제</button>
    </div>
    <div class="jrnl-stats">
      <div class="statcard">
        <div class="statcard-t">📈 추세추종</div>
        <div class="statcard-v">총 ${trend.total} · 종료 ${trend.closedCount} · 승률 ${trend.winRate}${trend.winRate!=='–'?'%':''} · 평균 ${trend.avgR}R</div>
      </div>
      <div class="statcard">
        <div class="statcard-t">⚡ 단타</div>
        <div class="statcard-v">총 ${scalp.total} · 종료 ${scalp.closedCount} · 승률 ${scalp.winRate}${scalp.winRate!=='–'?'%':''} · 평균 ${scalp.avgR}R</div>
      </div>
    </div>
    ${renderSignalValidation(all)}
    <div class="jrnl-filter">
      ${fbtn('all','전체')} ${fbtn('추세추종','📈 추세추종')} ${fbtn('단타','⚡ 단타')}
    </div>
    <div style="overflow-x:auto">
    <table class="jtable">
      <thead><tr>
        <th>날짜</th><th>종목</th><th>구분</th><th>탭</th><th>신호</th><th>섹터</th><th>피벗</th>
        <th>전일점수</th><th>RS</th><th>진입가</th><th>손절</th><th>리스크%</th>
        <th>결과R</th><th>보유일</th><th>근거/복기</th><th></th>
      </tr></thead>
      <tbody>
        ${j.map(r => r.id === editingId ? editRow(r) : viewRow(r)).join('')}
      </tbody>
    </table></div>`;
}

function viewRow(r) {
  const cat = r.category || '추세추종';
  const catColor = cat === '단타' ? 'color:#c084fc' : 'color:var(--green)';
  return `<tr class="${r.result_r===''?'open-pos':''}">
    <td class="mono">${r.date}</td>
    <td>${r.name}<div class="mono" style="font-size:10px;color:var(--muted)">${r.ticker}</div></td>
    <td style="font-size:11px;font-weight:600;${catColor}">${cat}</td>
    <td>${r.tab}</td>
    <td>${r.signal || '-'}</td>
    <td style="font-size:11px;color:var(--muted)">${r.sector || '-'}</td>
    <td style="font-size:11px">${r.pivot_type || '-'}</td>
    <td class="mono">${r.setup_score || '-'}</td>
    <td class="mono">${r.rs ?? '-'}</td>
    <td class="mono">${r.entry ?? '-'}</td>
    <td class="mono">${r.stop ?? '-'}</td>
    <td class="mono">${r.risk_pct || '-'}</td>
    <td class="mono" style="${r.result_r&&parseFloat(r.result_r)>0?'color:var(--up)':r.result_r?'color:var(--down)':''}">${r.result_r || '-'}</td>

    </td>
  </tr>`;
}

function editRow(r) {
  const cat = r.category || '추세추종';
  return `<tr class="editing">
    <td class="mono">${r.date}</td>
    <td>${r.name}<div class="mono" style="font-size:10px;color:var(--muted)">${r.ticker}</div></td>
    <td><select id="e_cat" class="ein">
      <option value="추세추종" ${cat==='추세추종'?'selected':''}>📈 추세추종</option>
      <option value="단타" ${cat==='단타'?'selected':''}>⚡ 단타</option>
    </select></td>
    <td>${r.tab}</td>
    <td>${r.signal || '-'}</td>
    <td style="font-size:11px;color:var(--muted)">${r.sector || '-'}</td>
    <td style="font-size:11px">${r.pivot_type || '-'}</td>
    <td class="mono">${r.setup_score || '-'}</td>
    <td class="mono">${r.rs ?? '-'}</td>
    <td><input id="e_entry" class="ein" value="${r.entry ?? ''}" inputmode="decimal"></td>
    <td><input id="e_stop" class="ein" value="${r.stop ?? ''}" inputmode="decimal"></td>
    <td class="mono">${r.risk_pct || '-'}</td>
    <td><input id="e_result" class="ein" value="${r.result_r || ''}" placeholder="R" style="width:48px"></td>
    <td><input id="e_held" class="ein" value="${r.held_days || ''}" placeholder="일" style="width:40px"></td>
    <td><textarea id="e_note" class="ein" style="width:240px;height:90px" placeholder="진입 근거">${r.note || ''}</textarea>
        <textarea id="e_review" class="ein" style="width:240px;height:90px;margin-top:6px" placeholder="복기 (왜 잘됐나/못됐나)">${r.review || ''}</textarea></td>
    <td style="white-space:nowrap">
      <span class="save-btn" onclick="saveEdit(${r.id})" title="저장">💾</span>
      <span class="del" onclick="editingId=null;renderJournal()" title="취소">↩</span>
    </td>
  </tr>`;
}

function saveEdit(id) {
  const j = getJournal();
  const r = j.find(x => x.id === id);
  if (!r) return;
  r.category = document.getElementById('e_cat').value;
  const entry = parseFloat(document.getElementById('e_entry').value) || null;
  const stop = parseFloat(document.getElementById('e_stop').value) || null;
  r.entry = entry; r.stop = stop;
  // 진입가·손절 바뀌면 리스크% 재계산
  if (entry && stop && entry > stop) r.risk_pct = Math.round((entry - stop) / entry * 1000) / 10;
  r.result_r = document.getElementById('e_result').value.trim();
  r.held_days = document.getElementById('e_held').value.trim();
  r.note = document.getElementById('e_note').value.trim();
  r.review = document.getElementById('e_review').value.trim();
  setJournal(j);
  editingId = null;
  renderJournal();
}

function updateResult(id, val) {
  const j = getJournal();
  const r = j.find(x => x.id === id);
  if (r) { r.result_r = val.trim(); setJournal(j); renderJournal(); }
}
function delJournal(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  setJournal(getJournal().filter(x => x.id !== id));
  if (editingId === id) editingId = null;
  renderJournal();
}
function exportCSV() {
  const j = getJournal();
  if (!j.length) return;
  const cols = ['date','ticker','name','market','sector','tab','category','signal','pivot_type',
    'setup_score','rs','entry','stop','risk_pct','sig_level','avwap_zone','rr_at_entry','alert','note','exit','result_r','held_days','review'];
  const head = ['날짜','티커','종목','시장','섹터','탭','구분','신호','피벗종류','전일점수','RS',
    '진입가','손절','리스크%','진입신호등','AVWAP존','진입시손익비','경보','진입근거','청산가','결과R','보유일','복기'];
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [head.join(','), ...j.map(r => cols.map(c => esc(r[c])).join(','))].join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `눌림목일지_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
document.getElementById('refresh').addEventListener('click', () => load(true));

async function loadIndices() {
  const bar = document.getElementById('idxbar');
  try {
    const res = await fetch('/api/indices');
    const data = await res.json();
    const list = (data.indices || []);
    if (!list.length) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    const regimeDot = (rg) => {
      if (!rg) return '';
      const map = {good:['🟢','#28b478'], neutral:['🟡','#e6aa28'], bad:['🔴','#FF5A6E']};
      const [emoji] = map[rg] || ['',''];
      return emoji;
    };
    // 국내(코스피/코스닥) 레짐으로 전체 시장 판정 배너
    const kr = list.filter(ix => ix.name === '코스피' || ix.name === '코스닥');
    const regimes = kr.map(ix => ix.regime).filter(Boolean);
    let banner = '';
    if (regimes.length) {
      const bad = regimes.filter(r => r === 'bad').length;
      const good = regimes.filter(r => r === 'good').length;
      let lv, txt;
      if (bad >= 1) { lv = 'bad'; txt = '🔴 시장 비우호 — 신규 진입 자제'; }
      else if (good === regimes.length) { lv = 'good'; txt = '🟢 시장 우호 — 진입 환경 양호'; }
      else { lv = 'neutral'; txt = '🟡 시장 중립 — 선별 진입'; }
      banner = `<div class="mkt-banner mkt-${lv}" title="국내 지수의 20·60일선 위치로 판정. 빠지는 장에선 돌파 성공률이 낮아요.">${txt}</div>`;
    }
    bar.innerHTML = banner + list.map(ix => {
      const pct = ix.change_pct;
      const chg = ix.change;
      // 한국식 색: 상승=빨강(up), 하락=파랑(down)
      const dir = pct == null ? 'flat' : (pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat'));
      const arrow = dir === 'up' ? '▲' : (dir === 'down' ? '▼' : '·');
      const val = ix.value != null ? Number(ix.value).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : '–';
      const chgStr = (chg != null && pct != null)
        ? `${arrow} ${Math.abs(chg).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} (${pct > 0 ? '+' : ''}${pct.toFixed(2)}%)`
        : '–';
      const dot = regimeDot(ix.regime);
      return `<div class="idx" title="${ix.regime_txt || ''}"><span class="nm">${dot} ${ix.name}</span>`
        + `<span class="vl">${val}</span>`
        + `<span class="ch ${dir}">${chgStr}</span></div>`;
    }).join('');
  } catch (e) {
    bar.style.display = 'none';
  }
}
loadIndices();
setInterval(loadIndices, 300000);   // 5분마다 갱신 (레짐 포함)

loadJournalFromServer();   // 서버에서 일지 로드 + 구 localStorage 이전
load();
