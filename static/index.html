<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>눌림목 스캐너</title>
<!-- v4.79: PWA — 앱스토어 없이 홈 화면에 설치해서 앱처럼 쓰기 -->
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<meta name="theme-color" content="#0C111B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="눌림목">
<script>
// v4.79: 서비스워커 등록 — 홈 화면 설치(PWA) 요건. 오프라인 캐싱은 안 함(항상
// 최신 데이터 필요한 스캐너라 캐시하면 오히려 해로움), 설치 가능하게만 함.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // 루트(/sw.js)에서 등록해야 스코프가 사이트 전체(/)가 된다. /static/sw.js로
    // 등록하면 스코프가 /static/으로 좁아져 앱 설치 조건을 못 채움.
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C111B; --surface:#141C2B; --surface2:#1A2436; --line:#233047;
  --text:#E6ECF5; --muted:#8A97AC; --dim:#5A6578;
  --up:#FF5A6E; --down:#4D8DFF; --amber:#F2B33D; --green:#3DD68C;
  /* 가격/등락 '방향' 전용 색 — 상승=연두, 하락=빨강 (경고용 --up/--down 과 분리) */
  --px-up:#3DD68C; --px-down:#FF5A6E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR',sans-serif;min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:100;background:var(--bg)}
h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
h1 .dot{color:var(--amber)}
h1 .ver{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;vertical-align:2px}
.sub{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:3px}
.tab{border:none;background:none;color:var(--muted);font:inherit;font-size:13px;
  padding:6px 14px;border-radius:6px;cursor:pointer}
.tab.active{background:var(--surface2);color:var(--text);font-weight:500}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

.refresh{border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
.refresh:hover{border-color:var(--amber)}

.statusbar{padding:12px 24px;font-size:12px;color:var(--muted);
  display:flex;gap:16px;flex-wrap:wrap}
.statusbar b{color:var(--text)}
.idxbar{display:flex;gap:10px;flex-wrap:wrap;padding:10px 24px;
  border-bottom:1px solid var(--line);background:var(--surface);align-items:center}
.mkt-banner{padding:6px 14px;border-radius:10px;font-size:11px;font-weight:400;border:1px solid var(--line)}
.gate-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.gate-row .mkt-banner{flex:1;min-width:200px}
.mkt-banner.mkt-good{background:rgba(40,180,120,.1);border-color:rgba(40,180,120,.45);color:#28b478}
.mkt-banner.mkt-neutral{background:rgba(230,170,40,.1);border-color:rgba(230,170,40,.45);color:#e6aa28}
.mkt-banner.mkt-bad{background:rgba(255,90,110,.1);border-color:rgba(255,90,110,.45);color:#FF5A6E}
.idx{display:flex;align-items:baseline;gap:8px;padding:6px 14px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:13px}
.idx .nm{color:var(--muted);font-weight:500}
.idx .nm a{cursor:pointer} .idx .nm a:hover{text-decoration:underline!important}
.idx .vl{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.idx .ch{font-size:12px;font-variant-numeric:tabular-nums}
.idx .ch.up{color:var(--px-up)} .idx .ch.down{color:var(--px-down)} .idx .ch.flat{color:var(--muted)}
.entry-sig{margin-top:10px;padding:9px 11px;border-radius:9px;border:1px solid var(--line)}
.entry-sig.sig-ok{background:rgba(40,180,120,.08);border-color:rgba(40,180,120,.4)}
.entry-sig.sig-warn{background:rgba(230,170,40,.08);border-color:rgba(230,170,40,.4)}
.entry-sig.sig-danger{background:rgba(255,90,110,.08);border-color:rgba(255,90,110,.4)}
.entry-sig .sig-head{font-size:13px;font-weight:700;margin-bottom:6px}
.entry-sig.sig-ok .sig-head{color:#28b478}
.entry-sig.sig-warn .sig-head{color:#e6aa28}
.entry-sig.sig-danger .sig-head{color:var(--up)}
.entry-sig .sig-list{display:flex;flex-direction:column;gap:3px}
.entry-sig .chk{font-size:11.5px;color:var(--muted)}
.entry-sig .chk-ok{color:var(--muted)}
.entry-sig .chk-warn{color:#e6aa28}
.entry-sig .chk-danger{color:var(--up)}
.fund-btn{width:100%;margin-top:10px;padding:7px;background:transparent;
  border:1px solid var(--line);color:var(--muted);border-radius:8px;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .12s}
.fund-btn:hover{border-color:var(--accent,#4D8DFF);color:var(--text)}
.fund-btn:disabled{opacity:.6;cursor:default}
.fund-box{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.7}
.fund-box .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fund-box .fchip{padding:3px 9px;border-radius:7px;background:var(--bg);
  border:1px solid var(--line);font-variant-numeric:tabular-nums}
.fund-box .fchip b{color:var(--text);font-weight:600}
.fund-box .vd{font-weight:700;padding:3px 10px;border-radius:7px}
.fund-box .vd.cheap{color:var(--px-up);border:1px solid var(--px-up)}
.fund-box .vd.fair{color:var(--muted);border:1px solid var(--line)}
.fund-box .vd.exp{color:var(--px-down);border:1px solid var(--px-down)}
.fund-box .note{display:block;margin-top:4px;font-size:11px;opacity:.75}
.journal-btn{width:100%;margin-top:10px;padding:7px;background:transparent;
  border:1px dashed var(--line);color:var(--muted);border-radius:8px;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .12s}
.journal-btn:hover{border-color:var(--amber);color:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.drag-handle{cursor:grab;user-select:none}
.drag-handle:active{cursor:grabbing}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:24px;width:min(440px,92vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal .auto{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:16px;
  font-size:12px;color:var(--muted);line-height:1.7}
.modal .auto b{color:var(--text)}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:9px 11px;border-radius:8px;font-size:14px;font-family:inherit;
  box-sizing:border-box}
.modal textarea{resize:vertical;min-height:48px}
.modal .row{display:flex;gap:10px}
.modal .row>div{flex:1}
.modal .actions{display:flex;gap:10px;margin-top:18px}
.modal .actions button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit}
.modal .save{background:var(--amber);color:#000}
.modal .cancel{background:var(--surface2);color:var(--text)}
.jrnl-wrap{padding:0 24px 40px}
.jrnl-tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.jrnl-tools button{padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:inherit}
.jrnl-tools .exp{background:var(--amber);color:#000;border:none;font-weight:600}
.jrnl-tools .stat{color:var(--muted);font-size:13px;margin-left:auto}
.jtable{width:100%;border-collapse:collapse;font-size:12.5px}
.jtable th,.jtable td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);
  white-space:nowrap}
.jtable th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase}
.jtable td.mono{font-family:var(--mono)}
.jtable .del{color:#FF6B6B;cursor:pointer}
.jtable tr.open-pos{background:rgba(242,179,61,.04)}
.jtable tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
.jtable td:nth-child(3) a{font-size:13.5px;font-weight:600}
.note-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.merger-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(147,112,219,.14);color:#b794f6;border:1px solid rgba(147,112,219,.4);white-space:nowrap;cursor:help}
.st-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap}
/* v4.85: 상태배지(꽉 찬 배경)와 확실히 구분되는 '버튼' 느낌 — 점선 테두리 + 투명배경.
   이전엔 둘 다 진한 배경이라 '지금 상태'와 '누르는 버튼'이 한눈에 안 구분됐음. */
.st-act{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px;
  cursor:pointer;background:transparent;border:1px dashed #555;color:#bbb}
.st-act:hover{background:rgba(255,255,255,.06);color:#fff}
.jtable input.result{width:70px;background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:4px 6px;border-radius:6px;font-size:12px;font-family:var(--mono)}
.jrnl-empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.7}
.jrnl-stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sigval{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.sigval-head{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px}
.sigval-subhead{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 8px}
.sigval-tables{display:flex;gap:16px;flex-wrap:wrap}
.sigval-t{flex:1;min-width:260px;border-collapse:collapse;font-size:12px}
.sigval-t th{text-align:left;padding:5px 8px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.sigval-t td{padding:5px 8px;border-bottom:1px solid var(--line);color:var(--text);font-variant-numeric:tabular-nums}
.sigval-note{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5}
.sigval-hint{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.statcard{flex:1;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
/* ── R 시스템 (v4.47) ── */
.rcalc{margin:6px 0 10px;padding:8px 10px;border-radius:8px;background:var(--surface);
  border:1px dashed var(--line);font-size:12px;line-height:1.5;min-height:16px}
.rcalc b{color:var(--green)}
.rcalc.warn{border-color:#8c6d2d;background:#2a2417}
.rcalc.lock{border-color:#8c2d2d;background:#2a1717}
.riskbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px;
  padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12px}
.riskbar .rb-item{display:flex;flex-direction:column;gap:2px;min-width:90px}
.riskbar .rb-t{font-size:10px;color:var(--muted)}
.riskbar .rb-v{font-weight:700;font-size:13px}
.riskbar .rb-gauge{flex:1;min-width:140px;height:8px;background:var(--card);border-radius:4px;overflow:hidden;position:relative}
.riskbar .rb-fill{height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.riskbar .rb-fill.hot{background:var(--amber)}
.riskbar .rb-fill.max{background:#ff6b6b}
.rlock-banner{margin:0 0 12px;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:600;
  background:#2a1717;border:1px solid #8c2d2d;color:#ff9b9b}
.rlock-banner.soft{background:#2a2417;border-color:#8c6d2d;color:#ffd98a}
/* ── 등급/성숙도 배지 (v4.48.3) ── */
.gbadge{display:inline-block;font-size:9px;font-weight:500;padding:1px 7px;border-radius:6px;
  margin-left:4px;vertical-align:1px;cursor:help;letter-spacing:.2px}
.gbadge.gA{background:#12351f;color:#4ade80;border:1px solid #1d6b3a}
.gbadge.gB{background:#33270f;color:#fbbf24;border:1px solid #6b5518}
.gbadge.gC{background:#26262e;color:#9ca3af;border:1px solid #3f3f4a}
.gbadge.gD{background:#341418;color:#f87171;border:1px solid #6b2028}
.pmat{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;
  margin-left:4px;cursor:help;vertical-align:1px}
.pmat.wait{background:#33270f;color:#ffd98a;border:1px dashed #8c6d2d}
.pmat.ok{background:#12351f;color:#7fe0a7;border:1px solid #1d6b3a}
.statcard-t{font-size:13px;font-weight:700;margin-bottom:4px}
.statcard-v{font-size:12px;color:var(--muted)}
.jrnl-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fbtn{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.fbtn.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:600}
/* v4.77: 진입중/대기/관찰 — 상태 탭. 나머지(전체/종료/추세/단타)보다 크고 눈에 띄게. */
.jrnl-tab{padding:9px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.jrnl-tab.on{background:var(--amber);color:#000;border-color:var(--amber)}
.jrnl-tab-sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.ein{background:#0d1420;border:1px solid var(--line);border-radius:6px;color:var(--text);
  padding:5px 7px;font-size:12px;font-family:inherit;width:64px}
textarea.ein{line-height:1.5;resize:vertical}
.edit-btn,.save-btn{cursor:pointer;font-size:13px;margin-right:6px}
tr.editing{background:rgba(242,179,61,.06)}
.tab-exp{position:relative}
.exp-tag{font-size:8px;background:rgba(168,85,247,.25);color:#c084fc;
  padding:1px 4px;border-radius:4px;margin-left:4px;vertical-align:middle;font-weight:700}
.surge-warn{background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);
  border-radius:8px;padding:8px 11px;font-size:11px;color:#c084fc;margin-top:8px;line-height:1.5}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 24px 10px;font-size:12px}
.legend .lg{color:var(--muted);cursor:help;display:inline-flex;align-items:center;gap:5px}
.legend .lg-h{color:var(--text);opacity:.7}
.legend .lg:hover{color:var(--text)}
@media (max-width:600px){.legend{padding:0 16px 10px;gap:12px}}
.sectorbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 12px}
.sectorbar:empty{padding:0}
.alert-tag{font-size:11px;color:#FF6B6B;background:rgba(255,107,107,.12);
  padding:2px 7px;border-radius:6px;font-weight:600;vertical-align:middle}
.climax-tag{font-size:9px;padding:2px 7px;border-radius:6px;font-weight:400;
  vertical-align:middle;margin-left:4px}
.climax-tag.danger{color:#FF6B6B;background:rgba(255,107,107,.15)}
.climax-tag.caution{color:#f5c451;background:rgba(245,196,81,.12)}
.alert-mgr{margin-left:12px;font-size:12px;color:var(--muted);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.alert-mgr:hover{color:var(--amber)}
.alert-panel{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);
  display:none;gap:8px;align-items:center;flex-wrap:wrap}
.alert-panel.open{display:flex}
.alert-panel input,.alert-panel select{background:var(--bg);border:1px solid var(--line);
  color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;font-family:inherit}
.alert-panel button{background:var(--amber);color:#000;border:none;padding:6px 14px;
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.alert-list{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px}
.alert-list .chip{font-size:11px;background:rgba(255,107,107,.12);color:#FF6B6B;
  padding:3px 8px;border-radius:6px;cursor:pointer}
.alert-list .chip:hover{text-decoration:line-through}
@media (max-width:600px){.alert-panel{padding:12px 16px}}
.schip{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .12s}
.schip:hover{border-color:var(--amber);color:var(--text)}
.schip.on{background:var(--surface2);color:var(--text);border-color:var(--amber)}
.schip b{color:var(--amber);margin-left:5px}
.schip .clear{color:var(--muted)}
@media (max-width:600px){.sectorbar{padding:0 16px 12px}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:14px;padding:0 24px 40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:16px;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:#33455F}
.card.fired{border-color:rgba(242,179,61,.55)}
.card.fav{border-color:rgba(245,196,81,.5);box-shadow:0 0 0 1px rgba(245,196,81,.25)}
.fav-btn{background:none;border:none;cursor:pointer;font-size:20px;line-height:1;
  color:var(--muted);padding:0;margin-top:1px;transition:color .15s;flex-shrink:0}
.fav-btn:hover{color:#f5c451}
.fav-btn.on{color:#f5c451}
.card-top{display:flex;align-items:flex-start;gap:12px}
.name{font-size:15px;font-weight:700;line-height:1.2}
.tick{font-size:11px;color:var(--muted);margin-top:2px}
.tv-link{color:var(--muted);text-decoration:none;cursor:pointer}
.tv-link:hover{color:#7fb8e0;text-decoration:underline}
.mkt{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}

.score-ring{position:relative;width:46px;height:46px;flex:none}
.score-ring svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:600}

.price-row{display:flex;align-items:baseline;gap:8px}
.price{font-size:17px;font-weight:600}
.chg{font-size:13px;font-weight:500}
.chg.up{color:var(--px-up)}.chg.down{color:var(--px-down)}

.spark{width:100%;height:64px;display:block}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  border-top:1px solid var(--line);padding-top:12px}
.metric .k{font-size:10px;color:var(--muted);margin-bottom:3px}
.metric .v{font-size:13px;font-weight:500}

.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 8px;border-radius:99px;
  background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.on{color:var(--green);border-color:rgba(61,214,140,.35)}
.badge.warn{color:#f5c451;border-color:rgba(245,196,81,.45);background:rgba(245,196,81,.08)}

.empty{padding:80px 24px;text-align:center;color:var(--muted);font-size:14px}
.loading{padding:80px 24px;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--amber);
  border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:600px){header{padding:16px}.grid{padding:0 16px 32px;grid-template-columns:1fr}}
@media (max-width:600px){#searchBar{padding:0 16px}}

/* ══════════════ v4.79: 모바일 전면 재정비 ══════════════
   PC 가로 레이아웃을 그대로 축소만 하던 걸 실제로 재배치.
   - 모드 탭: 줄바꿈으로 잘리던 것 → 한 줄 가로 스크롤(스와이프)로.
   - 카드: metrics 4열은 폰 폭에서 숫자가 뭉개져서 2열로.
   - 일지 표: 가로 스크롤 중에도 종목명이 안 사라지게 3번째 열 고정.
   - 전반: 폰트·여백을 desktop 축소판이 아니라 터치 기준으로 다시 잡음. */
@media (max-width:700px){
  header{padding:14px 16px;gap:10px}
  h1{font-size:16px}
  .sub{font-size:11.5px}
  .tabs{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;gap:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 13px;font-size:13.5px;flex-shrink:0;white-space:nowrap}
  .refresh{padding:10px 16px;font-size:13.5px}

  .idxbar{padding:10px 16px;gap:8px}
  .idx{font-size:12.5px;padding:7px 12px}
  .statusbar{padding:12px 16px;font-size:11.5px}
  .legend{padding:0 16px 10px}
  .sectorbar{padding:0 16px 12px}
  .alert-panel{padding:12px 16px}

  .grid{gap:12px}
  .card{padding:14px;gap:10px}
  .name{font-size:16px}
  .price{font-size:18px}
  .metrics{grid-template-columns:repeat(2,1fr);gap:10px 8px}
  .metric .k{font-size:10.5px}
  .metric .v{font-size:14px}
  .journal-btn,.fund-btn{padding:10px;font-size:13px}
  .badge{font-size:10.5px;padding:4px 9px}
  .climax-tag,.gbadge,.pmat{font-size:10px}

  .jrnl-wrap{padding:0 16px 40px}
  .jrnl-tools{gap:8px}
  .jrnl-tools button{padding:10px 14px;font-size:13.5px}
  .jrnl-tab{padding:10px 16px;font-size:14.5px}
  .fbtn{padding:8px 14px;font-size:13px}
  .riskbar{font-size:12.5px;padding:10px 12px}

  /* 일지 표: 폰트 키우고, 종목명 열(3번째)은 스크롤해도 항상 보이게 고정 */

}

<script>
// 일지 날짜 스탬프는 브라우저 로컬시간이 아니라 항상 KST(UTC+9) 기준이어야 한다.
// toISOString()은 항상 UTC라, 한국이 자정~09시(KST)일 땐 아직 UTC로는 전날이라
// 하루 전 날짜로 찍히는 버그가 있었음(v4.74) — 예: 마키나락스를 7/20 새벽에
// 등록했는데 활동 달력엔 7/19로 표시. d를 직접 mutate하지 않고 KST로 shift한
// 복제본만 반환하므로, 같은 Date 객체를 밀리초 차분(경과일 계산 등)에도 쓰는
// 기존 호출부는 그대로 둬도 안전하다.
function kstStr(d, len) {
  d = (d instanceof Date) ? d : new Date();
  return new Date(d.getTime() + 9 * 3600 * 1000).toISOString().slice(0, len || 10);
}

const fmtPrice = (p, mkt) => mkt === 'KR'
  ? Math.round(p).toLocaleString('ko-KR') + '원'
  : '$' + p.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

// 손익비 R 표시: 2R 이상이면 좋음(초록), 1.5 미만이면 나쁨(빨강)
const fmtRR = (rr) => {
  if (rr == null) return '<span class="v">-</span>';
  const color = rr >= 2 ? 'var(--green)' : (rr < 1.5 ? 'var(--up)' : '');
  const warn = rr < 1.5 ? ' ⚠️' : '';
  return `<span class="v" style="${color ? 'color:'+color : ''}">${rr}R${warn}</span>`;
};

// 거래량: 한국은 만/억 주, 미국은 K/M
const fmtVolume = (vol, mkt) => {
  if (!vol) return '-';
  if (mkt === 'KR') {
    if (vol >= 1e8) return (vol/1e8).toFixed(1) + '억주';
    if (vol >= 1e4) return (vol/1e4).toFixed(0) + '만주';
    return Math.round(vol).toLocaleString('ko-KR') + '주';
  }
  if (vol >= 1e6) return (vol/1e6).toFixed(1) + 'M';
  if (vol >= 1e3) return (vol/1e3).toFixed(0) + 'K';
  return Math.round(vol).toString();
};

// 거래대금: 한국은 억/조 원, 미국은 $M/$B
const fmtTurnover = (t, mkt) => {
  if (!t) return '-';
  if (mkt === 'KR') {
    if (t >= 1e12) return (t/1e12).toFixed(2) + '조원';
    if (t >= 1e8) return (t/1e8).toFixed(0) + '억원';
    return Math.round(t/1e4).toLocaleString('ko-KR') + '만원';
  }
  if (t >= 1e9) return '$' + (t/1e9).toFixed(2) + 'B';
  if (t >= 1e6) return '$' + (t/1e6).toFixed(1) + 'M';
  return '$' + Math.round(t).toLocaleString('en-US');
};

function sparkSVG(closes, ma20) {
  const W = 300, H = 64, PAD = 4;
  const vals = closes.concat(ma20.filter(v => v != null));
  const min = Math.min(...vals), max = Math.max(...vals);
  const x = i => PAD + i * (W - 2 * PAD) / (closes.length - 1);
  const y = v => H - PAD - (v - min) / (max - min || 1) * (H - 2 * PAD);
  const path = arr => arr.map((v, i) => v == null ? '' :
    `${arr.slice(0, i).every(p => p == null) ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');

  // 눌림 구간 음영: 60봉 내 최고점 이후 구간
  const hiIdx = closes.indexOf(Math.max(...closes));
  const zone = hiIdx < closes.length - 1
    ? `<rect x="${x(hiIdx)}" y="0" width="${x(closes.length - 1) - x(hiIdx)}" height="${H}"
        fill="rgba(242,179,61,.07)"/>` : '';
  const last = closes.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    ${zone}
    <path d="${path(ma20)}" fill="none" stroke="#4D8DFF" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
    <path d="${path(closes)}" fill="none" stroke="#E6ECF5" stroke-width="1.5"/>
    <circle cx="${x(last)}" cy="${y(closes[last])}" r="3" fill="#F2B33D"/>
  </svg>`;
}

function scoreRing(score) {
  const r = 19, c = 2 * Math.PI * r, off = c * (1 - score / 100);
  const color = score >= 75 ? 'var(--green)' : score >= 55 ? 'var(--amber)' : 'var(--muted)';
  return `<div class="score-ring" title="눌림목 점수 ${score}">
    <svg width="46" height="46"><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg>
    <div class="score-num mono">${Math.round(score)}</div></div>`;
}

// 진입 신호등: 거래량·RS·손익비·리스크 종합 → 진입 양호/주의/자제 + 체크리스트
function entrySignal(s) {
  // 돌파류는 vol_mult, 눌림/임박은 vol_ratio 사용
  const volBreakout = s.vol_mult != null ? s.vol_mult : null;
  const volPullback = s.vol_ratio != null ? s.vol_ratio : null;
  const checks = [];
  let warn = 0, danger = 0;

  // 1) 거래량 동반 (한올 교훈: 거래량 없는 돌파임박은 가짜 위험)
  if (volBreakout != null) {
    if (volBreakout >= 1.5) checks.push(['ok', `거래량 ${volBreakout}× 동반`, 'vol']);
    else { checks.push(['warn', `거래량 ${volBreakout}× — 동력 부족`, 'vol_weak']); warn++; }
  } else if (volPullback != null) {
    if (volPullback <= 0.8) checks.push(['ok', `거래량 ${volPullback}× 수축(눌림 양호)`, 'vol']);
    else if (volPullback < 1.5) checks.push(['warn', `거래량 ${volPullback}× — 애매`, 'vol_mid']);
    else { checks.push(['ok', `거래량 ${volPullback}× 증가`, 'vol']); }
  }
  // 2) RS (주도주 여부)
  if (s.rs != null) {
    if (s.rs >= 90) checks.push(['ok', `RS ${s.rs} 주도주급`, 'rs']);
    else if (s.rs >= 70) checks.push(['warn', `RS ${s.rs} — 주도주는 아님`, 'rs_mid']);
    else { checks.push(['danger', `RS ${s.rs} 약함`, 'rs_weak']); danger++; }
  }
  // 3) 손익비
  if (s.rr != null) {
    if (s.rr >= 2) checks.push(['ok', `손익비 ${s.rr}R`, 'rr']);
    else { checks.push(['danger', `손익비 ${s.rr}R — 가성비 낮음`, 'rr_low']); danger++; }
  }
  // 4) 리스크(손절폭) — 한국 중소형주는 변동성이 커서 손절폭이 넓은 게 정상.
  //    시장별 기준 분리: 한국 12%, 미국 8%.
  if (s.risk_pct != null) {
    const riskLimit = (s.market === 'kr') ? 12 : 8;
    if (s.risk_pct <= riskLimit) checks.push(['ok', `리스크 ${s.risk_pct}%`, 'risk']);
    else { checks.push(['warn', `리스크 ${s.risk_pct}% — 손절폭 넓음`, 'risk_wide']); warn++; }
  }
  // 5) Anchored VWAP (거래량 최대 봉 이후 평균 매입가 대비 위치)
  if (s.avwap && s.avwap.zone) {
    const z = s.avwap.zone, d = s.avwap.dist_pct;
    if (z === 'healthy') checks.push(['ok', `AVWAP 위 +${d}% — 건강한 우위`, 'avwap']);
    else if (z === 'extended') { checks.push(['warn', `AVWAP +${d}% — 연장(추격주의)`, 'avwap_ext']); warn++; }
    else if (z === 'overheated') { checks.push(['warn', `AVWAP +${d}% — 과열(평균가서 멀어짐)`, 'avwap_hot']); warn++; }
    else if (z === 'near') { checks.push(['warn', `AVWAP ${d}% — 살짝 아래(애매)`, 'avwap_near']); warn++; }
    else if (z === 'below') { checks.push(['danger', `AVWAP ${d}% — 매물 부담 큼`, 'avwap_below']); danger++; }
  }
  // 6) 변동성(ATR%) — 미너비니: 손절폭은 종목 변동성에 맞춰라.
  //    고변동 종목은 하루 정상 변동이 커서 타이트한 손절이 노이즈에 털린다.
  if (s.atr_pct != null && s.vol_high) {
    if (s.atr_tight) {
      checks.push(['danger', `변동성 ATR ${s.atr_pct}% — 손절 대비 큼(노이즈 손절 위험)`, 'atr_tight']); danger++;
    } else {
      checks.push(['warn', `고변동 ATR ${s.atr_pct}% — 비중 축소 권장`, 'atr_high']); warn++;
    }
  }

  let level, label;
  if (danger > 0) { level = 'danger'; label = '🔴 진입 자제'; }
  else if (warn >= 2) { level = 'danger'; label = '🔴 진입 자제'; }
  else if (warn === 1) { level = 'warn'; label = '🟡 주의'; }
  else { level = 'ok'; label = '🟢 진입 양호'; }
  // 경고/위험이었던 항목 태그만 추출 (검증용 — 어떤 경고가 과했는지 집계)
  const flags = checks.filter(c => c[0] === 'warn' || c[0] === 'danger').map(c => c[2]).filter(Boolean);
  return { level, label, checks, flags };
}

async function load(refresh = false) {
  if (mode === 'inverse') { return loadInverse(refresh); }
  if (mode === 'sectors') { return loadSectors(); }
  if (mode === 'eod') { return loadEod(); }
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  content.innerHTML = '<div class="loading"><div class="spinner"></div>스캔 중… (유니버스 3,500+ 종목 — 하루 첫 스캔은 2~4분, 이후엔 캐시로 즉시)</div>';
  status.innerHTML = '';
  try {
    // 시장 구분 없이 항상 전체를 받아옴 → 한국/미국 탭은 클라이언트에서 필터(재스캔 0초)
    const res = await fetch(`/api/scan?market=all&mode=${mode}${refresh ? '&refresh=true' : ''}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    if (data.version) { const vb = document.getElementById('verBadge'); if (vb) vb.textContent = data.version; }
    const _tm = data.timing;
    const _tmStr = _tm ? ` · ⏱ KR ${_tm.kr_sec}s / US ${_tm.us_sec}s / RS ${_tm.rs_sec}s (신규 ${_tm.n_fetched_kr+_tm.n_fetched_us}, 재사용 ${_tm.n_reused})` : '';
    status.innerHTML = `<span><b>${data.fetched ?? data.scanned}</b>/${data.scanned}개 종목 스캔</span>
      <span>${(typeof MODE_TAB_LABEL !== 'undefined' && MODE_TAB_LABEL[mode]) || modeTab(mode) || '스캔'} 후보 <b>${data.hits.length}</b>개</span>
      <span>기준 ${data.generated_at}${data.cached ? ' (캐시)' : ''}${_tmStr}</span>
      ${data.warn_count ? `<span style="color:#FF6B6B">⚠️ 경보/과대리스크 ${data.warn_count}</span>` : ''}
      <span class="alert-mgr" id="alertToggle">경보종목 관리</span>`;
    const tg = document.getElementById('alertToggle');
    if (tg) tg.addEventListener('click', () => {
      document.getElementById('alertPanel').classList.toggle('open');
      loadAlertList();
    });
    lastHits = data.hits;
    favorites = data.favorites || [];
    sectorFilter = null;
    searchQuery = '';
    const sb = document.getElementById('cardSearch'); if (sb) sb.value = '';
    document.getElementById('searchBar').style.display = '';
    document.getElementById('diagBar').style.display = '';
    renderSectors(data.sector_summary || []);
    renderCards();
  } catch (e) {
    // 콜드 스캔(캐시 워밍 중)일 수 있음 — 15초 후 1회 자동 재시도.
    // 서버는 백그라운드로 계속 스캔 중이라, 잠시 뒤엔 캐시가 채워져 성공.
    if (!load._retried) {
      load._retried = true;
      content.innerHTML = '<div class="loading"><div class="spinner"></div>첫 스캔은 시간이 걸려요 — 데이터 준비 중… (자동 재시도)</div>';
      setTimeout(() => { load(false); }, 15000);
      return;
    }
    load._retried = false;
    content.innerHTML = '<div class="empty">스캔에 실패했습니다. 잠시 후 다시 스캔을 눌러주세요 (첫 스캔은 2~4분 소요).</div>';
  }
  load._retried = false;
}


async function loadSectors() {
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  document.getElementById('searchBar').style.display = 'none';
  document.getElementById('diagBar').style.display = 'none';
  renderSectors([]);
  content.innerHTML = '<div class="loading"><div class="spinner"></div>섹터 집계 중…</div>';
  status.innerHTML = '';
  try {
    const res = await fetch('/api/sectors');
    const d = await res.json();
    if (d.version) { const vb = document.getElementById('verBadge'); if (vb) vb.textContent = d.version; }
    status.innerHTML = `<span>기준 ${d.asof}</span><span>마지막 봉 대비 등락 · 섹터 매핑 종목 기준</span>`;
    const panelName = {KOSPI: '코스피', KOSDAQ: '코스닥', US: '나스닥·NYSE'};
    const chgColor = v => v > 0 ? 'color:var(--px-up)' : v < 0 ? 'color:var(--px-down)' : 'color:var(--muted)';
    const p = d.panels || {};
    const cols = ['KOSPI', 'KOSDAQ', 'US'];
    const maxRows = Math.max(...cols.map(k => (p[k] || []).length), 1);
    // 미국은 티커(짧고 명확), 한국은 종목명. 상위 5개까지 줄바꿈 허용.
    const nameOf = (t, isUS) => isUS ? (t.ticker || t.name) : t.name;
    const cell = (r, isUS) => r ? `
      <td style="padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top" title="${r.top.map(t => `${nameOf(t, isUS)} ${t.chg > 0 ? '+' : ''}${t.chg}%`).join(' · ')}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
          <b style="font-size:13px">${r.sector}</b>
          <span class="mono" style="${chgColor(r.avg_chg)};font-weight:700;white-space:nowrap">${r.avg_chg > 0 ? '+' : ''}${r.avg_chg}%</span>
        </div>
        <div style="font-size:11px;color:var(--muted)">${r.n}종목 · 상승 ${r.up_pct}%</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.6">${r.top.slice(0, 5).map(t => `${nameOf(t, isUS)} <span style="${chgColor(t.chg)}">${t.chg > 0 ? '+' : ''}${t.chg}%</span>`).join(' · ')}</div>
      </td>` : '<td style="border-bottom:1px solid var(--line)"></td>';
    let body = '';
    for (let i = 0; i < maxRows; i++) {
      body += '<tr>' + cols.map(k => cell((p[k] || [])[i], k === 'US')).join('') + '</tr>';
    }
    // ── 🏆 주도업종 랭킹 (v4.49): RS 85+ & 3개월 +30% & 200일선 위 생존자 카운트 ──
    // 하루 등락 평균(아래 표)은 노이즈, 생존자 밀집이 로테이션의 진짜 신호
    const L = d.leading || {};
    const ldRow = (mkt, label) => {
      const rows = L[mkt] || [];
      if (!rows.length) return `<div style="flex:1;min-width:280px"><div style="font-weight:700;font-size:13px;margin-bottom:6px">${label}</div><div style="color:var(--muted);font-size:12px">조건 통과 종목 없음 — 지금 주도주가 없다는 뜻 (조정장 정상)</div></div>`;
      const maxN = rows[0].n || 1;
      return `<div style="flex:1;min-width:280px">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px">${label}</div>
        ${rows.map(r => `
          <div style="display:flex;align-items:center;gap:8px;padding:3px 0" title="${r.top.map(t => `${mkt === 'US' ? (t.ticker || t.name) : t.name} RS${t.rs} 3개월+${t.mom3}%`).join(' · ')}">
            <span style="width:86px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.sector}</span>
            <span style="flex:1;height:8px;background:var(--card);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(r.n / maxN * 100)}%;background:var(--green);border-radius:4px"></span></span>
            <b style="font-size:12px;width:22px;text-align:right">${r.n}</b>
          </div>`).join('')}
      </div>`;
    };
    const leadingHtml = `
      <div style="max-width:980px;margin:0 auto 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px">🏆 주도업종 랭킹
          <span style="color:var(--muted);font-weight:400;font-size:11px">RS 85+ · 3개월 +30% · 200일선 위 생존 종목 수 — 로테이션 감지용 (막대에 마우스: 대표 종목)</span></div>
        <div style="display:flex;gap:20px;flex-wrap:wrap">${ldRow('KR', '🇰🇷 한국')}${ldRow('US', '🇺🇸 미국')}</div>
      </div>`;
    content.innerHTML = leadingHtml + `<div style="max-width:980px;margin:0 auto;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px">
        <thead><tr>${cols.map(k => `<th style="text-align:left;padding:10px;font-size:14px;border-bottom:2px solid var(--line)">${k === 'US' ? '🇺🇸' : '🇰🇷'} ${panelName[k]}</th>`).join('')}</tr></thead>
        <tbody>${body}</tbody>
      </table>
      <div style="color:var(--muted);font-size:11px;padding:10px">강세순 정렬 · 셀에 마우스를 올리면 상위 종목 표시 · 섹터 매핑된 종목 기준</div>
    </div>`;
  } catch (e) {
    content.innerHTML = '<div class="empty">섹터 집계에 실패했습니다.</div>';
  }
}

async function loadInverse(refresh = false) {
  const content = document.getElementById('content');
  const status = document.getElementById('status');
  content.innerHTML = '<div class="loading"><div class="spinner"></div>인버스 스캔 중…</div>';
  status.innerHTML = '';
  document.getElementById('searchBar').style.display = 'none';
  document.getElementById('diagBar').style.display = 'none';
  try {
    const res = await fetch(`/api/inverse?market=all${refresh ? '&refresh=true' : ''}`);
    const data = await res.json();
    const regimeColor = data.regime === 'bear' ? '#FF6B6B' : (data.regime === 'weakening' ? '#f2b33d' : '#5fd99a');
    status.innerHTML = `<span style="color:${regimeColor};font-weight:600">${data.regime_txt}</span>
      <span>인버스 ${data.hits.length}개</span>
      <span>기준 ${data.generated_at}${data.cached ? ' (캐시)' : ''}</span>`;
    document.getElementById('sectorRow') && (document.getElementById('sectorRow').innerHTML = '');
    renderInverseCards(data.hits || []);
  } catch (e) {
    content.innerHTML = '<div class="empty">인버스 스캔 실패. 서버 로그를 확인하세요.</div>';
  }
}

function renderInverseCards(hits) {
  const content = document.getElementById('content');
  if (!hits.length) { content.innerHTML = '<div class="empty">인버스 데이터가 없습니다.</div>'; return; }
  const strengthBadge = (s) => s === 'strong'
    ? '<span class="st-badge" style="background:#3a2020;color:#ff6b6b">🔴 본격 하락장</span>'
    : s === 'building'
    ? '<span class="st-badge" style="background:#3a3320;color:#f2b33d">🟡 하락 조짐</span>'
    : '<span class="st-badge" style="background:#1e2a1e;color:#7a8a7a">🟢 부적합</span>';
  const cards = hits.map(s => {
    const levBadge = s.leverage >= 2 ? `<span class="st-badge" style="background:#3a2020;color:#ff9b9b">${s.leverage}x 곱버스</span>` : '';
    // 강도 점수 색
    const scoreColor = s.inv_score >= 70 ? '#ff6b6b' : (s.inv_score >= 40 ? '#f2b33d' : '#7a8a7a');
    // 기초지수 5일 등락 (인버스가 왜 오르는지)
    const idx5 = s.index_5d_pct;
    const idx5Str = idx5 != null ? `${idx5>=0?'+':''}${idx5}%` : '–';
    const idx5Color = idx5 != null ? (idx5 < 0 ? 'var(--px-down)' : 'var(--px-up)') : 'var(--muted)';
    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="name">${s.name}<span class="mkt">${s.market}</span></div>
          <div class="tick mono"><a href="${tvUrl(s)}" target="_blank" rel="noopener" class="tv-link" title="트레이딩뷰 차트 열기" onclick="event.stopPropagation()">${s.ticker} 📈</a> · ${s.underlying} 하락 베팅</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:9px;color:var(--muted)">강도</div>
          <div class="mono" style="font-weight:700;font-size:18px;color:${scoreColor}">${s.inv_score != null ? s.inv_score : '–'}</div>
        </div>
      </div>
      <div style="margin:8px 0;display:flex;gap:6px;flex-wrap:wrap">${strengthBadge(s.strength)} ${levBadge}</div>
      <div class="metrics">
        <div class="metric"><div class="k">${s.underlying} 5일</div><div class="v mono" style="color:${idx5Color}">${idx5Str}</div></div>
        <div class="metric"><div class="k">인버스 5일</div><div class="v mono" style="color:${s.ret5_pct>=0?'var(--px-up)':'var(--px-down)'}">${s.ret5_pct>=0?'+':''}${s.ret5_pct}%</div></div>
        <div class="metric"><div class="k">연속 상승</div><div class="v mono">${s.up_streak>0?s.up_streak+'일↑':'–'}</div></div>
        <div class="metric"><div class="k">RSI</div><div class="v mono">${s.rsi}</div></div>
      </div>
      ${s.overheated ? '<div class="surge-warn" style="background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.3)">⚠️ 인버스 과열(RSI '+s.rsi+') — 지수 과대낙폭 = 반등 시 인버스 급락 위험. 추격 금지.</div>' : ''}
      <div style="font-size:11px;color:var(--muted);margin-top:8px">${s.strength_txt}${s.derived ? ' · 📐 1x 역산' : ''}</div>
    </div>`;
  }).join('');
  content.innerHTML = `
    <div class="surge-warn" style="margin-bottom:12px">🔻 인버스 = 지수 하락 베팅. <b>강도 점수(0~100)</b>가 높을수록 인버스 살 만한 국면이에요. <b>기초지수 5일 등락</b>이 마이너스(지수 빠짐)일수록 인버스 유리. 곱버스(2x/3x)는 변동성 극심 → <b>단기·소액만</b>. 미너비니式 본래 하락장엔 현금 우선.<br><span style="font-size:11px;color:var(--muted)">※ 곱버스/미국 ETF의 실시간 정확한 가격은 증권앱에서 확인하세요. 이 탭은 "지금 하락 국면인가" 판단용이에요.</span></div>
    <div class="grid">${cards}</div>`;
}

async function loadAlertList() {
  try {
    const r = await fetch('/api/alerts'); const data = await r.json();
    const list = document.getElementById('alertList');
    const keys = Object.keys(data);
    list.innerHTML = keys.length
      ? keys.map(t => `<span class="chip" data-t="${t}" title="클릭하면 삭제">${t} ${data[t]} ✕</span>`).join('')
      : '<span style="color:var(--muted);font-size:12px">등록된 경보 종목 없음</span>';
    list.querySelectorAll('.chip').forEach(c => c.addEventListener('click', async () => {
      await fetch('/api/alerts', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ticker: c.dataset.t, remove: true})});
      loadAlertList(); load(true);
    }));
  } catch(e) {}
}

// 유니버스 전체 종목 조회 (현재 탭에 안 잡힌 종목 검색용)
let _lookupTimer = null;
let _lookupLast = '';
function triggerLookup(query) {
  // 디바운스: 입력 멈춘 뒤 500ms 후 1회 호출
  clearTimeout(_lookupTimer);
  _lookupTimer = setTimeout(async () => {
    const q = query.trim();
    if (!q || q.length < 1) return;
    if (q === _lookupLast) return;   // 중복 호출 방지
    _lookupLast = q;
    // v4.82: 이 탭에 안 잡힌 종목이면, 기본 현재가 카드뿐 아니라 '왜 안 잡혔는지'
    // 상세 진단도 자동으로 같이 띄운다 (예전엔 Enter/진단 버튼을 눌러야 나왔음).
    runDiag();
    const hint = document.getElementById('lookupHint');
    try {
      const res = await fetch('/api/lookup/' + encodeURIComponent(q));
      const d = await res.json();
      // 검색어가 그새 바뀌었으면 무시
      if (searchQuery.trim() !== q) return;
      if (d.error) {
        if (hint) hint.innerHTML = `유니버스에 '${q}'이(가) 없거나 데이터를 못 가져왔어요.`;
        return;
      }
      renderLookupCard(d);
    } catch (e) {
      if (hint) hint.textContent = '조회 중 오류가 났어요.';
    }
  }, 500);
}

function renderCards() {
  const content = document.getElementById('content');
  let list = sectorFilter ? lastHits.filter(h => h.sector === sectorFilter) : lastHits.slice();
  // 시장 필터 (클라이언트에서 거름 — 재스캔 없음)
  if (market === 'kr') list = list.filter(h => h.market === 'KR');
  else if (market === 'us') list = list.filter(h => h.market === 'US');
  // 종목명/코드 검색 필터
  if (searchQuery) {
    const q = searchQuery.toLowerCase().replace(/\s/g, '');
    list = list.filter(h =>
      (h.name || '').toLowerCase().replace(/\s/g, '').includes(q) ||
      (h.ticker || '').toLowerCase().includes(q)
    );
  }
  // 주도주 엄격모드 필터: RS90+ · 거래량 동반 · 손익비 2R+ · 리스크 8%↓
  // 주도주(RS90+) 필터는 롱 전용 — 숏(붕괴)은 약한 종목이라 적용하지 않음
  // v4.65: 💎 약세장적격만 — bear_ok(탄탄베이스+RS90+손절폭적정) 3조건 충족만
  if (bearOkOnly && mode !== 'breakdown' && mode !== 'stage2' && mode !== 'ibd9' && mode !== 'earnings') {
    list = list.filter(h => h.bear_ok === true);
  }
  if (strictMode && mode !== 'breakdown' && mode !== 'stage2' && mode !== 'ibd9' && mode !== 'earnings') {
    list = list.filter(h => {
      const rsOk = (h.rs ?? 0) >= 90;
      const volOk = (h.vol_mult ?? 0) >= 1.5 || (h.vol_ratio ?? 0) >= 1.0;
      const rrOk = (h.rr ?? 0) >= 2;
      const riskOk = (h.risk_pct ?? 99) <= 8;
      return rsOk && volOk && rrOk && riskOk;
    });
  }
  // 손절 좁은 순 정렬 (토글): 리스크% 오름차순 — 타이트한 진입 자리가 위로
  if (riskSort) {
    list.sort((a, b) => (a.risk_pct ?? 999) - (b.risk_pct ?? 999));
  }
  // 시간대별 시장 우선 정렬 (전체 탭에서만):
  // 사용자 요청: 한국시간 오전 6시~오후 8시는 한국주 먼저(미국장 끝나자마자~한국장),
  //            그 외(오후 8시~오전 6시)는 미국주 먼저(미국장 진행 시간대)
  if (market === 'all' && !riskSort) {
    const krHour = (new Date().getUTCHours() + 9) % 24;  // 한국시간 (UTC+9)
    const krFirst = (krHour >= 6 && krHour < 20);  // 06~20시: 한국주 먼저, 그 외: 미국주 먼저
    const rank = h => {
      const isKr = h.market === 'KR';
      return krFirst ? (isKr ? 0 : 1) : (isKr ? 1 : 0);
    };
    list.sort((a, b) => rank(a) - rank(b));  // 안정 정렬: 시장 내 원래 순서 유지
  }
  // 즐겨찾기를 최상단으로 (시장 정렬 위에 얹음)
  const isFav = h => favorites.includes((h.ticker || '').toUpperCase());
  list.sort((a, b) => (isFav(b) ? 1 : 0) - (isFav(a) ? 1 : 0));
  content.innerHTML = list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<div class="empty">${(strictMode && mode !== 'breakdown') ? `🎯 주도주 조건(RS 90+ · 거래량 동반 · 손익비 2R+ · 리스크 8%↓)을 모두 충족하는 종목이 없습니다.<br>엄선 필터라 비어있는 게 정상이에요. 해제하려면 '🎯 주도주만'을 다시 누르세요.` : searchQuery ? `'${searchQuery}'은(는) 이 탭의 시그널엔 없어요.<br><span id="lookupHint" style="color:var(--muted);font-size:12px">유니버스 전체에서 찾는 중…</span>` : sectorFilter ? `'${sectorFilter}' 섹터에 해당 종목이 없습니다.` : `현재 조건을 충족하는 ${mode === 'turnaround' ? '추세전환' : mode === 'breakdown' ? 'Stage 4 숏(붕괴)' : mode === 'stage2' ? 'Stage2' : mode === 'ibd9' ? 'IBD 9조건' : mode === 'earnings' ? '실적우수' : '눌림목'} 종목이 없습니다.${mode === 'stage2' ? '<br>유동성·RS70+·Stage2템플릿·거래량수축·MA수렴을 전부 통과해야 해서 0개인 날이 있는 게 정상이에요 — 필터 문제가 아니라 시장이 약하다는 신호.' : mode === 'ibd9' ? '<br>9가지 조건(3개월 수익률 30%+ 포함)을 전부 통과해야 해서 0개인 날이 있는 게 정상이에요.' : mode === 'earnings' ? '<br>RS70+ 상위 종목 중 3년 EPS 연속증가+분기 YoY25%+매출증가를 전부 통과해야 해서 0개인 날이 있는 게 정상이에요.' : '<br>장 상황에 따라 비어있는 게 자연스러운 결과예요.'}`}</div>`;
  // 탭 결과에 없으면 유니버스 전체 조회 (검색어 있을 때만)
  if (!list.length && searchQuery && !strictMode) {
    triggerLookup(searchQuery);
  } else {
    // v4.82: 이번 탭에서 찾아졌거나 검색어를 지웠으면, 이전 검색의 진단 결과가
    // 카드 밑에 그대로 남아있지 않게 정리.
    const dr = document.getElementById('diagResult');
    if (dr) dr.innerHTML = '';
    _lookupLast = '';
  }
  // 별 버튼 이벤트 바인딩
  content.querySelectorAll('.fav-btn').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    const t = b.dataset.ticker;
    await fetch('/api/favorites', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ticker: t})});
    // 로컬 즉시 반영 후 재정렬
    const up = t.toUpperCase();
    if (favorites.includes(up)) favorites = favorites.filter(f => f !== up);
    else favorites.push(up);
    renderCards();
  }));
  // 밸류 보기 버튼 바인딩
  content.querySelectorAll('.fund-btn').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    const t = b.dataset.ticker;
    const box = document.getElementById('fund-' + t);
    if (!box) return;
    // 이미 로드된 종목이면 토글
    if (fundCache[t]) {
      if (box.dataset.shown === '1') { box.innerHTML=''; box.dataset.shown='0'; b.textContent='📊 밸류 보기'; }
      else { box.innerHTML = renderFund(fundCache[t]); box.dataset.shown='1'; b.textContent='📊 밸류 접기'; }
      return;
    }
    b.disabled = true; b.textContent = '불러오는 중…';
    try {
      const res = await fetch('/api/fundamentals/' + encodeURIComponent(t));
      const data = await res.json();
      fundCache[t] = data;
      box.innerHTML = renderFund(data);
      box.dataset.shown = '1';
      b.textContent = '📊 밸류 접기';
    } catch (err) {
      box.innerHTML = '<span class="note">밸류 데이터를 불러오지 못했어요.</span>';
    } finally {
      b.disabled = false;
    }
  }));
}

const fundCache = {};
function renderFund(d) {
  if (!d || d.error) return '<span class="note">밸류 데이터 없음 (해당 종목 미지원).</span>';
  const chips = [];
  if (d.roe != null) chips.push(`<span class="fchip">ROE <b>${d.roe}</b></span>`);
  if (d.per_flag) chips.push(`<span class="fchip" title="순이익 적자이거나 이익이 매우 작아 PER이 무의미한 상태">PER <b>${d.per_flag}</b></span>`);
  if (d.trail_pe != null) chips.push(`<span class="fchip">PER <b>${d.trail_pe}</b></span>`);
  if (d.fwd_pe != null) chips.push(`<span class="fchip">Fwd PER <b>${d.fwd_pe}</b></span>`);
  if (d.pbr != null) chips.push(`<span class="fchip">PBR <b>${d.pbr}</b></span>`);
  if (d.growing === true) chips.push(`<span class="fchip" title="선행 PER<후행 PER → 이익 성장 예상">이익성장 ↑</span>`);
  if (d.per_cheap === true) chips.push(`<span class="fchip" title="선행(추정) PER 8배 미만 = 이익 대비 저평가. 메모리·시클리컬에 특히 유효">PER 8배↓ 싸다</span>`);
  let vd = '';
  if (d.verdict) {
    const cls = d.verdict === '싸다' ? 'cheap' : (d.verdict === '비싸다' ? 'exp' : 'fair');
    const pos = d.pct_in_band != null ? ` (밴드 ${d.pct_in_band}%)` : '';
    vd = `<span class="vd ${cls}">${d.verdict}${pos}</span>`;
  }
  // 안전마진 진입가 (목표주가 × 0.7~0.8)
  let smRow = '';
  if (d.tp != null && d.sm_high != null) {
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const enterCls = d.sm_enter ? 'cheap' : 'exp';
    const enterTxt = d.sm_enter ? '진입 가능구간 ✓' : '아직 비쌈';
    const upTxt = d.sm_upside != null ? ` · 목표가까지 ${d.sm_upside > 0 ? '+' : ''}${d.sm_upside}%` : '';
    smRow = `<span class="note" style="margin-top:6px">안전마진가 (목표 ${fmt(d.tp)} × 0.7~0.8): `
      + `<b style="color:var(--text)">${fmt(d.sm_low)} ~ ${fmt(d.sm_high)}</b> `
      + `<span class="vd ${enterCls}" style="font-size:11px;padding:1px 7px">${enterTxt}</span>${upTxt}</span>`;
  }
  const bandNote = (d.band_low != null && d.band_high != null)
    ? `<span class="note">PER밴드 25~75%: ${d.band_low} ~ ${d.band_high}</span>` : '';
  const krNote = (d.market === 'KR')
    ? '<span class="note">한국주는 네이버 기준 ROE 미제공 · PER밴드는 최근 1년 근사예요.</span>' : '';
  const disclaim = '<span class="note">⚠️ 참고용. 진입 판단은 가격·거래량·추세 기준이에요.</span>';
  return `<div class="row">${chips.join('')}${vd}</div>${smRow}${bandNote}${krNote}${disclaim}`;
}

  try {
    const res = await fetch('/api/rsettings', { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    if (res.ok) rSettings = { ...rSettings, ...(await res.json()) };
  } catch (e) { alert('저장 실패 — 서버 연결을 확인하세요'); return; }
  document.getElementById('rSettingsModal').classList.remove('open');
  if (document.getElementById('journalView').style.display !== 'none') renderJournal();
}

// 1R 금액 (원). 연속 3패면 0.5배로 축소 (2연승 시 복구).
function oneRKrw() {
  const base = (rSettings.equity || 0) * (rSettings.r_pct || 0.5) / 100;
  return consecLosses() >= 3 ? base * 0.5 : base;
}
// 연속 손실 카운트: 종료된 매매를 최신순으로 훑어 연속 음수 R 개수.
// (양수 만나면 중단. 2연승 복구 규칙은 "최근이 연승이면 카운트 0"으로 자연 충족)
function consecLosses() {
  const closed = getJournal()
    .filter(r => r.result_r !== '' && r.status !== 'missed' && !isBrokenRow(r))
    .sort((a, b) => {
      const d = (b.closed_date || b.last_checked || b.date || '')
        .localeCompare(a.closed_date || a.last_checked || a.date || '');
      return d !== 0 ? d : (b.id || 0) - (a.id || 0);   // 같은 날짜면 id(타임스탬프)로
    });
  let n = 0;
  for (const r of closed) {
    if (parseFloat(r.result_r) < 0) n++;
    else break;
  }
  return n;
}

// 포지션 사이즈: 주식수 = 1R금액 ÷ (진입가-손절가). 확신이 있어도 이 수, 없어도 이 수.
function calcShares(entry, stop, market) {
  if (!entry || !stop || entry <= stop) return null;
  const rKrw = oneRKrw();
  if (!rKrw) return null;
  const fx = market === 'KR' ? 1 : (rSettings.usd_krw || 1400);
  const perShareKrw = (entry - stop) * fx;
  const shares = Math.floor(rKrw / perShareKrw);
  return {
    shares,
    rKrw: Math.round(rKrw),
    posKrw: Math.round(shares * entry * fx),
    riskPct: Math.round((entry - stop) / entry * 1000) / 10,
    reduced: consecLosses() >= 3,
  };
}

// 현재 오픈 리스크 합계 (R). 진입(entered) 상태만.
// shares가 기록된 신규 항목은 정확 계산, 구버전 항목은 보수적으로 1R 간주.
// 손절이 본전 위로 올라간(free trade) 항목은 0R.
function openRiskR() {
  const rKrwNow = (rSettings.equity || 0) * (rSettings.r_pct || 0.5) / 100;
  let total = 0;
  for (const r of getJournal()) {
    if ((r.status || 'entered') !== 'entered' || r.result_r !== '' || isBrokenRow(r)) continue;
    const entry = parseFloat(r.entry), stop = parseFloat(r.stop);
    if (!entry || !stop) continue;
    if (r.shares && r.r_value_krw) {
      const fx = /\.(KS|KQ)$/i.test(r.ticker || '') ? 1 : (rSettings.usd_krw || 1400);
      total += Math.max(0, r.shares * (entry - stop) * fx) / r.r_value_krw;
    } else if (rKrwNow > 0) {
      total += stop >= entry ? 0 : 1;   // 구버전: 사이즈 모름 → 1R 가정
    } else {
      total += 1;
    }
  }
  return Math.round(total * 100) / 100;
}

// 기간 실현 R: 이번 주(월~일) / 이번 달 종료 매매의 result_r 합.
function periodR() {
  const now = new Date();
  const day = (now.getDay() + 6) % 7;              // 월=0
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - day);
  const wk = kstStr(weekStart);
  const mo = kstStr(now, 7);
  let week = 0, month = 0;
  for (const r of getJournal()) {
    if (r.result_r === '' || r.status === 'missed' || isBrokenRow(r)) continue;
    const d = r.closed_date || r.last_checked || r.date || '';
    const v = parseFloat(r.result_r); if (isNaN(v)) continue;
    if (d >= wk) week += v;
    if (d.slice(0, 7) === mo) month += v;
  }
  return { week: Math.round(week * 100) / 100, month: Math.round(month * 100) / 100 };
}

// 게이트별 오픈 리스크 상한
function effectiveCapR() {
  if (rSettings.gate === 'correction') return 0;
  if (rSettings.gate === 'pressure') return Math.min(rSettings.max_open_r || 3, 1.5);
  return rSettings.max_open_r || 3;
}

// 진입 게이트: 신규 '진입(entered)'이 허용되는지. 관찰/대기 추가는 항상 허용.
function entryGate(newR = 1) {
  const open = openRiskR();
  const cap = effectiveCapR();
  const { week, month } = periodR();
  if (rSettings.gate === 'correction')
    return { allowed: false, reason: '🔴 시장 게이트: 조정 — 신규 진입 0, 현금 유지' };
  if (month <= -(rSettings.monthly_stop_r || 6))
    return { allowed: false, reason: `🔒 월간 서킷브레이커: ${month}R (한도 -${rSettings.monthly_stop_r}R) — 이 달 신규 진입 종료` };
  if (week <= -(rSettings.weekly_stop_r || 3))
    return { allowed: false, reason: `🔒 주간 서킷브레이커: ${week}R (한도 -${rSettings.weekly_stop_r}R) — 이번 주는 관찰만` };
  if (open + newR > cap + 0.001)
    return { allowed: false, reason: `🔒 오픈 리스크 상한: 현재 ${open}R + 신규 ${newR}R > 허용 ${cap}R — 기존 포지션 정리 후 진입` };
  return { allowed: true, reason: '' };
}

// 진입 폼 실시간 계산줄 렌더
function renderCalcLine(elId, entry, stop, market) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.classList.remove('warn', 'lock');
  if (!rSettings.equity) {
    el.innerHTML = `⚙️ 총자산 미설정 — 일지 탭의 <b style="cursor:pointer;text-decoration:underline" onclick="openRSettings()">R 설정</b>에서 입력하면 주식수가 자동 계산돼요`;
    el.classList.add('warn');
    return;
  }
  const c = calcShares(entry, stop, market);
  if (!c) { el.innerHTML = '진입가·손절가를 입력하면 주식수가 계산됩니다 (손절 < 진입)'; return; }
  const fx = market === 'KR' ? '' : ` · 환율 ${rSettings.usd_krw}`;
  // 피벗 대비 추격 정도 (미너비니: 피벗 +2% 이상 추격 금지 — BHE 교훈)
  let chase = '';
  const pv = pendingStock ? parseFloat(pendingStock.pivot) : null;
  if (elId === 'jmCalc' && pv && entry) {
    const chasePct = (entry / pv - 1) * 100;
    if (chasePct > 2) chase = ` · <span style="color:#ff6b6b;font-weight:700">⚠️ 피벗 +${chasePct.toFixed(1)}% 추격 — 다음 기회 권장</span>`;
    else if (chasePct > 0.5) chase = ` · <span style="color:var(--amber)">피벗 +${chasePct.toFixed(1)}%</span>`;
  }
  const cut = c.reduced ? ` <span style="color:var(--amber)">⚠️ 연속 ${consecLosses()}패 → R 절반 축소</span>` : '';
  const gate = entryGate();
  let gateLine = '';
  if (!gate.allowed) {
    el.classList.add('lock');
    gateLine = `<div style="margin-top:4px;color:#ff9b9b">${gate.reason}<br>→ 저장은 <b style="color:#ffd98a">관찰(대기)</b>로만 가능</div>`;
  }
  el.innerHTML =
    `1R = <b>${c.rKrw.toLocaleString()}원</b>${cut} · 리스크폭 ${c.riskPct}%${fx}${chase}<br>` +
    `→ <b style="font-size:14px">${c.shares.toLocaleString()}주</b> ` +
    `(진입금액 약 ${(c.posKrw / 10000).toLocaleString(undefined, {maximumFractionDigits: 0})}만원)` + gateLine;
}
function hookCalcInputs() {
  const jm = () => renderCalcLine('jmCalc',

// ── 유동성 판정 (v4.49.2): 내 포지션 ÷ 평균 거래대금 ──
// 시총이 아니라 "내가 나올 수 있느냐"가 기준. R 설정 기반 상대 비율이라
// 계좌가 커지면 기준이 자동으로 엄격해짐.
//   5% 미만 = 문제없음 / 5~15% = 💧 주의(분할 청산 전제) / 15%+ = 🚱 부적합
function liquidityCheck(s) {
  if (!rSettings.equity || !s.avg_turnover || !s.risk_pct || s.risk_pct <= 0) return null;
  const rKrw = (rSettings.equity || 0) * (rSettings.r_pct || 0.5) / 100;
  const posKrw = rKrw / (s.risk_pct / 100);                      // 1R 기준 포지션 금액
  const fx = s.market === 'KR' ? 1 : (rSettings.usd_krw || 1400);
  const avgTurnKrw = s.avg_turnover * fx;
  if (avgTurnKrw <= 0) return null;
  const ratio = posKrw / avgTurnKrw;
  if (ratio < 0.05) return null;                                  // 정상 — 뱃지 없음
  const pct = Math.round(ratio * 100);
  const posM = Math.round(posKrw / 10000).toLocaleString();
  const turnM = Math.round(avgTurnKrw / 10000).toLocaleString();
  if (ratio >= 0.15) return { cls: 'bad', label: '🚱 유동성부족',
    tip: `예상 포지션 ${posM}만원 = 평균 거래대금 ${turnM}만원의 ${pct}%. 청산 시 내가 시장을 움직이는 수준 — 매매 부적합. 관찰만.` };
  return { cls: 'warn', label: '💧 유동성주의',
    tip: `예상 포지션 ${posM}만원 = 평균 거래대금 ${turnM}만원의 ${pct}%. 급할 때 한 번에 못 나감 — 사이즈 절반 + 분할 청산 전제로만.` };
}

// ════════════════ 매매 일지 (서버 저장, 기기 간 동기화) ════════════════
const JKEY = 'pullback_journal_v1';   // 구 localStorage 키 (마이그레이션용)
let journalCache = [];                 // 메모리 캐시 (서버와 동기화)

function _normalize(arr) {
  // 구버전 기록 보정: 새 필드가 없으면 기본값 채움
  return (arr || []).map(r => ({
    category: (r.tab === '급등') ? '단타' : '추세추종',
    held_days: '', review: '', exit: '', result_r: '',
    note: '', signal: '', sector: '', pivot_type: '',
    ...r
  }));
}

function getJournal() { return journalCache; }

// v4.71: 감시 버튼 상태 유지 — 이미 대기(pending) 등록된 티커면 카드 재렌더링 시에도 비활성 표시
function isPendingWatch(ticker) {
  return (journalCache || []).some(r => r.ticker === ticker && r.status === 'pending');
}

function setJournal(arr) {
  journalCache = arr;
  return _saveJournalToServer(arr);
}

// 서버 저장 (성공 확인 + 1회 재시도 + 실패 시 알림)
async function _saveJournalToServer(arr, _retry = true) {
  try {
    const res = await fetch('/api/journal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(arr)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  } catch (e) {
    if (_retry) {   // 1회 재시도
      await new Promise(r => setTimeout(r, 800));
      return _saveJournalToServer(arr, false);
    }
    console.error('일지 저장 실패:', e);
    if (typeof showSaveError === 'function') showSaveError();
    return false;
  }
}

function showSaveError() {
  let bar = document.getElementById('saveErrorBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'saveErrorBar';
    bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--up);color:#fff;padding:10px;text-align:center;z-index:9999;font-size:13px';
    bar.textContent = '⚠️ 일지 저장에 실패했어요. 네트워크 확인 후 다시 시도하세요. (화면 데이터는 유지됨)';
    document.body.appendChild(bar);
    setTimeout(() => bar.remove(), 6000);
  }
}

// 앱 시작 시 서버에서 일지 로드 + 구 localStorage 데이터 마이그레이션
async function loadJournalFromServer() {
  let serverData = [];
  try {
    const res = await fetch('/api/journal');
    serverData = await res.json();
  } catch(e) { serverData = []; }

  // 마이그레이션: 서버가 비었고 localStorage에 옛 일지가 있으면 한 번 올림
  let localData = [];
  try { localData = JSON.parse(localStorage.getItem(JKEY) || '[]'); } catch(e) {}
  if ((!serverData || serverData.length === 0) && localData.length > 0) {
    journalCache = _normalize(localData);
    await fetch('/api/journal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(journalCache)
    }).catch(()=>{});
    console.log('localStorage 일지 ' + localData.length + '건을 서버로 이전했어요.');
  } else {
    journalCache = _normalize(serverData);
  }
  // 일지 탭이 열려있으면 갱신
  if (typeof renderJournal === 'function' && document.getElementById('journalView').style.display !== 'none') {
    renderJournal();
  }
  // 로드 후 추적 종목 가격 갱신 (자동 종료 판정)
  updateTracking();
}

// ── 페이퍼 추적: 앱 열 때 추적 종목 현재가 갱신 + 자동 종료 판정 ──
const TRACK_DAYS = 14;   // 추적 기간 2주
const WATCH_DAYS = 14;   // 대기 유효기간 (돌파 셋업은 이 안에 터져야 유효, 지나면 자동 무산)
// 트레이딩뷰 차트 URL — 한국주는 KRX, 미국주는 거래소 자동판별 대신 심볼만
function tvUrl(tickerOrObj, market) {
  // 카드는 객체(s)를, 일지는 (ticker, market)을 넘김 — 둘 다 처리
  let ticker = tickerOrObj;
  if (tickerOrObj && typeof tickerOrObj === 'object') {
    ticker = tickerOrObj.ticker;
    market = tickerOrObj.market;
  }
  if (!ticker) return '#';
  ticker = String(ticker).toUpperCase();
  if (market === 'kr' || market === 'KR' || /\.(KS|KQ)$/.test(ticker)) {
    const code = ticker.replace(/\.(KS|KQ)$/, '');
    return `https://www.tradingview.com/chart/?symbol=KRX:${code}`;
  }
  // 미국주: 거래소 접두어 없이 심볼만 줘도 트레이딩뷰가 자동 해석
  return `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(ticker.replace(/\./g, ''))}`;
}

// 수동 현재가 갱신: 추적을 즉시 돌리고 성공/실패를 사용자에게 알림.
// "추적대기"가 안 풀릴 때 원인 진단용.
async function refreshPrices() {
  const j = getJournal();
  const active = j.filter(r => r.result_r === '' && r.status !== 'missed'
                            && r.entry && (r.stop || r.status === 'watch')
                            && (r.tracking || r.status === 'pending' || r.status === 'entered'));
  if (active.length === 0) { alert('추적할 진입/대기 종목이 없어요.'); return; }
  let prices = {}, mclosed = {};
  let errMsg = '';
  try {
    const res = await fetch('/api/prices', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tickers: active.map(r => r.ticker) })
    });
    if (!res.ok) { errMsg = `서버 응답 오류 (${res.status})`; }
    else { const j = await res.json(); prices = j.prices || {}; mclosed = j.closed || {}; }
  } catch(e) { errMsg = '네트워크 오류: ' + e.message; }

  if (errMsg) { alert('현재가 갱신 실패\n' + errMsg); return; }

  const got = Object.keys(prices).length;
  const missing = active.filter(r => prices[r.ticker] == null).map(r => r.name);
  // 가격 반영 (updateTracking과 동일 로직 재사용)
  await updateTracking(prices, mclosed);

  let msg = `현재가 갱신 완료\n성공: ${got}개`;
  if (missing.length) msg += `\n실패(가격 못 가져옴): ${missing.join(', ')}`;
  alert(msg);
}

// ── v4.98: 진입종목 급락 알림 ──
// "짧은 시간 안에 -5% 이상 급락"은 오늘 등락률(며칠에 걸친 하락 포함)과 달리
// 폴링 주기(60초) 사이의 변화만 봐야 의미가 있어서, updateTracking()이 매번
// 직전 체크가(last_price)와 비교해서 판정한다.
const FLASH_DROP_PCT = -5;
const _flashAlertLast = {};  // ticker -> 마지막 알림 시각(ms), 같은 종목 재알림 쿨다운
function showFlashBanner(msg) {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);'
    + 'background:#3a2020;color:#ff9b9b;border:1px solid #ff6b6b;border-radius:10px;'
    + 'padding:10px 18px;font-size:13px;font-weight:600;z-index:9999;white-space:pre-line;'
    + 'text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.35)';
  bar.textContent = msg;
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 12000);
}
function notifyFlashDrop(r, prevPx, px, dropPct) {
  const now = Date.now();
  const last = _flashAlertLast[r.ticker] || 0;
  if (now - last < 10 * 60 * 1000) return;  // 종목당 10분 쿨다운(같은 하락에 반복 알림 방지)
  _flashAlertLast[r.ticker] = now;
  const msg = `🔴 ${r.name} 급락 ${dropPct.toFixed(1)}%\n`
    + `${Math.round(prevPx).toLocaleString()} → ${Math.round(px).toLocaleString()}`;
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    try { new Notification('⚠️ 급락 알림', { body: msg, tag: 'flash-' + r.ticker }); } catch (e) {}
  }
  showFlashBanner(msg);  // 알림 권한이 없거나 탭이 열려 있을 때도 놓치지 않게 인앱 배너 병행
}
// 진입 종목만 60초마다 자동 폴링 — 급락은 수동 새로고침/탭 열람만으론 못 잡음.
let _flashPollTimer = null;
function startFlashDropPolling() {
  if (_flashPollTimer) return;
  _flashPollTimer = setInterval(() => {
    const j = getJournal();
    const hasEntered = j.some(r => r.result_r === '' && r.status === 'entered' && r.entry && r.stop);
    if (hasEntered) updateTracking();
  }, 60000);
}

async function updateTracking(prefetched, prefetchedClosed) {
  const j = getJournal();
  // 추적 대상: 미종료 + entry/stop 있음. 진입(entered)·대기(pending) 모두 가격 갱신.
  // status==='missed'만 제외. (과거에 tracking 플래그가 꺼진 진입 종목도 포함되게 보강)
  const active = j.filter(r => r.result_r === '' && r.status !== 'missed'
                            && r.entry && (r.stop || r.status === 'watch')
                            && (r.tracking || r.status === 'pending' || r.status === 'entered'));
  if (active.length === 0) return;
  let prices = prefetched || {};
  let mclosed = prefetchedClosed || {};
  if (!prefetched) {
    try {
      const res = await fetch('/api/prices', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ tickers: active.map(r => r.ticker) })
      });
      const j2 = await res.json();
      prices = j2.prices || {};
      mclosed = j2.closed || {};
    } catch(e) { return; }
  }

  const today = new Date();
  let changed = false;
  for (const r of active) {
    const px = prices[r.ticker];
    if (px == null) continue;
    // v4.98: 급락 알림 — 짧은 폴링 주기(60초) 동안 진입 종목이 -5% 이상 빠지면
    // 알림. 직전 체크가(prevPx) 있고 지금 이미 진입 상태였을 때만 비교해야
    // "짧은 시간 내" 급변을 잡음(며칠 전 갱신값과 비교하면 그냥 하락장 판정).
    const wasEntered = (r.status || 'entered') === 'entered';
    const prevPx = parseFloat(r.last_price);
    r.last_price = px;
    r.last_checked = kstStr(today);
    if (wasEntered) r.tracking = true;  // 진입 종목은 추적 켜기(표시용)
    if (wasEntered && prevPx > 0) {
      const dropPct = (px - prevPx) / prevPx * 100;
      if (dropPct <= FLASH_DROP_PCT) notifyFlashDrop(r, prevPx, px, dropPct);
    }
    const entry = parseFloat(r.entry), stop = parseFloat(r.stop);
    const target = parseFloat(r.target);
    const oneR = entry - stop;
    if (oneR <= 0) { changed = true; continue; }
    // v4.68: 손절은 종가로만 확정. 장중엔 순간가가 손절가를 스쳐도(꼬리) 종료 처리하지
    // 않고 '터치'만 기록 — 장중 노이즈로 손절 확정 후 종가에 다시 말아올려도 일지에
    // 반영 안 되던 문제(장중엔 계속 진입중으로 남고, 종가 확인 시점에 이미 회복해
    // px<=stop이 거짓이 되어 영영 손절로 안 잡히던 버그) 수정.
    // mclosed[ticker]가 없으면(과거 캐시 등) 보수적으로 '장마감'으로 간주해 기존 동작 유지.
    const mClosedNow = mclosed[r.ticker] !== false;

    // ── 대기(pending): 아직 안 산 추적관찰 ──
    // 진입가(피벗) 도달 → 자동 '진입'으로 전환, 진입일 갱신.
    // 자동 무산 2조건: (1) 대기 WATCH_DAYS일 경과(셋업 식음)
    //                  (2) 종가가 손절가 아래로 빠짐(베이스/셋업 붕괴)
    if ((r.status || 'entered') === 'pending') {
      if (px >= entry) {
        r.status = 'entered';
        r.tracking = true;
        r.date = kstStr(today);  // 실제 진입일로 갱신
        r.closed_reason = '';
        changed = true;
        continue;
      }
      // 자동 무산 판정 (종가 확정 후에만 — 장중 터치는 무산시키지 않음)
      const waitDays = Math.floor((today - new Date(r.date)) / 86400000);
      if (stop && px <= stop && mClosedNow) {
        r.status = 'missed';
        r.tracking = false;
        r.closed_reason = '셋업붕괴(손절가 이탈)';
        changed = true;
        continue;
      }
      if (waitDays >= WATCH_DAYS) {
        r.status = 'missed';
        r.tracking = false;
        r.closed_reason = `대기만료(${WATCH_DAYS}일 미돌파)`;
        changed = true;
        continue;
      }
      changed = true;
      continue;  // pending인 동안은 손절/목표/만료 판정 안 함
    }

    // ── 진입(entered): 실제 매수 → 손절 자동추적, 14일 만료는 자동종료 안 함 ──
    // (페이퍼 검증 시절엔 14일 자동종료했지만, 실제 매매 기록이 된 후로는
    //  사용자가 직접 ⏹종료 누를 때까지 현재가·R을 계속 추적한다.)
    const daysHeld = Math.floor((today - new Date(r.date)) / 86400000);
    let closed = false, reason = '', resultR = null;
    // 장중엔 터치만 기록(배지 표시용), 종가에만 최종 손절 확정.
    r.stop_touched_intraday = (!mClosedNow && px <= stop);
    if (mClosedNow && px <= stop) { closed = true; reason = '손절도달'; resultR = -1; }
    // v4.95: 목표(2R) 도달 자동 전량종료 제거. 실제 매매 방식(2R/30%에서 부분
    // 익절 후 나머지 홀딩)과 자동 전량청산이 충돌해서, 부분익절 하려고 들어간
    // 사이 종목이 먼저 자동 종료돼버리는 사고가 있었음(WTTR 사례). 이제는
    // 플래그만 남기고 실제 종료는 사용자가 🔪부분/⏹종료로 직접 판단한다.
    r.target_reached = !!(target && px >= target);

    if (closed) {
      r.tracking = false;
      r.status = 'closed';
      r.stop_touched_intraday = false;
      r.result_r = (Math.round(resultR * 100) / 100).toString();
      r.exit = Math.round(px * 100) / 100;
      r.closed_reason = reason;
      r.exit_reason = reason;
      r.held_days = daysHeld;
      r.closed_date = kstStr();   // 주간/월간 R 집계 기준
    }
    changed = true;
  }
  if (changed) {
    setJournal(j);
    if (document.getElementById('journalView').style.display !== 'none') renderJournal();
  }
}

let pendingStock = null;
// 모드→탭이름 매핑 (한 곳에서만 관리 — 새 모드 추가시 여기만 수정)
const MODE_TAB_LABEL = {
  imminent: '돌파임박',
  pattern: '패턴',
  pullback: '눌림목',
  breakout: '돌파',
  boxbreak: '박스돌파',
  turnaround: '추세전환',
  leader: '대장후보',
  super: '슈퍼대장',
  surge: '급등',
  stage2: 'Stage2',
  ibd9: 'IBD9',
  earnings: '실적우수',
};
// ── 📅 활동 달력 (v4.52): 날짜별 분석/등록 종목 한눈에 ──
let _jcal = null;   // {y, m} 표시 중인 달
function jcalNav(d) {
  if (!_jcal) return;
  _jcal.m += d;
  if (_jcal.m < 0) { _jcal.m = 11; _jcal.y--; }
  if (_jcal.m > 11) { _jcal.m = 0; _jcal.y++; }
  renderJournal();
}
function renderJCal(all) {
  // 날짜별 종목명 그룹 (등록일 기준, 모든 카테고리 포함 — "그날 뭘 봤나")
  const byDay = {};
  for (const r of all) {
    const d = (r.date || '').slice(0, 10);
    if (!d) continue;
    (byDay[d] = byDay[d] || []).push(r.name || r.ticker || '?');
  }
  if (!Object.keys(byDay).length) return '';
  const now = new Date();
  if (!_jcal) _jcal = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = _jcal;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();                 // 0=일
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = kstStr(now);
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const names = byDay[ds] || [];
    const isToday = ds === todayStr;
    const dow = (startDow + d - 1) % 7;
    const shown = names.slice(0, 3);
    const more = names.length - shown.length;
    cells += `<div style="min-height:52px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;${isToday ? 'border-color:var(--green);' : ''}${names.length ? 'background:var(--surface);cursor:help' : 'opacity:.45'}" title="${names.join(', ')}">
      <div style="font-size:10px;color:${dow === 0 ? '#f87171' : dow === 6 ? '#7fb8e0' : 'var(--muted)'};font-weight:${isToday ? '800' : '400'}">${d}</div>
      ${shown.map(n => `<div style="font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35">${n}</div>`).join('')}
      ${more > 0 ? `<div style="font-size:9px;color:var(--muted)">+${more}</div>` : ''}
    </div>`;
  }
  return `
  <div style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;font-weight:700">📅 활동 달력 <span style="color:var(--muted);font-weight:400;font-size:11px">날짜별 분석·등록 종목 (셀에 마우스: 전체 목록)</span></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn" style="padding:2px 10px" onclick="jcalNav(-1)">‹</button>
        <b style="font-size:13px">${y}.${String(m + 1).padStart(2, '0')}</b>
        <button class="btn" style="padding:2px 10px" onclick="jcalNav(1)">›</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
  </div>`;
}

// ── R 누적 곡선 (v4.48.2): 종료 매매를 시간순으로 누적 — 시스템의 에쿼티 커브 ──
// 우상향이면 시스템이 작동 중, 꺾이면 규칙 위반이나 시장 역행을 의심.
function renderRCurve(all) {
  const closed = all
    .filter(r => r.result_r !== '' && r.status !== 'missed' && (r.category || '추세추종') !== '관찰')
    .map(r => ({ d: r.closed_date || r.last_checked || r.date || '', v: parseFloat(r.result_r) }))
    .filter(x => !isNaN(x.v))
    .sort((a, b) => a.d.localeCompare(b.d));
  if (closed.length < 2) return '';
  let cum = 0;
  const pts = closed.map(x => (cum += x.v, { d: x.d, c: cum }));
  const W = 560, H = 120, PAD = 8;
  const min = Math.min(0, ...pts.map(p => p.c));
  const max = Math.max(0, ...pts.map(p => p.c));
  const span = (max - min) || 1;
  const X = i => PAD + i / (pts.length - 1) * (W - PAD * 2);
  const Y = v => PAD + (max - v) / span * (H - PAD * 2);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.c).toFixed(1)}`).join(' ');
  const zero = Y(0);
  const last = pts[pts.length - 1].c;
  const col = last >= 0 ? 'var(--green)' : '#ff6b6b';
  // 최대 낙폭 (R 기준 드로다운)
  let peak = -1e9, mdd = 0;
  for (const p of pts) { peak = Math.max(peak, p.c); mdd = Math.min(mdd, p.c - peak); }
  const dots = pts.map((p, i) =>
    `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.c).toFixed(1)}" r="2.5" fill="${closed[i].v >= 0 ? 'var(--green)' : '#ff6b6b'}"><title>${p.d} · ${closed[i].v > 0 ? '+' : ''}${closed[i].v}R → 누적 ${p.c.toFixed(2)}R</title></circle>`).join('');
  return `
  <div style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <div style="font-size:13px;font-weight:700">📈 R 누적 곡선 <span style="color:var(--muted);font-weight:400;font-size:11px">종료 ${pts.length}건 · 관찰 제외</span></div>
      <div style="font-size:12px">누적 <b style="color:${col}">${last > 0 ? '+' : ''}${last.toFixed(2)}R</b> · 최대낙폭 <span style="color:#ff9b9b">${mdd.toFixed(2)}R</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin-top:6px">
      <line x1="${PAD}" y1="${zero.toFixed(1)}" x2="${W - PAD}" y2="${zero.toFixed(1)}" stroke="var(--line)" stroke-dasharray="3,3"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2"/>
      ${dots}
    </svg>
  </div>`;
}

function modeTab(mode) { return MODE_TAB_LABEL[mode] || mode || '-'; }
// 트레이딩뷰 차트 URL (v4.52.2): 한국은 KRX:6자리코드, 미국은 티커
function modeCategory(mode) { return mode === 'surge' ? '단타' : '추세추종'; }
// v4.64: 원클릭 관찰 등록 — 모달 없이 카드 피벗·손절 그대로 봇 감시 시작
async function quickWatch(btn, ticker) {
  const s = lastHits.find(h => h.ticker === ticker);
  if (!s) return;
  if (!s.pivot) { btn.textContent = '피벗없음'; return; }
  btn.disabled = true; btn.textContent = '등록중…';
  try {
    const res = await fetch('/api/watch/quick', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticker: s.ticker, name: s.name, market: s.market,
        pivot: s.pivot, stop: s.stop, tab: modeTab(s.mode), score: s.score,
      })
    });
    const j = await res.json();
    if (j.ok) {
      btn.textContent = j.exists ? '✓ 감시중' : '✓ 등록됨';
      btn.style.background = '#12351f';
      // v4.80: /api/watch/quick은 서버 일지에만 저장하고 클라이언트 journalCache는
      // 안 건드려서, 등록 직후 '내 일지' 탭으로 가면 옛 캐시가 그대로 보여
      // 방금 감시 등록한 종목이 안 보이던 문제. 서버에서 다시 읽어와 캐시 동기화.
      await loadJournalFromServer();
    } else {
      btn.textContent = '실패'; btn.disabled = false;
    }
  } catch (e) { btn.textContent = '실패'; btn.disabled = false; }
}

function openJournal(ticker) {
  const s = lastHits.find(h => h.ticker === ticker);
  if (!s) return;
  pendingStock = s;
  document.getElementById('jmSub').textContent = `${s.name} (${s.ticker}) · ${s.market}`;
  const tab = modeTab(s.mode);
  const sig = (s.triggered ? '🔥 트리거 ' : '') + (s.leader ? '👑 ' : '');
  document.getElementById('jmAuto').innerHTML =
    `<b>${tab}</b> 탭 · 섹터 <b>${s.sector || '-'}</b> · RS <b>${s.rs}</b>` +
    `${s.setup_score != null ? ` · 전일점수 <b>${Math.round(s.setup_score)}</b>` : ''}<br>` +
    `${sig ? `신호 <b>${sig}</b> · ` : ''}피벗종류 <b>${s.pivot_type || '-'}</b> · ` +
    `현재가 <b>${fmtPrice(s.close, s.market)}</b> · 리스크 <b>${s.risk_pct != null ? s.risk_pct + '%' : '-'}</b>` +
    `${s.alert ? ` · ⚠️ <b>${s.alert}</b>` : ''}`;
  // 진입가 기본값:
  //  돌파 계열(돌파/돌파임박/박스돌파)은 피벗 돌파 시 진입이므로 entry = 피벗
  //  눌림목/추세전환 등은 현재가 근처 진입이므로 entry = 현재가
  //  (실제 매매한 종목이면 사용자가 직접 수정)
  const breakoutModes = ['breakout', 'imminent', 'boxbreak'];
  const entryDefault = (breakoutModes.includes(s.mode) && s.pivot != null)
    ? s.pivot
    : s.close;
  document.getElementById('jmEntry').value = entryDefault != null ? Math.round(entryDefault) : '';
  document.getElementById('jmStop').value = s.stop != null ? Math.round(s.stop) : '';
  // 진입가 라벨 힌트 — 돌파 계열이면 피벗 돌파가 기준임을 표시
  const elLabel = document.getElementById('jmEntryLabel');
  if (elLabel) elLabel.textContent = breakoutModes.includes(s.mode)
    ? '진입 가정가 (피벗 돌파가)'
    : '진입 가정가 (현재가 근처)';
  document.getElementById('jmNote').value = '';
  const jc = document.getElementById('jmCat');
  if (jc) jc.value = modeCategory(s.mode);
  if (window._resetModalPos) window._resetModalPos();
  document.getElementById('journalModal').classList.add('open');
  if (window._jmCalcRefresh) window._jmCalcRefresh();   // R 사이즈 계산줄 즉시 표시
}
function closeJournal() {
  document.getElementById('journalModal').classList.remove('open');
  pendingStock = null;
}

// ── 수동 종목 추가 (스캐너에 없는 종목) ──
function openManualAdd() {
  ['maTicker','maName','maSector','maPivot','maStop','maNote'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  document.getElementById('maMarket').value = 'US';
  document.getElementById('manualModal').classList.add('open');
}
function closeManualAdd() {
  document.getElementById('manualModal').classList.remove('open');
}
async function saveManualAdd() {
  let ticker = document.getElementById('maTicker').value.trim().toUpperCase();
  const market = document.getElementById('maMarket').value;
  const status = document.getElementById('maStatus').value;   // pending | entered | watch
  let pivot = parseFloat(document.getElementById('maPivot').value);
  if (!ticker) { alert('종목코드를 입력하세요'); return; }
  const isEntered = status === 'entered';
  const isWatch = status === 'watch';

  // v4.96: 시장을 한국(KR)으로 골라도 코드에 .KS/.KQ가 없으면(예: "477850")
  // is_kr() 판정(접미사만 봄)에 안 걸려서 가격 조회가 엉뚱하게 미국(yfinance)
  // 경로로 새 신규상장주(마키나락스 477850)에서 재현됨. 코스닥/코스피 둘 다
  // 조회해서 실제로 값이 오는 접미사로 티커 자체를 바로잡는다(저장값도 포함).
  let fetchedPrice = null;
  if (market === 'KR' && /^\d{5,6}$/.test(ticker)) {
    try {
      const cand = [ticker + '.KQ', ticker + '.KS'];
      const res = await fetch('/api/prices', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ tickers: cand })
      });
      const j = await res.json();
      const prices = j.prices || {};
      const hit = cand.find(t => prices[t] != null);
      if (hit) { ticker = hit; fetchedPrice = prices[hit]; }
    } catch (e) { /* 아래에서 기존 로직으로 처리 */ }
  }

  // 진입이면 '진입가', 대기면 '피벗가'가 필수. 관찰은 피벗을 만드는 셋업이 아닐 수
  // 있어 필수 아님 — 비우면 현재가를 가져와 채운다 (v4.72).
  if (!pivot || isNaN(pivot)) {
    if (!isWatch) {
      alert(isEntered ? '진입가를 입력하세요' : '피벗가를 입력하세요 (돌파 알림 기준)');
      return;
    }
    if (fetchedPrice) {
      pivot = fetchedPrice;
    } else {
      try {
        const res = await fetch('/api/prices', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ tickers: [ticker] })
        });
        const j = await res.json();
        pivot = (j.prices || {})[ticker];
      } catch (e) { pivot = null; }
    }
    if (!pivot) {
      alert('현재가를 가져오지 못했어요. 관심 등록가를 직접 입력해주세요.');
      return;
    }
  }
  const stop = parseFloat(document.getElementById('maStop').value) || null;
  // 진입 상태면 손절 필수 (R 계산·손절 알림에 필요). 관찰은 손절 없이도 됨.
  if (isEntered && !stop) { alert('진입 종목은 손절가가 필요해요 (R 계산·손절 알림)'); return; }
  // 손절 검증: 있으면 기준가보다 낮아야 함
  if (stop && stop >= pivot) { alert('손절가는 ' + (isEntered ? '진입가' : '피벗가') + '보다 낮아야 해요'); return; }
  const name = document.getElementById('maName').value.trim() || ticker;
  const sector = document.getElementById('maSector').value.trim();
  const note = document.getElementById('maNote').value.trim();
  const today = kstStr();
  // 관찰은 category='관찰'로 표시해 통계에서 제외됨
  const cat = status === 'watch' ? '관찰' : '';
  const tab = status === 'watch' ? '수동관찰' : (isEntered ? '수동진입' : '수동관찰');
  const rec = {
    id: Date.now(), date: today, ticker, name, market,
    cat, category: cat, tab, signal: '', pivot_type: '수동', setup_score: '',
    rs: '', entry: pivot, stop, pivot,           // entry: 진입이면 진입가, 아니면 피벗
    risk_pct: stop ? Math.round((pivot - stop) / pivot * 1000) / 10 : '',
    sig_level: '', sig_flags: '', avwap_zone: '', rr_at_entry: '',
    tracking: true, target: stop ? Math.round((pivot + (pivot - stop) * 2) * 100) / 100 : '',
    last_price: pivot, last_checked: today, closed_reason: '',
    status,                                       // 선택한 상태 (대기/진입/관찰)
    manual: true,                                 // 수동 추가 표시
    sector, alert: '', note,
    exit: '', result_r: '', held_days: '', review: ''
  };
  const j = getJournal(); j.unshift(rec);
  journalCache = j;
  closeManualAdd();
  const ok = await _saveJournalToServer(j);
  if (ok !== false) renderJournal();
}

(function setupModalDrag() {
  let dragging = false, startX = 0, startY = 0, curX = 0, curY = 0;
  function onDown(e) {
    const handle = document.querySelector('#journalModal .drag-handle');
    if (!handle || !handle.contains(e.target)) return;
    dragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX - curX;
    startY = pt.clientY - curY;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;

    curX = pt.clientX - startX;
