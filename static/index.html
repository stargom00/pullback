function renderJournal() {
  const wrap = document.getElementById('journalView');
  const all = getJournal();
  if (!all.length) {
    wrap.innerHTML = `
      <div class="riskbar"><span style="color:var(--muted)">⚙️ R 시스템 — 총자산을 입력하면 사이즈 자동계산·서킷브레이커가 켜져요</span>
        <button class="exp" onclick="openRSettings()" style="margin-left:auto">⚙️ R 설정</button></div>
      <div class="jrnl-empty">아직 기록이 없어요.<br>
      카드에서 <b>"+ 일지에 추가"</b>를 눌러 신호를 기록하세요.<br>
      진입가·손절·근거만 적으면 나머지는 자동으로 채워집니다.</div>`;
    return;
  }
  // 필터: 상태(진입중/대기/종료) 또는 카테고리(추세/단타/관찰)
  const isWatch = r => (r.category || '추세추종') === '관찰';
  const stOf = r => r.status || (r.result_r ? 'closed' : 'entered');
  let j = all;
  if (journalFilter === 'entered') j = all.filter(r => stOf(r) === 'entered' && !isWatch(r));
  else if (journalFilter === 'pending') j = all.filter(r => stOf(r) === 'pending' && !isWatch(r));
  else if (journalFilter === 'closed') j = all.filter(r => stOf(r) === 'closed' && !isWatch(r));
  else if (journalFilter !== 'all') j = all.filter(r => (r.category || '추세추종') === journalFilter);
  // 정렬: 진입중 → 대기 → 관찰 → 종료 → 무산, 각 그룹 안에선 최신순
  const grp = r => isWatch(r) ? 2 : ({entered: 0, pending: 1, closed: 3, missed: 4}[stOf(r)] ?? 3);
  j = [...j].sort((a, b) => grp(a) - grp(b) || (b.date || '').localeCompare(a.date || ''));
  // 카테고리별 통계 (추세추종 / 단타 분리)
  const trend = journalStats(all.filter(r => (r.category || '추세추종') === '추세추종'));
  const scalp = journalStats(all.filter(r => (r.category || '추세추종') === '단타'));

  const fbtn = (key, label) => `<button class="fbtn ${journalFilter===key?'on':''}" onclick="journalFilter='${key}';renderJournal()">${label}</button>`;

  // ── R 리스크 대시보드 ──
  const _open = openRiskR();
  const _cap = effectiveCapR();
  const _p = periodR();
  const _consec = consecLosses();
  const _gate = entryGate();
  const _pct = _cap > 0 ? Math.min(100, _open / _cap * 100) : (_open > 0 ? 100 : 0);
  const _fillCls = _pct >= 100 ? 'max' : _pct >= 70 ? 'hot' : '';
  const _gateLabel = { confirmed: '🟢 확인된 상승', pressure: '🟡 조정 압박', correction: '🔴 조정' }[rSettings.gate] || rSettings.gate;
  // 투입금액 합계 (진입중 × 주식수 × 진입가, US는 환율 환산) — 구버전(주식수 없음) 항목은 제외
  let _invested = 0, _investedUnknown = 0;
  for (const r of all) {
    if ((r.status || 'entered') !== 'entered' || r.result_r !== '') continue;
    const e = parseFloat(r.entry);
    if (r.shares && e) {
      const fx = /\.(KS|KQ)$/i.test(r.ticker || '') ? 1 : (rSettings.usd_krw || 1400);
      _invested += r.shares * e * fx;
    } else if (e) { _investedUnknown++; }
  }
  const _cash = Math.max(0, (rSettings.equity || 0) - _invested);
  const _investPct = rSettings.equity ? Math.round(_invested / rSettings.equity * 100) : 0;
  const _fmtM = v => (v / 10000).toLocaleString(undefined, {maximumFractionDigits: 0}) + '만';
  const _rv = v => `<span style="color:${v > 0 ? 'var(--up)' : v < 0 ? 'var(--down)' : 'var(--muted)'}">${v > 0 ? '+' : ''}${v}R</span>`;
  const riskbar = rSettings.equity ? `
    <div class="riskbar">
      <div class="rb-item"><span class="rb-t">오픈 리스크</span>
        <span class="rb-v">${_open}R / ${_cap}R</span></div>
      <div class="rb-gauge"><div class="rb-fill ${_fillCls}" style="width:${_pct}%"></div></div>
      <div class="rb-item"><span class="rb-t">주간</span><span class="rb-v">${_rv(_p.week)} <span style="font-size:10px;color:var(--muted)">/ -${rSettings.weekly_stop_r}R</span></span></div>
      <div class="rb-item"><span class="rb-t">월간</span><span class="rb-v">${_rv(_p.month)} <span style="font-size:10px;color:var(--muted)">/ -${rSettings.monthly_stop_r}R</span></span></div>
      <div class="rb-item"><span class="rb-t">연속손실</span><span class="rb-v" style="${_consec >= 3 ? 'color:var(--amber)' : ''}">${_consec}패${_consec >= 3 ? ' (R½)' : ''}</span></div>
      <div class="rb-item"><span class="rb-t">투입 / 현금</span><span class="rb-v">${_fmtM(_invested)} / ${_fmtM(_cash)} <span style="font-size:10px;color:var(--muted)">(${_investPct}%${_investedUnknown ? ` · 수량미기록 ${_investedUnknown}건 제외` : ''})</span></span></div>
      <div class="rb-item"><span class="rb-t">시장 게이트</span><span class="rb-v">${_gateLabel}</span></div>
      <button class="exp" onclick="openRSettings()" style="margin-left:auto">⚙️ R 설정</button>
    </div>
    ${!_gate.allowed ? `<div class="rlock-banner">${_gate.reason}</div>`
      : _consec >= 3 ? `<div class="rlock-banner soft">⚠️ 연속 ${_consec}패 — 다음 진입은 R 절반(0.5×)으로 자동 축소. 2연승 후 복구.</div>` : ''}`
  : `<div class="riskbar"><span style="color:var(--muted)">⚙️ R 시스템 미설정 — 총자산을 입력하면 사이즈 자동계산·서킷브레이커가 켜져요</span>
      <button class="exp" onclick="openRSettings()" style="margin-left:auto">⚙️ R 설정</button></div>`;

  wrap.innerHTML = `
    ${riskbar}
    <div class="jrnl-tools">
      <button class="exp" onclick="refreshPrices()" style="background:#1e3a4a;border-color:#2d6a8c;color:#9fd4ff">🔄 현재가 갱신</button>
      <button class="exp" onclick="openManualAdd()" style="background:#2d6a4a;border-color:#40916c;color:#fff">➕ 수동 추가</button>
      <button class="exp" onclick="exportCSV()">⬇ CSV 내보내기</button>
      <button onclick="if(confirm('일지를 모두 지울까요? 되돌릴 수 없어요.')){setJournal([]);renderJournal();}">전체 삭제</button>
    </div>
    <div class="jrnl-stats">
      <div class="statcard">
        <div class="statcard-t">📈 추세추종</div>
        <div class="statcard-v">진입 ${trend.enteredCount} · 대기 ${trend.pendingCount} · 종료 ${trend.closedCount} · 승률 ${trend.winRate}${trend.winRate!=='–'?'%':''} · 평균 ${trend.avgR}R${(() => { const imp = getJournal().filter(x => x.exit_reason === '충동').length; return imp ? ` · <span style="color:#ff6b6b;font-weight:700">충동 ${imp}</span>` : ''; })()}</div>
      </div>
      <div class="statcard">
        <div class="statcard-t">👁 관찰</div>
        <div class="statcard-v">${all.filter(r => (r.category||'추세추종')==='관찰').length}종목 추적 중 · 매매 통계 제외</div>
      </div>
      <div class="statcard">
        <div class="statcard-t">⚡ 단타</div>
        <div class="statcard-v">총 ${scalp.total} · 종료 ${scalp.closedCount} · 승률 ${scalp.winRate}${scalp.winRate!=='–'?'%':''} · 평균 ${scalp.avgR}R</div>
      </div>
    </div>
    ${renderRCurve(all)}
    ${renderSignalValidation(all)}
    <div class="jrnl-filter">
      ${fbtn('all','전체')} ${fbtn('entered','▶ 진입중')} ${fbtn('pending','⏳ 대기')} ${fbtn('closed','✔ 종료')} ${fbtn('추세추종','📈 추세')} ${fbtn('단타','⚡ 단타')} ${fbtn('관찰','👁 관찰')}
    </div>
    <div style="overflow-x:auto">
    <table class="jtable">
      <thead><tr>
        <th>날짜</th><th>상태</th><th>종목</th><th>진입가</th><th>손절</th>
        <th>결과R</th><th>근거/복기</th><th></th>
      </tr></thead>
      <tbody>
        ${j.map(r => r.id === editingId ? editRow(r) : viewRow(r)).join('')}
      </tbody>
    </table></div>`;
}

function viewRow(r) {
  const cat = r.category || '추세추종';
  const catColor = cat === '단타' ? 'color:#c084fc' : 'color:var(--green)';
  const st = r.status || (r.result_r ? 'closed' : 'entered');
  const stBadge = st === 'pending'
      ? `<span class="st-badge" style="background:#3b3a2a;color:var(--amber)">⏳대기</span>`
    : st === 'entered'
      ? `<span class="st-badge" style="background:#1e3a2a;color:var(--green)">▶진입</span>`
    : st === 'missed'
      ? `<span class="st-badge" style="background:#3a2a2a;color:var(--muted)">✖무산</span>`
      : `<span class="st-badge" style="background:#2a2a3a;color:var(--muted)">✔종료</span>`;
  const watch = (r.category || '추세추종') === '관찰';
  const watchBadge = watch ? `<span class="st-badge" style="background:#1a2a3f;color:#7fb8ff">👁관찰</span>` : '';
  const borderCol = watch ? '#3b6ea5' : st === 'entered' ? '#40916c' : st === 'pending' ? '#a8842c' : st === 'missed' ? '#333' : '#3a3a4a';
  // 대기 중이면 진입/무산, 진입 중이면 종료 빠른 버튼
  const stActions = st === 'pending'
      ? `<div style="margin-top:3px;display:flex;gap:3px;flex-wrap:wrap">
           <span class="st-act" onclick="markEntered(${r.id})" title="실제 진입함">▶진입</span>
           <span class="st-act" onclick="markMissed(${r.id})" title="돌파 안 옴 · 무산">✖무산</span>
         </div>`
    : st === 'entered'
      ? `<div style="margin-top:3px;display:flex;gap:3px;flex-wrap:wrap">
           <span class="st-act" onclick="markClosed(${r.id})" title="매매 종료 · 청산가 입력" style="background:#2a2a3a;color:#9fb4ff">⏹종료</span>
         </div>`
      : '';
  const broken = isBrokenRow(r);   // 손절≥진입 = 데이터 오류
  // 종목 셀에 보조정보(탭·RS·섹터) 작게 접어넣기 — 컬럼은 줄이되 정보는 유지
  const subInfo = [r.tab, r.rs != null ? 'RS '+r.rs : '', r.sector].filter(Boolean).join(' · ');
  return `<tr class="${r.result_r===''&&st!=='missed'&&!broken?'open-pos':''}" style="border-left:3px solid ${borderCol};${st==='missed'||broken?'opacity:.5':st==='closed'?'opacity:.78':''}">
    <td class="mono">${r.date}</td>
    <td style="white-space:nowrap">${watch ? watchBadge : stBadge}${watch ? '' : stActions}${broken?`<div class="st-badge" style="background:#3a2020;color:#ff6b6b;margin-top:3px" title="손절가가 진입가보다 높음 — 과거 버그로 저장된 깨진 데이터. 통계에서 제외됨. 삭제 권장.">⚠️데이터오류</div>`:''}</td>
    <td><a href="${tvUrl(r.ticker, r.market)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" title="트레이딩뷰 차트 열기">${r.name} <span style="font-size:9px;opacity:.5">↗</span>${r.manual?`<span class="st-badge" style="background:#1e3a2e;color:#5fd99a;margin-left:4px;font-size:9px">수동</span>`:''}<div class="mono" style="font-size:10px;color:var(--muted)">${r.ticker}</div>${subInfo?`<div style="font-size:10px;color:var(--muted);opacity:.8">${subInfo}</div>`:''}</a></td>
    <td class="mono">${(() => {
      const isKr = /\.(KS|KQ)$/i.test(r.ticker || '');
      const entryStr = r.entry ?? '-';
      // 진입/대기 상태이고 현재가가 있으면 진입가 아래에 현재가 표시 (진입가 → 현재가 비교)
      if (r.last_price && r.entry && (st === 'entered' || st === 'pending')) {
        const px = parseFloat(r.last_price);
        const pxStr = isKr ? Math.round(px).toLocaleString() : px.toFixed(2);
        const up = px >= parseFloat(r.entry);
        const col = up ? 'var(--up)' : 'var(--down)';
        return `${entryStr}<div style="font-size:10px;color:${col};margin-top:1px">→ ${pxStr}</div>`;
      }
      return entryStr;
    })()}</td>
    <td class="mono"${broken?' style="color:#ff6b6b"':''}>${r.stop ?? '-'}</td>
    <td class="mono" style="${r.result_r&&parseFloat(r.result_r)>0?'color:var(--up)':r.result_r?'color:var(--down)':''}">${
      r.result_r
        ? `${r.result_r}R${r.exit_reason==='충동'?`<div style="font-size:9px;color:#ff6b6b;font-weight:700">⚠️ 충동</div>`:r.closed_reason?`<div style="font-size:9px;color:var(--muted)">${r.closed_reason}</div>`:''}`
        : st === 'pending'
            ? `<span style="color:var(--amber);font-size:11px">피벗 대기</span><div style="font-size:9px;color:var(--muted)">${r.last_price?'현재 '+(/\.(KS|KQ)$/i.test(r.ticker||'')?Math.round(parseFloat(r.last_price)).toLocaleString():parseFloat(r.last_price).toFixed(2)):'미진입'}</div>`
        : st === 'missed'
            ? `<span style="color:var(--muted);font-size:11px">무산</span>${r.closed_reason?`<div style="font-size:9px;color:var(--muted)">${r.closed_reason}</div>`:''}`
        : (r.tracking && r.last_price && r.entry && r.stop
            ? (() => {
                const liveR = (parseFloat(r.last_price) - parseFloat(r.entry)) / (parseFloat(r.entry) - parseFloat(r.stop));
                const dheld = Math.floor((Date.now() - new Date(r.date)) / 86400000);
                const col = liveR >= 0 ? 'var(--up)' : 'var(--down)';
                return `<span style="color:${col};font-weight:600">${liveR>=0?'+':''}${liveR.toFixed(1)}R</span>`
                     + `<div style="font-size:9px;color:var(--muted)">D+${dheld}</div>`;
              })()
            : `<span style="color:var(--muted);font-size:11px">추적대기</span><div style="font-size:9px;color:var(--muted)">${r.entry?'앱 새로고침 시 갱신':''}</div>`)
    }</td>
    <td style="white-space:normal;max-width:240px;font-size:11px;color:var(--muted)"><div class="note-clamp" title="${(r.note||'').replace(/"/g,'&quot;')}${r.review?' / 복기: '+r.review.replace(/"/g,'&quot;'):''}">${r.note || ''}${r.review?`<br><i style="color:var(--amber)">복기: ${r.review}</i>`:''}</div></td>
    <td style="white-space:nowrap">
      <span class="edit-btn" onclick="editingId=${r.id};renderJournal()" title="수정/상세">✏️</span>
      <span class="del" onclick="delJournal(${r.id})" title="삭제">✕</span>
    </td>
  </tr>`;
}

// 진입 → 종료: 청산가 입력받아 결과R 확정. 수정폼을 펼쳐서 청산가 칸에 포커스.
function markClosed(id) {
  editingId = id;
  renderJournal();
  setTimeout(() => {
    const ex = document.getElementById('e_exit');
    if (ex) { ex.focus(); ex.scrollIntoView({block:'center', behavior:'smooth'}); }
  }, 50);
}

// 대기 → 진입: 실제 매수했음. 진입일을 오늘로, 추적 시작.
async function markEntered(id) {
  const j = getJournal();
  const r = j.find(x => x.id === id); if (!r) return;
  // ── R 시스템: 대기→진입이 실질 진입 시점 → 게이트 검사 + 사이즈 확정 ──
  if (rSettings.equity) {
    const gate = entryGate();
    if (!gate.allowed) { alert(gate.reason + '\n\n대기 상태를 유지합니다.'); return; }
    const mkt = /\.(KS|KQ)$/i.test(r.ticker || '') ? 'KR' : 'US';
    const sized = calcShares(parseFloat(r.entry), parseFloat(r.stop), mkt);
    if (sized) {
      r.shares = sized.shares;
      r.r_value_krw = sized.rKrw;
      const cut = sized.reduced ? '\n⚠️ 연속 3패 → R 절반 축소 적용됨' : '';
      if (!confirm(`진입 확정: ${sized.shares.toLocaleString()}주 (1R=${sized.rKrw.toLocaleString()}원, 진입금액 약 ${Math.round(sized.posKrw / 10000).toLocaleString()}만원)${cut}\n\n이 수량으로 주문했나요?`)) return;
    }
  }
  r.status = 'entered';
  r.tracking = true;
  r.date = new Date().toISOString().slice(0, 10);
  r.closed_reason = '';
  setJournal(j); await _saveJournalToServer(j); renderJournal();
}

// 대기 → 무산: 돌파 안 오고 셋업 깨짐. 손익 0, 통계 제외.
async function markMissed(id) {
  const j = getJournal();
  const r = j.find(x => x.id === id); if (!r) return;
  r.status = 'missed';
  r.tracking = false;
  setJournal(j); await _saveJournalToServer(j); renderJournal();
}

function editRow(r) {
  const cat = r.category || '추세추종';
  // 7컬럼 구조: 날짜 / 상태 / 종목 / 진입가 / 손절 / 결과R(청산가) / [상세입력 colspan]
  return `<tr class="editing">
    <td class="mono">${r.date}</td>
    <td style="font-size:11px;color:var(--muted)">${r.status||'entered'}</td>
    <td>${r.name}<div class="mono" style="font-size:10px;color:var(--muted)">${r.ticker}</div>
      <div style="font-size:10px;color:var(--muted);opacity:.8;margin-top:2px">${[r.tab, r.rs!=null?'RS '+r.rs:'', r.sector].filter(Boolean).join(' · ')}</div></td>
    <td><input id="e_entry" class="ein" value="${r.entry ?? ''}" inputmode="decimal" style="width:70px"></td>
    <td><input id="e_stop" class="ein" value="${r.stop ?? ''}" inputmode="decimal" style="width:70px"></td>
    <td><input id="e_exit" class="ein" value="${r.exit || ''}" placeholder="청산가" style="width:70px" inputmode="decimal" title="청산가를 넣으면 결과R 자동 계산">
        <input id="e_result" class="ein" value="${r.result_r || ''}" placeholder="또는 R" style="width:70px;margin-top:4px">
        <select id="e_reason" class="ein" style="width:120px;margin-top:4px" title="종료 사유 — 종료 시 필수. 규칙 안에서 나갔는지 스스로에게 답하는 게이트">
          <option value="">종료 사유…</option>
          <option value="손절도달" ${r.exit_reason==='손절도달'?'selected':''}>🔴 손절가 도달</option>
          <option value="트레일링" ${r.exit_reason==='트레일링'?'selected':''}>📉 트레일링/규칙 익절</option>
          <option value="목표도달" ${r.exit_reason==='목표도달'?'selected':''}>🎯 목표 도달</option>
          <option value="충동" ${r.exit_reason==='충동'?'selected':''}>⚠️ 규칙 외(충동)</option>
        </select></td>
    <td colspan="2">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start">
        <select id="e_cat" class="ein" style="width:110px">
          <option value="추세추종" ${cat==='추세추종'?'selected':''}>📈 추세추종</option>
          <option value="단타" ${cat==='단타'?'selected':''}>⚡ 단타</option>
          <option value="관찰" ${cat==='관찰'?'selected':''}>👁 관찰</option>
        </select>
        <input id="e_held" class="ein" value="${r.held_days || ''}" placeholder="보유일" style="width:60px">
        <div style="display:flex;gap:6px;margin-left:auto">
          <span class="save-btn" onclick="saveEdit(${r.id})" title="저장">💾 저장</span>
          <span class="del" onclick="editingId=null;renderJournal()" title="취소">↩ 취소</span>
        </div>
      </div>
      <textarea id="e_note" class="ein" style="width:100%;height:70px;margin-top:6px" placeholder="진입 근거">${r.note || ''}</textarea>
      <textarea id="e_review" class="ein" style="width:100%;height:70px;margin-top:6px" placeholder="복기 (왜 잘됐나/못됐나)">${r.review || ''}</textarea>
    </td>
  </tr>`;
}

function saveEdit(id) {
  const j = getJournal();
  const r = j.find(x => x.id === id);
  if (!r) return;
  // 종료된 과거 매매 기록 수정 방어 — 이력 오염 방지
  if (r.status === 'closed' && r.result_r) {
    if (!confirm(`⚠️ 종료된 과거 매매 기록(${r.date} · ${r.name})을 수정하려고 해요.\n과거 이력이 바뀌면 통계·복기가 왜곡될 수 있어요.\n\n정말 수정할까요?`)) {
      editingId = null; renderJournal(); return;
    }
  }
  r.category = document.getElementById('e_cat').value;
  const entry = parseFloat(document.getElementById('e_entry').value) || null;
  const stop = parseFloat(document.getElementById('e_stop').value) || null;
  r.entry = entry; r.stop = stop;
  // 진입가·손절 바뀌면 리스크% 재계산
  if (entry && stop && entry > stop) r.risk_pct = Math.round((entry - stop) / entry * 1000) / 10;
  // 청산가 입력 시 결과R 자동 환산 (R 직접 입력값보다 우선)
  const exitV = parseFloat(document.getElementById('e_exit').value);
  const manualR = document.getElementById('e_result').value.trim();
  const reasonSel = document.getElementById('e_reason');
  const exitReason = reasonSel ? reasonSel.value : '';
  const isClosing = (!isNaN(exitV) && entry && stop && entry > stop) || !!manualR;
  // ── 종료 사유 게이트: 청산하려면 사유를 반드시 골라야 함 ──
  // (승인 게이트의 1인용 버전 — 손이 먼저 나가기 전에 "이게 규칙인가 충동인가" 자문)
  if (isClosing && (r.status === 'entered' || r.status === 'closed' || !r.status) && !exitReason) {
    alert('종료 사유를 선택해주세요.\n\n🔴 손절가 도달 / 📉 트레일링·규칙 익절 / 🎯 목표 도달 / ⚠️ 규칙 외(충동)\n\n"충동"이어도 괜찮아요 — 기록이 쌓이면 데이터가 됩니다.');
    return;
  }
  if (!isNaN(exitV) && entry && stop && entry > stop) {
    r.exit = exitV;
    r.result_r = (Math.round((exitV - entry) / (entry - stop) * 100) / 100).toString();
    r.tracking = false;                  // 수동 청산 → 추적 종료
    r.status = 'closed';
    r.exit_reason = exitReason;
    r.closed_reason = exitReason || r.closed_reason || '수동';
    if (!r.closed_date) r.closed_date = new Date().toISOString().slice(0, 10);
  } else if (manualR) {
    r.result_r = manualR;
    r.tracking = false;
    r.status = 'closed';
    r.exit_reason = exitReason;
    r.closed_reason = exitReason || r.closed_reason || '수동';
    if (!r.closed_date) r.closed_date = new Date().toISOString().slice(0, 10);
  } else if (exitReason) {
    r.exit_reason = exitReason;          // 사유만 나중에 고쳐 저장하는 경우
  }
  r.held_days = document.getElementById('e_held').value.trim();
  r.note = document.getElementById('e_note').value.trim();
  r.review = document.getElementById('e_review').value.trim();
  setJournal(j);
  editingId = null;
  renderJournal();
}

function updateResult(id, val) {
  const j = getJournal();
  const r = j.find(x => x.id === id);
  if (r) { r.result_r = val.trim(); setJournal(j); renderJournal(); }
}
function delJournal(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  setJournal(getJournal().filter(x => x.id !== id));
  if (editingId === id) editingId = null;
  renderJournal();
}
function exportCSV() {
  const j = getJournal();
  if (!j.length) return;
  const cols = ['date','status','ticker','name','market','sector','tab','mode_raw','category','signal','pivot_type','shares','r_value_krw','closed_date',
    'setup_score','rs','entry','stop','risk_pct','sig_level','sig_flags','avwap_zone','rr_at_entry','alert','note','exit','result_r','held_days','review'];
  const head = ['날짜','상태','티커','종목','시장','섹터','탭','모드','구분','신호','피벗종류','주식수','1R금액','종료일','전일점수','RS',
    '진입가','손절','리스크%','진입신호등','경고항목','AVWAP존','진입시손익비','경보','진입근거','청산가','결과R','보유일','복기'];
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [head.join(','), ...j.map(r => cols.map(c => esc(r[c])).join(','))].join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `눌림목일지_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
document.getElementById('refresh').addEventListener('click', () => load(true));

async function loadIndices() {
  const bar = document.getElementById('idxbar');
  try {
    const res = await fetch('/api/indices');
    const data = await res.json();
    const list = (data.indices || []);
    if (!list.length) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    const regimeDot = (rg) => {
      if (!rg) return '';
      const map = {good:['🟢','#28b478'], neutral:['🟡','#e6aa28'], bad:['🔴','#FF5A6E']};
      const [emoji] = map[rg] || ['',''];
      return emoji;
    };
    // 국내(코스피/코스닥) 레짐으로 전체 시장 판정 배너
    const kr = list.filter(ix => ix.name === '코스피' || ix.name === '코스닥');
    const regimes = kr.map(ix => ix.regime).filter(Boolean);
    let banner = '';
    if (regimes.length) {
      const bad = regimes.filter(r => r === 'bad').length;
      const good = regimes.filter(r => r === 'good').length;
      // 분산일 최댓값 (국내 지수 중) + FTD 여부
      const maxDist = Math.max(...kr.map(ix => ix.dist_days || 0), 0);
      const anyFtd = kr.some(ix => ix.ftd);
      const distTxt = maxDist >= 3 ? ` · 분산일 ${maxDist}개` : '';
      const ftdTxt = anyFtd ? ' · FTD 발생(바닥 신호)' : '';
      let lv, txt;
      if (bad >= 1) { lv = 'bad'; txt = '🔴 시장 비우호 — 신규 진입 자제'; }
      else if (good === regimes.length) { lv = 'good'; txt = '🟢 시장 우호 — 진입 환경 양호'; }
      else { lv = 'neutral'; txt = '🟡 시장 중립 — 선별 진입'; }
      banner = `<div class="mkt-banner mkt-${lv}" title="오닐 M factor: 분산일(기관 매도일) 카운트 + 20·60일선. 분산일 5개+ 또는 60일선 아래면 비우호. 빠지는 장에선 돌파 성공률이 급락해요.">${txt}${distTxt}${ftdTxt}</div>`;
    }
    bar.innerHTML = banner + list.map(ix => {
      const pct = ix.change_pct;
      const chg = ix.change;
      // 한국식 색: 상승=빨강(up), 하락=파랑(down)
      const dir = pct == null ? 'flat' : (pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat'));
      const arrow = dir === 'up' ? '▲' : (dir === 'down' ? '▼' : '·');
      const val = ix.value != null ? Number(ix.value).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : '–';
      const chgStr = (chg != null && pct != null)
        ? `${arrow} ${Math.abs(chg).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} (${pct > 0 ? '+' : ''}${pct.toFixed(2)}%)`
        : '–';
      const dot = regimeDot(ix.regime);
      return `<div class="idx" title="${ix.regime_txt || '시장 분위기(분산일 기반)'}"><span class="nm">${ix.name}${dot ? ` <span style="font-size:9px" title="시장 분위기">${dot}</span>` : ''}</span>`
        + `<span class="vl">${val}</span>`
        + `<span class="ch ${dir}">${chgStr}</span></div>`;
    }).join('');
  } catch (e) {
    bar.style.display = 'none';
  }
}
loadIndices();
