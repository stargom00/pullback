<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>추적 장부</title>
<script>
// 스캐너와 같은 테마(localStorage 'scannerTheme', 기본 라이트) — CSS보다 먼저.
try{document.documentElement.dataset.theme=localStorage.getItem('scannerTheme')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* v5.390 다시 디자인(사용자 2026-11-19 "인터페이스 디자인이 너무 구려 … 한눈에 보기쉽게, 간단명료하면서 사용하기 편리하게").
   스캐너 토큰(--n-*)을 그대로 쓴다. 선 하나 = 한 줄이던 목록을 **종목 카드 + 가격 사다리**로: 내 선들 사이에 지금 가격이 어디 있는지가 한눈에. */
/* v5.392 색을 매매 훈련 홈(일지 화면)과 맞춤 — 사용자 2026-11-19 "색상을 이거랑 맞춰줘". 값 출처: chart-trainer :root 토큰. */
:root{--n-bg:#f1f3ef;--n-panel:#ffffff;--n-card:#ffffff;--n-soft:#fafbf8;--n-line:#e5e9e3;--n-line2:#d6dbd5;--n-text:#1b2320;--n-sub:#3f4a45;--n-muted:#5f6b65;--n-accent:#1d6b58;--n-accent-fg:#1d6b58;--n-chip:#dcece6;--n-row:#eef1ec;--n-bad:#b8352a;--near-bg:#f7ecd8;--near-line:#e2c690;--near-fg:#a86a12;--now-bg:#1d6b58;--now-fg:#ffffff;--c-up:#d13b3b;--c-dn:#2d5ccc}
:root[data-theme="dark"]{--n-bg:#111513;--n-panel:#181e1b;--n-card:#181e1b;--n-soft:#141917;--n-line:#222a26;--n-line2:#2b3430;--n-text:#e4eae6;--n-sub:#bcc6c1;--n-muted:#97a39d;--n-accent:#5ec2a4;--n-accent-fg:#5ec2a4;--n-chip:#1d3a31;--n-row:#1b221f;--n-bad:#ff7a6b;--near-bg:#33281a;--near-line:#6b5226;--near-fg:#e0a548;--now-bg:#5ec2a4;--now-fg:#0d1a15;--c-up:#ff6464;--c-dn:#5f8fff}
*{box-sizing:border-box}
body{margin:0;background:var(--n-bg);color:var(--n-text);font-family:'IBM Plex Sans KR',-apple-system,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:'Gowun Batang','Nanum Myeongjo',serif;font-size:28px;font-weight:700;margin:0;color:var(--n-accent)}.top .sp{flex:1}
.sub{color:var(--n-muted);font-size:13px}
a.back{color:var(--n-muted);text-decoration:none;font-size:13px}a.back:hover{color:var(--n-text)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--n-line2);background:var(--n-panel);color:var(--n-text);border-radius:8px;padding:7px 13px;cursor:pointer}
.btn:hover{border-color:var(--n-muted)}
.btn.pri{background:var(--n-accent);border-color:var(--n-accent);color:var(--now-fg)}
.btn.sm{font-size:12px;padding:4px 9px;font-weight:500}.btn.ghost{border-color:transparent;background:transparent;color:var(--n-muted)}.btn.ghost:hover{background:var(--n-row);color:var(--n-text)}
.btn.warn{color:var(--n-bad)}
/* 오늘 볼 것 */
.nearbox{background:var(--near-bg);border:1px solid var(--near-line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.nearbox b.h{font-size:13px;margin-right:4px}
.nchip{font:inherit;display:inline-flex;gap:8px;align-items:baseline;background:var(--n-panel);border:1px solid var(--near-line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--n-text)}
.nchip:hover{border-color:var(--near-fg)}.nchip .l{font-size:12px;color:var(--n-muted)}.nchip .p{font-weight:600;color:var(--near-fg)}
.calm{color:var(--n-muted);font-size:13px;border:1px dashed var(--n-line2);border-radius:14px;padding:10px 16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:inherit;font-size:13px;border:1px solid var(--n-line2);background:var(--n-panel);color:var(--n-sub);border-radius:999px;padding:5px 12px;cursor:pointer}
.tab.on{background:var(--n-text);border-color:var(--n-text);color:var(--n-panel);font-weight:600}.tab span{opacity:.6;font-size:12px;margin-left:2px}
/* 종목 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
.card{background:var(--n-card);border:1px solid var(--n-line2);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.card.hasnear{border-color:var(--near-line);box-shadow:0 0 0 2px var(--near-bg)}
.chd{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.chd .nm{font-size:17px;font-weight:700;color:var(--n-text);text-decoration:none}.chd .nm:hover{color:var(--n-accent-fg)}
.chd .tk{font-size:11px;color:var(--n-muted)}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--n-chip);color:var(--n-sub)}
.chd .sp{flex:1}
.lad{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:baseline;padding:7px 14px;border-top:1px solid var(--n-line);cursor:pointer;background:var(--n-panel)}
.ln:hover{background:var(--n-row)}
.ln .lb{font-size:12px;color:var(--n-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .px{font-weight:600}
.ln .to{font-size:12px;color:var(--n-muted);min-width:64px;text-align:right}
.ln.near{background:var(--near-bg)}.ln.near .to{color:var(--near-fg);font-weight:600}.ln.near .lb{color:var(--near-fg);font-weight:600}
.ln.end{opacity:.5}
.now{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:6px 14px;background:var(--now-bg);color:var(--now-fg)}
.now .lb{font-size:11px;font-weight:700;letter-spacing:.02em}.now .px{font-weight:600;font-size:15px}.now .to{font-size:11px;opacity:.75;text-align:right}
.det{grid-column:1/-1;border-top:1px dashed var(--n-line2);margin-top:6px;padding-top:8px;display:flex;flex-direction:column;gap:6px;cursor:default}
.det .note{font-size:13px;color:var(--n-sub)}.det .pts{font-size:11px;color:var(--n-muted)}
.det .acts{display:flex;gap:4px;flex-wrap:wrap}
.card.wide{grid-column:1/-1}
.chart{border-top:1px solid var(--n-line);background:var(--n-soft);padding:10px 12px 6px}
.chart svg{display:block;width:100%;height:auto}.chart .cscroll{overflow-x:auto}@media(max-width:700px){.chart svg{width:780px;max-width:none}}
.chart .cap{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--n-muted);padding:0 2px 6px}
.chart .cap i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.chart .wait,.chart .cerr{font-size:13px;color:var(--n-muted);padding:26px 0;text-align:center}.chart .cerr{color:var(--n-bad)}
.cg{stroke:var(--n-line);stroke-width:1}.ct{font:10px 'IBM Plex Mono',monospace;fill:var(--n-muted)}
.cu{fill:var(--c-up);stroke:var(--c-up)}.cd{fill:var(--c-dn);stroke:var(--c-dn)}
.cl{fill:none;stroke-width:1.8}.cl.fut{stroke-dasharray:5 4;opacity:.8}
.clb{font:600 11px 'IBM Plex Sans KR',sans-serif;paint-order:stroke;stroke:var(--n-soft);stroke-width:3px}
.cnow{stroke:var(--n-text);stroke-width:1;stroke-dasharray:2 3;opacity:.55}
.cfut{fill:var(--n-row);opacity:.6}
.nopx{padding:6px 14px;font-size:12px;color:var(--n-bad);border-top:1px solid var(--n-line);background:var(--n-panel)}
/* 양식 */
.fcard{background:var(--n-card);border:1px solid var(--n-accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fcard h2{margin:0;font-size:15px}
.frow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fcard label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--n-muted);font-weight:600}
input,select{font:inherit;font-size:14px;color:var(--n-text);background:var(--n-panel);border:1px solid var(--n-line2);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--n-accent);outline-offset:-1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;border:1px solid var(--n-line2);background:var(--n-panel);color:var(--n-sub);border-radius:8px;padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--n-text);color:var(--n-panel);border-color:var(--n-text);font-weight:600}
.help{font-size:12px;color:var(--n-muted)}
.msg{color:var(--n-bad);font-size:13px}
.empty{color:var(--n-muted);text-align:center;padding:40px 0}
/* v5.393 테마 바구니 */
.th-hd{display:flex;align-items:center;gap:10px;margin-top:6px}.th-hd h2{font-family:'Gowun Batang','Nanum Myeongjo',serif;font-size:20px;margin:0;color:var(--n-accent)}.th-hd .sp{flex:1}
.bk{background:var(--n-card);border:1px solid var(--n-line2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.bk.fire{border-color:var(--c-up);box-shadow:0 0 0 2px color-mix(in srgb,var(--c-up) 18%,transparent)}
.bk-hd{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}.bk-hd .nm{font-size:17px;font-weight:700}.bk-hd .sp{flex:1}
.bk-st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--n-chip);color:var(--n-accent-fg)}.bk-st.fire{background:var(--c-up);color:#fff}
.bk-nums{font-size:13px;color:var(--n-sub)}.bk-nums b{color:var(--n-text)}
.bk-ms{display:flex;flex-wrap:wrap;gap:6px}
.mc{display:inline-flex;gap:6px;align-items:baseline;font-size:13px;text-decoration:none;color:var(--n-text);border:1px solid var(--n-line2);border-radius:999px;padding:3px 10px;background:var(--n-panel)}
.mc:hover{border-color:var(--n-muted)}.mc .p{font-size:12px;font-weight:600}.mc.u .p{color:var(--c-up)}.mc.d .p{color:var(--c-dn)}.mc.s{border-color:var(--c-up);background:color-mix(in srgb,var(--c-up) 9%,var(--n-panel))}
.mc.x{opacity:.55}.mc .ld{width:6px;height:6px;border-radius:50%;background:var(--n-accent);align-self:center}
textarea{font:inherit;font-size:14px;color:var(--n-text);background:var(--n-panel);border:1px solid var(--n-line2);border-radius:8px;padding:8px 9px;width:100%;min-height:150px;resize:vertical}
@media (max-width:760px){.frow{grid-template-columns:1fr 1fr}.wrap{padding:16px 14px 60px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><h1>추적 장부</h1><span class="sub" id="sum"></span><span class="sp"></span><a class="back" href="/">← 스캐너</a><button class="btn pri" onclick="openForm()">+ 선 등록</button></div>
<div id="formBox"></div>
<div id="nearBox"></div>
<div id="themeBox"></div>
<div class="tabs" id="tabs"></div>
<div id="list"><div class="empty">불러오는 중…</div></div>
<div class="sub">선을 등록하면 얼마냐봇이 접근(±<span id="np">3</span>%)·종가 돌파·이탈을 알려 줘요 · 봇에 <code>빗각</code> = 전체 현황 · 거리 = 지금 종가에서 선까지 · 테마가 점화하면 봇이 알려 줘(봇에 <code>테마</code>) · 표시·알림 전용(측정 전)</div>
</div>
<script>
// v5.390 추적 장부 — 값·거리 계산은 전부 서버(track_lines.py view)가 한다. 여기는 묶어서 보여 주기와 양식만.
const S={lines:[],labels:['빗각','채널 상단','채널 하단','수평선','기타'],near:3,form:null,theme:'',msg:'',err:'',open:null,showEnd:false,delAsk:null,chart:null,charts:{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const isKR=t=>/^[0-9][0-9A-Z]{5}(\.K[SQ])?$/.test(t);
const fmt=(v,t)=>v==null?'—':isKR(t)?Math.round(v).toLocaleString('en-US'):Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cur=t=>isKR(t)?'₩':'$';
const tv=t=>'https://www.tradingview.com/chart/?symbol='+encodeURIComponent(isKR(t)?'KRX:'+t.slice(0,6):t);
const toTxt=p=>p==null?'':(p>=0?'↑ ':'↓ ')+Math.abs(p).toFixed(1)+'%';
async function load(){try{const r=await fetch('/api/track-lines');const j=await r.json();if(!j.ok)throw new Error(j.error||r.status);
  S.lines=j.lines;S.labels=j.labels||S.labels;S.near=j.near_pct||3;S.err=''}catch(e){S.err='장부를 불러오지 못했어: '+e.message}render()}
// 종목별로 묶기 — 순수 함수(테스트: test_track_lines.py가 node로 그대로 실행)
function groupStocks(lines,theme,showEnd){const by={};
  for(const l of lines){if(theme&&l.theme!==theme)continue;if(l.status==='종료'&&!showEnd)continue;(by[l.ticker]=by[l.ticker]||[]).push(l)}
  return Object.entries(by).map(([tk,L])=>{L.sort((a,b)=>(b.view?.value??0)-(a.view?.value??0));
    const act=L.filter(l=>l.status!=='종료');const v=(act[0]||L[0]).view||{};
    const near=act.filter(l=>(l.view||{}).zone==='near');const ds=act.map(l=>Math.abs((l.view||{}).to_line_pct??1e9));
    return {ticker:tk,name:L.find(l=>l.name)?.name||tk,theme:L.find(l=>l.theme)?.theme||'',close:v.close??null,date:v.value_date||'',lines:L,near,minDist:ds.length?Math.min(...ds):1e9}})
  .sort((a,b)=>a.minDist-b.minDist)}   // 선까지 가까운 순(근처 ±3% 종목은 정의상 맨 앞에 온다)
// ── v5.393 테마 바구니 — 등락률·요약·점화 판정은 전부 서버(theme_baskets.py). 여기는 보여 주기와 양식만.
const B={baskets:[],lined:[],rule:null,form:null,msg:'',err:'',loading:true,delAsk:null};
async function loadBaskets(){try{const r=await fetch('/api/theme-baskets');const j=await r.json();if(!j.ok)throw new Error(j.error||r.status);
  B.baskets=j.baskets;B.lined=j.lined||[];B.rule=j.rule;B.err=''}catch(e){B.err='테마를 불러오지 못했어: '+e.message}B.loading=false;renderThemes()}
const pctTxt=p=>p==null?'—':(p>0?'+':'')+p.toFixed(1)+'%';
const hasLine=t=>B.lined.some(x=>x===t||(isKR(t)&&isKR(x)&&x.slice(0,6)===t.slice(0,6)));
// 바구니 한 줄 요약 — 순수 함수(테스트: test_theme_baskets.py가 node로 그대로 실행)
function basketLine(sm){if(!sm)return '';if(!sm.n_px)return '가격을 못 받았어';
  return `강한 종목 <b>${sm.strong}/${sm.n_px}</b> · 오른 종목 ${sm.up} · 평균 <b>${pctTxt(sm.avg_pct)}</b>`+(sm.leader?` · 대장 ${esc(sm.leader.name)} <b>${pctTxt(sm.leader.chg_pct)}</b>`:'')
    +(sm.n_failed?` · 가격 실패 ${sm.n_failed}`:'')+(sm.n_stale?` · 옛 봉 ${sm.n_stale}`:'')}
function basketHTML(b){const sm=b.summary,end=b.status==='종료',fire=!end&&sm&&sm.ignited,up=B.rule?B.rule.up_pct:5;
  return `<div class="bk${fire?' fire':''}"><div class="bk-hd"><span class="nm">${esc(b.name)}</span>${end?'<span class="bk-st">종료</span>':sm&&sm.n_px?`<span class="bk-st${fire?' fire':''}">${fire?'점화':'조용'}</span>`:''}
    <span class="bk-nums">${end?'':basketLine(sm)}</span>${!end&&!fire&&b.last_ignited?`<span class="bk-st fire" style="opacity:.85">최근 점화 ${esc(b.last_ignited.date.slice(5))} · ${b.last_ignited.strong}/${b.last_ignited.n_px}</span>`:''}<span class="sp"></span>${sm&&sm.date?`<span class="help mono">${esc(sm.date.slice(5))}${sm.is_today?'':' (지난 봉)'}</span>`:''}
    <button class="btn sm ghost" onclick="openBasket('${esc(b.id)}')">고치기</button></div>
   ${b.note?`<div class="help">${esc(b.note)}</div>`:''}
   ${end?'':`<div class="bk-ms">${(b.rows||[]).map(r=>`<a class="mc${r.chg_pct==null?' x':r.chg_pct>=up?' u s':r.chg_pct>0?' u':r.chg_pct<0?' d':''}" href="${tv(r.ticker)}" target="_blank" rel="noopener" title="${esc(r.ticker)}${hasLine(r.ticker)?' · 장부에 선 있음':''}">${hasLine(r.ticker)?'<i class="ld"></i>':''}${esc(r.name)}<span class="p mono">${pctTxt(r.chg_pct)}</span></a>`).join('')}</div>`}</div>`}
function basketFormHTML(){const f=B.form;if(!f)return '';
  return `<div class="fcard"><h2>${f._new?'테마 만들기':'테마 고치기'}</h2>
   <div class="frow"><label>테마 이름<input id="b-nm" value="${esc(f.name)}" placeholder="한한령"></label><label style="grid-column:span 3">메모 (선택)<input id="b-nt" value="${esc(f.note||'')}" placeholder="왜 묶었는지"></label></div>
   <label>종목 — 한 줄에 하나, "이름 티커"<textarea id="b-ms" placeholder="하이브 352820.KS&#10;에스엠 041510.KQ">${esc(f.text)}</textarea></label>
   <span class="help">2~40종목 · 티커는 줄의 마지막 토막(코스피 .KS · 코스닥 .KQ, 미국은 그대로)</span>
   ${B.msg?`<div class="msg">${esc(B.msg)}</div>`:''}
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" onclick="saveBasket()">저장</button>
    ${f._new?'':`<button class="btn" onclick="saveBasket('${f.status==='종료'?'추적':'종료'}')">${f.status==='종료'?'다시 추적':'추적 종료'}</button><button class="btn warn" onclick="delBasket()">${B.delAsk?'한 번 더 누르면 지워져':'지우기'}</button>`}
    <button class="btn ghost" onclick="B.form=null;B.msg='';B.delAsk=null;renderThemes()">취소</button></div></div>`}
function openBasket(id){B.msg='';B.delAsk=null;const b=B.baskets.find(x=>x.id===id);
  B.form=b?{id:b.id,name:b.name,note:b.note||'',status:b.status||'추적',rev:b.rev,created_at:b.created_at,text:b.members.map(m=>m.name+' '+m.ticker).join('\n')}:{id:'tb_'+Date.now().toString(36),name:'',note:'',status:'추적',text:'',_new:true};renderThemes()}
// 양식 글 → members(서버 theme_baskets.parse_members와 같은 규칙: 줄의 마지막 토막이 티커)
function parseMembers(text){return String(text||'').replace(/,/g,'\n').split('\n').map(l=>l.trim().split(/\s+/).filter(Boolean)).filter(p=>p.length).map(p=>{const tk=p[p.length-1].toUpperCase();return {ticker:tk,name:p.slice(0,-1).join(' ')||tk}})}
async function saveBasket(st){const f=B.form,g=id=>document.getElementById(id).value;f.name=g('b-nm').trim();f.note=g('b-nt').trim();f.text=g('b-ms');
  const rec={id:f.id,name:f.name,note:f.note,status:st||f.status,members:parseMembers(f.text)};if(f.created_at)rec.created_at=f.created_at;
  try{const r=await fetch('/api/theme-baskets/'+encodeURIComponent(rec.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({record:rec,base_rev:f._new?null:f.rev})});
    const j=await r.json();if(!j.ok){B.msg=j.error||('저장 실패 '+r.status);if(j.code==='conflict'||j.code==='gone'){B.form=null;await loadBaskets();B.err=B.msg}renderThemes();return}
    B.form=null;B.msg='';B.loading=true;renderThemes();await loadBaskets()}catch(e){B.msg='저장 실패: '+e.message;renderThemes()}}
async function delBasket(){if(!B.delAsk){B.delAsk=true;renderThemes();return}const id=B.form.id;B.delAsk=null;B.form=null;
  try{const r=await fetch('/api/theme-baskets/'+encodeURIComponent(id),{method:'DELETE'});const j=await r.json();if(!j.ok)B.err=j.error||'삭제 실패'}catch(e){B.err='삭제 실패: '+e.message}await loadBaskets()}

   ${basketFormHTML()}${B.err?`<div class="msg">${esc(B.err)}</div>`:''}${B.loading?'<div class="calm">테마 종목 가격 받는 중…</div>':B.baskets.length?B.baskets.map(basketHTML).join(''):(B.err?'':'<div class="calm">아직 테마가 없어. "+ 테마"로 묶어 봐.</div>')}

const LINE_COLORS=['#d98b3a','#2e9e6b','#8a5cd6','#c2477f','#3a8fd9','#8a8f98'];
function refetchChart(){const tk=S.chart;S.chart=null;if(S.lines.some(l=>l.ticker===tk&&l.status!=='종료'))toggleChart(tk);else render()}
async function toggleChart(tk){if(S.chart===tk){S.chart=null;render();return}S.chart=tk;render();
  if(S.charts[tk]&&!S.charts[tk].error){document.getElementById('c-'+tk)?.scrollIntoView({behavior:'smooth',block:'nearest'});return}
  try{const r=await fetch('/api/track-lines/chart/'+encodeURIComponent(tk));const j=await r.json();S.charts[tk]=j.ok?j:{error:j.error||('차트 실패 '+r.status)}}catch(e){S.charts[tk]={error:'차트를 불러오지 못했어: '+e.message}}
  render();document.getElementById('c-'+tk)?.scrollIntoView({behavior:'smooth',block:'nearest'})}
// 캔들 + 선 SVG — 순수 함수(값은 서버가 준 것만 쓴다). 테스트: test_track_lines.py가 node로 그대로 실행.
function chartSVG(p,dec){const W=1100,H=380,L=8,R=74,T=10,B=22,n=p.bars.length,m=n+p.future.length;
  const vals=[];for(const b of p.bars){vals.push(b[2],b[3])}
  // 선은 봉 범위의 위아래 60%까지만 축에 넣는다(멀리 있는 선 하나가 캔들을 납작하게 만들지 않게) — 밖의 선은 잘려 보인다
  const lo0=Math.min(...vals),hi0=Math.max(...vals);const f=p.log?(v=>Math.log(v)):(v=>v);
  let a=f(lo0),z=f(hi0);const span=z-a||1;const capLo=a-span*.6,capHi=z+span*.6;
  for(const l of p.lines)for(const v of l.values){if(v==null||!(v>0))continue;const y=f(v);if(y>=capLo&&y<=capHi){a=Math.min(a,y);z=Math.max(z,y)}}
  const pad=(z-a)*.04||1;a-=pad;z+=pad;
  const X=i=>L+(i+.5)*(W-L-R)/m,Y=v=>T+(z-f(v))*(H-T-B)/(z-a),bw=Math.max(1,Math.min(9,(W-L-R)/m*.62));
  const inv=y=>p.log?Math.exp(y):y,num=v=>Number(v).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="캔들 차트와 내 선"><rect class="cfut" x="${X(n-.5)}" y="${T}" width="${X(m-.5)-X(n-.5)}" height="${H-T-B}"/>`;
  for(let k=0;k<=4;k++){const yv=a+(z-a)*k/4,y=T+(z-yv)*(H-T-B)/(z-a);o+=`<line class="cg" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ct" x="${W-R+6}" y="${y+3}">${num(inv(yv))}</text>`}
  const all=p.bars.map(b=>b[0]).concat(p.future);let last='';const stepLbl=p.tf==='week'?(d=>d.slice(0,4)):(d=>d.slice(0,7));const everyN=Math.ceil(m/9);let lastX=-99;
  for(let i=0;i<m;i++){const k=stepLbl(all[i]);if(k!==last){last=k;if(X(i)-lastX>70){lastX=X(i);o+=`<text class="ct" x="${X(i)}" y="${H-6}" text-anchor="middle">${p.tf==='week'?k:k.slice(2)}</text>`}}}
  for(let i=0;i<n;i++){const [,op,hi,lw,cl]=p.bars[i],up=cl>=op,x=X(i);o+=`<line class="${up?'cu':'cd'}" x1="${x}" x2="${x}" y1="${Y(hi)}" y2="${Y(lw)}"/><rect class="${up?'cu':'cd'}" x="${x-bw/2}" y="${Y(Math.max(op,cl))}" width="${bw}" height="${Math.max(1,Math.abs(Y(op)-Y(cl)))}"/>`}
  const lc=p.bars[n-1][4];o+=`<line class="cnow" x1="${L}" x2="${W-R}" y1="${Y(lc)}" y2="${Y(lc)}"/>`;
  const labs=[];p.lines.forEach((l,li)=>{const col=LINE_COLORS[li%LINE_COLORS.length];const seg=(from,to)=>{let d='',pen=false;for(let i=from;i<to;i++){const v=l.values[i];if(v==null||!(v>0)){pen=false;continue}const y=Y(v);if(y<T-40||y>H-B+40){pen=false;continue}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+y.toFixed(1);pen=true}return d};
    const d1=seg(0,n),d2=seg(Math.max(0,n-1),m);if(d1)o+=`<path class="cl" stroke="${col}" d="${d1}"/>`;if(d2)o+=`<path class="cl fut" stroke="${col}" d="${d2}"/>`;
    const v=l.values[n-1];if(v!=null&&v>0){const y=Y(v);if(y>T&&y<H-B)labs.push({y,col,t:l.label+' '+num(v)})}});
  // 이름표는 위에서부터 순서를 지키며 13px씩 벌린다(가격 순서가 뒤바뀌어 보이지 않게)
  labs.sort((p1,p2)=>p1.y-p2.y);let prev=-99;for(const b of labs){const y=Math.max(b.y,prev+13);prev=y;o+=`<text class="clb" fill="${b.col}" x="${W-R-4}" y="${y-4}" text-anchor="end">${b.t}</text>`}
  return o+'</svg>'}
function openForm(rec,pre){S.msg='';const t=today(),m=new Date();m.setMonth(m.getMonth()-3);
  S.form=rec?JSON.parse(JSON.stringify(rec)):{id:'tl_'+Date.now().toString(36),ticker:'',name:'',theme:S.theme||'',label:'빗각',scale:'log',p1:[m.toISOString().slice(0,10),''],p2:[t,''],note:'',status:'추적',_new:true,...(pre||{})};render();window.scrollTo({top:0,behavior:'smooth'})}

async function save(more){readForm();const f=S.form;const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null};
  const rec={id:f.id,ticker:f.ticker,name:f.name,theme:f.theme,label:f.label,scale:f.scale,p1:[f.p1[0],num(f.p1[1])],p2:[f.p2[0],num(f.p2[1])],note:f.note,status:f.status||'추적'};

    const j=await r.json();if(!j.ok){S.msg=j.error||('저장 실패 '+r.status);if(j.code==='conflict'||j.code==='gone'){await load()}render();return}

async function setStatus(id,st){const x=S.lines.find(l=>l.id===id);if(!x)return;const rec=Object.fromEntries(Object.entries(x).filter(([k])=>!['view','rev','updated_at','kind'].includes(k)));rec.status=st;
  const r=await fetch('/api/track-lines/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({record:rec,base_rev:x.rev})});const j=await r.json();if(!j.ok)S.err=j.error||'변경 실패';S.charts={};await load();if(S.chart)refetchChart()}
async function del(id){if(S.delAsk!==id){S.delAsk=id;render();return}S.delAsk=null;const r=await fetch('/api/track-lines/'+encodeURIComponent(id),{method:'DELETE'});const j=await r.json();if(!j.ok)S.err=j.error||'삭제 실패';S.open=null;S.charts={};await load();if(S.chart)refetchChart()}
