name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"  # Railway(Nixpacks)와 동일 런타임(3.12) 사용
      - run: pip install -r requirements.txt pytest
      - run: python3 test_scanner.py
      - run: pytest test_min_bars_audit.py -v
